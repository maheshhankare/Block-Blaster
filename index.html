/* BLOCK BLASTER — shared styles. Game-specific styles live in minigames.css / relax.css. */
:root {
  --bg1: #6a3df0; --bg2: #2ec4ff;
  --panel: #ffffff; --panel-2: #f3f0ff; --ink: #2b2250; --ink-soft: #6b6390;
  --primary: #ff4d6d; --primary-dark: #d62f52;
  --accent: #ffb703; --good: #06d6a0; --bad: #ef476f; --blue: #3a86ff; --purple: #8338ec;
  --radius: 18px; --radius-sm: 12px;
  --shadow: 0 6px 0 rgba(0,0,0,.15), 0 10px 24px rgba(40,20,90,.18);
  --font: "Baloo 2", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --topbar-h: 56px; --modebar-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font); color: var(--ink);
  background: linear-gradient(160deg, var(--bg1), #9b5de5 45%, var(--bg2));
  background-attachment: fixed;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
button { font-family: inherit; }
#app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 1100px; margin: 0 auto; }
[hidden], .hidden { display: none !important; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top));
  min-height: var(--topbar-h);
}
.logo { flex: 1; margin: 0; text-align: center; font-size: clamp(20px, 5.4vw, 38px); font-weight: 900; letter-spacing: 1px; white-space: nowrap; line-height: 1; }
.logo span { display: inline-block; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
.logo span:nth-child(6n+1) { color: #ffd166; } .logo span:nth-child(6n+2) { color: #ff6b8b; }

.rx-meter-txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; color: #2b2250; }

/* hints and result cards floating over a stage */
.rx-hint {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3; pointer-events: none;
  background: rgba(43,34,80,.82); color: #fff; padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 14px;
  max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rx-overlay { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 6; display: flex; justify-content: center; pointer-events: none; padding: 0 12px; }
.rx-card {
  pointer-events: auto; background: #fff; border-radius: 20px; padding: 14px 18px; text-align: center; max-width: 420px; width: 100%;
  box-shadow: 0 10px 30px rgba(43,34,80,.3); border-top: 6px solid #06d6a0;
}
html:not(.reduced-motion) .rx-card { animation: pop-in .3s cubic-bezier(.2,1.6,.4,1); }
.rx-card p { margin: 4px 0; font-size: 15px; }
.rx-card .btn { margin-top: 8px; }
.rx-card-title { font-size: 20px; font-weight: 900; }

@keyframes rx-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 0 4px #ffd166, 0 3px 0 rgba(43,34,80,.13); } }
.rx-pulse { animation: rx-pulse 1s ease-in-out infinite; }
@keyframes rx-shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-8px, 3px) rotate(-1deg); } 40% { transform: translate(7px, -3px) rotate(1deg); } 60% { transform: translate(-5px, 2px); } 80% { transform: translate(4px, -1px); } }
.rx-shake { animation: rx-shake .5s ease-in-out 2; }
@keyframes rx-wiggle { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.rx-wiggle { animation: rx-wiggle .25s ease-in-out 2; }

/* window cleaning */
.wc-root .rx-meter-fill { background: linear-gradient(90deg, #8ecbff, #4cc9f0 60%, #b5f5ff); }
.wc-bar .rx-chip { min-width: 56px; text-align: center; }

/* neon */
.rx-neon { background: #05041a; }
.rx-bar-dark { background: #110d2e; border-bottom-color: #261e5a; }
.rx-bar-dark .rx-btn { background: #231b52; color: #f1ecff; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.rx-bar-dark .rx-btn.on { background: #3a2a8a; box-shadow: inset 0 0 0 2px #7bf1ff, 0 0 14px rgba(123,241,255,.45); }

/* colour sort */
.rx-sort-stage { background: radial-gradient(circle at 50% 30%, #ffffff, #e8f9f3 60%, #d9f2ff); touch-action: manipulation; }
.rx-sort-board {
  height: 100%; margin: 0 auto; padding: 10px 8px; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  gap: 18px 12px; --ball: 44px;
}
.rx-tube {
  position: relative; width: calc(var(--ball) + 14px); height: calc(var(--ball) * 4 + 8px + var(--ball) * .9 + 12px);
  display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; padding: 0 0 6px;
  border: 3px solid rgba(90,80,160,.35); border-top-width: 0; border-radius: 6px 6px calc(var(--ball) / 1.6) calc(var(--ball) / 1.6);
  background: linear-gradient(90deg, rgba(255,255,255,.75), rgba(255,255,255,.35) 40%, rgba(255,255,255,.6));
  box-shadow: 0 6px 0 rgba(43,34,80,.08), inset 0 -4px 0 rgba(43,34,80,.06); cursor: pointer; transition: transform .15s, border-color .15s;
}
.rx-tube::before { content: ''; position: absolute; top: -3px; left: -7px; right: -7px; height: 7px; border-radius: 4px; background: rgba(90,80,160,.35); }
.rx-tube.sel { transform: translateY(-4px); border-color: #ffb703; }
.rx-tube.sel::before { background: #ffb703; }
.rx-tube.done { border-color: #06d6a0; }
.rx-tube.done::before { background: #06d6a0; }
.rx-tube.done::after { content: '⭐'; position: absolute; bottom: -14px; font-size: 18px; }
.rx-tube.hint { box-shadow: 0 0 0 4px #ffd166, 0 0 18px #ffd166; }
.rx-ball {
  flex-shrink: 0; width: var(--ball); height: var(--ball); border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 32% 28%, #fff 0 9%, color-mix(in srgb, var(--c) 55%, white) 20%, var(--c) 58%, color-mix(in srgb, var(--c) 72%, black) 100%);
  box-shadow: 0 2px 3px rgba(0,0,0,.18); transition: transform .24s cubic-bezier(.3,1.35,.5,1);
}
.rx-ball i { font-style: normal; color: rgba(255,255,255,.8); font-size: calc(var(--ball) * .38); line-height: 1; text-shadow: 0 1px 1px rgba(0,0,0,.2); }
.rx-ball.lift { transform: translateY(calc(-1 * ((var(--ball) + 2px) * var(--k, 0) + var(--ball) * .9 + 14px))); }

/* sliding picture puzzle */
.rx-slide-stage { display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #fff7d6, #ffe3ef); touch-action: manipulation; }
.rx-slide-board { position: relative; border-radius: 18px; background: #3b2f73; box-shadow: 0 8px 0 rgba(43,34,80,.25), 0 12px 30px rgba(43,34,80,.25); }
.rx-tile {
  position: absolute; left: 0; top: 0; border: 0; padding: 0; border-radius: 10px; cursor: pointer; background-repeat: no-repeat;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.45), 0 2px 0 rgba(0,0,0,.25); transition: transform .16s ease, opacity .4s, border-radius .4s;
}
.rx-tile.blank { opacity: 0; pointer-events: none; }
.rx-slide-board.won .rx-tile { border-radius: 0; box-shadow: none; }
.rx-slide-board.won .rx-tile.blank { opacity: 1; }
.rx-num { display: none; position: absolute; left: 4px; top: 4px; min-width: 22px; height: 22px; border-radius: 11px; padding: 0 5px; background: rgba(43,34,80,.75); color: #fff; font-weight: 900; font-size: 13px; line-height: 22px; }
.rx-slide-board.nums .rx-num { display: block; }
.rx-slide-peek { position: absolute; inset: 0; z-index: 5; border-radius: 18px; background-size: 100% 100%; pointer-events: none; box-shadow: 0 0 0 4px #ffd166; }

/* calmer motion when "Relax animations" is off */
.rx-calm *, .rx-calm *::before, .rx-calm *::after { transition-duration: .05s !important; animation: none !important; }

@media (max-width: 560px) {
  .rx-lbl { display: none; }
  .rx-bar { gap: 4px; padding: 5px 6px; }
  .rx-btn { min-width: 40px; padding: 6px 8px; font-size: 18px; }
  .rx-chip { font-size: 13px; padding: 5px 9px; }
}
@media (max-width: 360px) {
  .rx-swatch-sm { min-width: 34px; padding: 6px; }
  .rx-btn { min-width: 38px; }
}
/* let toolbar buttons wrap one by one in busy toolbars */
.rx-sand .rx-group, .rx-popit .rx-group { display: contents; }
.rx-popit .rx-hint { top: auto; bottom: 10px; }

  <!-- Core -->
  <script>
/* BLOCK BLASTER — core: namespace, local storage, settings, UI helpers, effects.
   Everything is local. No network calls anywhere in the game. */
(function () {
  'use strict';
  var BB = (window.BB = window.BB || {});
  BB.version = '1.0.0';

  /* ---------------- utilities ---------------- */
  BB.util = {
    rand: function (n) { return Math.floor(Math.random() * n); },
    pick: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
    shuffle: function (arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    },
    clamp: function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); },
    esc: function (s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    },
    fmt: function (n) { return Number(n || 0).toLocaleString('en-IN'); },
    el: function (tag, cls, html) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    },
    uid: function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  };

  /* ---------------- storage (localStorage, namespaced, crash-safe) ---------------- */
  var PREFIX = 'bb:';
  var memFallback = {};
  BB.store = {
    get: function (key, def) {
      try {
        var raw = window.localStorage.getItem(PREFIX + key);
        if (raw == null) return def;
        return JSON.parse(raw);
      } catch (e) {
        return key in memFallback ? memFallback[key] : def;
      }
    },
    set: function (key, val) {
      try { window.localStorage.setItem(PREFIX + key, JSON.stringify(val)); }
      catch (e) { memFallback[key] = val; }
    },
    remove: function (key) {
      try { window.localStorage.removeItem(PREFIX + key); } catch (e) { delete memFallback[key]; }
    },
    keys: function () {
      var out = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(PREFIX) === 0) out.push(k.slice(PREFIX.length));
        }
      } catch (e) { out = Object.keys(memFallback); }
      return out;
    },
    resetAll: function () {
      BB.store.keys().forEach(function (k) { BB.store.remove(k); });
      memFallback = {};
    },
    /** A namespaced sub-store, e.g. for one mini-game. */
    ns: function (ns) {
      return {
        get: function (k, d) { return BB.store.get(ns + ':' + k, d); },
        set: function (k, v) { BB.store.set(ns + ':' + k, v); }
      };
    }
  };
  // Ask the browser to keep our data even under storage pressure (best effort).
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------------- settings ---------------- */
  var DEFAULT_SETTINGS = {
    musicOn: true, sfxOn: true, musicVol: 0.35, sfxVol: 0.7,
    reducedMotion: false, relaxSound: true, relaxAnim: true
  };
  var settings = Object.assign({}, DEFAULT_SETTINGS, BB.store.get('settings', {}));
  var settingListeners = [];
  BB.settings = {
    get: function (k) { return settings[k]; },
    all: function () { return Object.assign({}, settings); },
    set: function (k, v) {
      settings[k] = v;
      BB.store.set('settings', settings);
      settingListeners.forEach(function (fn) { try { fn(k, v); } catch (e) {} });
      if (k === 'reducedMotion') document.documentElement.classList.toggle('reduced-motion', !!v);
    },
    onChange: function (fn) { settingListeners.push(fn); },
    reload: function () { settings = Object.assign({}, DEFAULT_SETTINGS, BB.store.get('settings', {})); }
  };
  document.documentElement.classList.toggle('reduced-motion', !!settings.reducedMotion);
  BB.reducedMotion = function () {
    return !!settings.reducedMotion;
  };

  /* ---------------- UI helpers: modal, confirm, toast ---------------- */
  BB.ui = {};
  BB.ui.modal = function (opts) {
    var root = document.getElementById('modal-root');
    var wrap = BB.util.el('div', 'modal-backdrop');
    var box = BB.util.el('div', 'modal' + (opts.cls ? ' ' + opts.cls : ''));
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    if (opts.title) box.appendChild(BB.util.el('h2', 'modal-title', opts.title));
    var body = BB.util.el('div', 'modal-body');
    if (typeof opts.html === 'string') body.innerHTML = opts.html;
    else if (opts.html) body.appendChild(opts.html);
    box.appendChild(body);
    var btns = BB.util.el('div', 'modal-buttons');
    function close() {
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (opts.onClose) opts.onClose();
    }
    (opts.buttons || [{ label: 'OK' }]).forEach(function (b) {
      var btn = BB.util.el('button', 'btn ' + (b.cls || 'btn-primary'), b.label);
      btn.addEventListener('click', function () {
        if (BB.audio) BB.audio.sfx('click');
        var keep = b.onClick ? b.onClick(close) : false;
        if (keep !== true) close();
      });
      btns.appendChild(btn);
    });
    box.appendChild(btns);
    wrap.appendChild(box);
    if (opts.dismissable !== false) {
      wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    }
    root.appendChild(wrap);
    var first = btns.querySelector('button');
    if (first) setTimeout(function () { try { first.focus(); } catch (e) {} }, 30);
    return { close: close, body: body, box: box };
  };
  BB.ui.confirm = function (title, message, okLabel) {
    return new Promise(function (resolve) {
      var answered = false;
      BB.ui.modal({
        title: title, html: '<p>' + message + '</p>',
        onClose: function () { if (!answered) resolve(false); },
        buttons: [
          { label: 'Cancel', cls: 'btn-ghost', onClick: function () { answered = true; resolve(false); } },
          { label: okLabel || 'Yes', cls: 'btn-danger', onClick: function () { answered = true; resolve(true); } }
        ]
      });
    });
  };
  BB.ui.toast = function (msg, ms) {
    var t = BB.util.el('div', 'toast', BB.util.esc(msg));
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('show'); });
    setTimeout(function () {
      t.classList.remove('show');
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400);
    }, ms || 1800);
  };

  /* ---------------- effects: particles, confetti, fireworks ---------------- */
  var fxCanvas, fxCtx, particles = [], fxRunning = false;
  function ensureFx() {
    if (fxCanvas) return;
    fxCanvas = document.createElement('canvas');
    fxCanvas.id = 'fx-canvas';
    document.body.appendChild(fxCanvas);
    fxCtx = fxCanvas.getContext('2d');
    function size() {
      var dpr = window.devicePixelRatio || 1;
      fxCanvas.width = innerWidth * dpr; fxCanvas.height = innerHeight * dpr;
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    window.addEventListener('resize', size);
  }
  function fxLoop() {
    fxCtx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= 1;
      p.vy += p.g; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      fxCtx.globalAlpha = Math.min(1, p.life / 30);
      fxCtx.fillStyle = p.color;
      fxCtx.save();
      fxCtx.translate(p.x, p.y); fxCtx.rotate(p.rot);
      if (p.shape === 'circle') { fxCtx.beginPath(); fxCtx.arc(0, 0, p.size / 2, 0, 6.283); fxCtx.fill(); }
      else fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * (p.shape === 'confetti' ? 0.5 : 1));
      fxCtx.restore();
    }
    fxCtx.globalAlpha = 1;
    if (particles.length) requestAnimationFrame(fxLoop);
    else fxRunning = false;
  }
  var PALETTE = ['#ff4d6d', '#ffb703', '#06d6a0', '#118ab2', '#8338ec', '#ff7f11', '#3a86ff', '#fb5607'];
  BB.fx = {
    palette: PALETTE,
    burst: function (x, y, color, count, opts) {
      if (settings.reducedMotion) return;
      ensureFx();
      opts = opts || {};
      count = count || 14;
      for (var i = 0; i < count; i++) {
        var a = Math.random() * Math.PI * 2, s = (opts.speed || 4) * (0.4 + Math.random());
        particles.push({
          x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (opts.up || 1),
          g: opts.gravity == null ? 0.15 : opts.gravity, life: 40 + Math.random() * 30,
          size: (opts.size || 7) * (0.5 + Math.random()), color: color || BB.util.pick(PALETTE),
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, shape: opts.shape || 'square'
        });
      }
      if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
    },
    burstAt: function (el, color, count, opts) {
      var r = el.getBoundingClientRect();
      BB.fx.burst(r.left + r.width / 2, r.top + r.height / 2, color, count, opts);
    },
    confetti: function (amount) {
      if (settings.reducedMotion) return;
      ensureFx();
      for (var i = 0; i < (amount || 120); i++) {
        particles.push({
          x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.5,
          vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3, g: 0.05,
          life: 160 + Math.random() * 80, size: 8 + Math.random() * 6,
          color: BB.util.pick(PALETTE), rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, shape: 'confetti'
        });
      }
      if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
    },
    fireworks: function (bursts) {
      if (settings.reducedMotion) return;
      var n = bursts || 8;
      for (var i = 0; i < n; i++) {
        (function (k) {
          setTimeout(function () {
            BB.fx.burst(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * (0.15 + Math.random() * 0.4),
              BB.util.pick(PALETTE), 40, { speed: 6, gravity: 0.06, shape: 'circle', size: 6, up: 0 });
            if (BB.audio) BB.audio.sfx('firework');
          }, k * 350);
        })(i);
      }
    }
  };

  /* ---------------- profiles (shared by home + quizzes) ---------------- */
  function emptyQuizStats() {
    return { played: 0, answered: 0, correct: 0, score: 0, stars: 0, history: [], best: {}, achievements: [] };
  }
  BB.profiles = {
    list: function () { return BB.store.get('profiles', []); },
    saveList: function (list) { BB.store.set('profiles', list); },
    currentId: function () { return BB.store.get('currentProfile', null); },
    current: function () {
      var id = BB.profiles.currentId();
      return BB.profiles.list().filter(function (p) { return p.id === id; })[0] || null;
    },
    setCurrent: function (id) { BB.store.set('currentProfile', id); BB.events.emit('profile'); },
    create: function (data) {
      var p = {
        id: BB.util.uid(), name: String(data.name).trim().slice(0, 24), age: parseInt(data.age, 10),
        avatar: data.avatar, created: Date.now(), quiz: emptyQuizStats()
      };
      var list = BB.profiles.list(); list.push(p); BB.profiles.saveList(list);
      BB.profiles.setCurrent(p.id);
      return p;
    },
    update: function (id, patch) {
      var list = BB.profiles.list();
      list.forEach(function (p) { if (p.id === id) Object.assign(p, patch); });
      BB.profiles.saveList(list); BB.events.emit('profile');
    },
    remove: function (id) {
      var list = BB.profiles.list().filter(function (p) { return p.id !== id; });
      BB.profiles.saveList(list);
      if (BB.profiles.currentId() === id) BB.profiles.setCurrent(list[0] ? list[0].id : null);
      BB.events.emit('profile');
    },
    /** Rule from the spec: question bank = one year below the player's age, minimum 4, maximum 12. */
    bankAgeFor: function (age) {
      var a = parseInt(age, 10);
      if (!(a > 0)) return 4;
      return Math.max(4, Math.min(12, a - 1));
    },
    emptyQuizStats: emptyQuizStats
  };

  /* ---------------- tiny event bus ---------------- */
  var handlers = {};
  BB.events = {
    on: function (name, fn) { (handlers[name] = handlers[name] || []).push(fn); },
    emit: function (name, data) { (handlers[name] || []).forEach(function (fn) { try { fn(data); } catch (e) { console.error(e); } }); }
  };

  /* ---------------- mode registry (filled by js/modes/*.js) ---------------- */
  BB.modes = {};
  BB.registerMode = function (id, def) { BB.modes[id] = def; };
})();

</script>
  <script>
/* BLOCK BLASTER — audio. All sound effects and music are synthesized locally
   with the Web Audio API (original, procedurally generated; nothing streamed). */
(function () {
  'use strict';
  var BB = window.BB;
  var ctx = null, master = null, sfxBus = null, musicBus = null;
  var unlocked = false;

  function init() {
    if (ctx) return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;

  { id: "gk-08-005", cat: "gk", age: 8, diff: 2, q: "How many days are in a leap year?", choices: ["365","364","366","360"], answer: 2, explain: "A leap year has 366 days because February gets an extra day." },
  { id: "gk-08-006", cat: "gk", age: 8, diff: 2, q: "Which part of a plant takes in water from the soil?", choices: ["Flowers","Roots","Leaves","Fruits"], answer: 1, explain: "Roots take in water and nutrients from the soil." },
  { id: "gk-08-007", cat: "gk", age: 8, diff: 2, q: "Which animal is known for its black and white fur and eats bamboo?", choices: ["Giant panda","Zebra","Polar bear","Skunk"], answer: 0, explain: "The giant panda eats mostly bamboo and lives in China." },
  { id: "gk-08-008", cat: "gk", age: 8, diff: 2, q: "What is a baby frog called?", choices: ["Tadpole","Cub","Kid","Foal"], answer: 0, explain: "A baby frog is called a tadpole. It lives in water and has a tail." },
  { id: "gk-08-009", cat: "gk", age: 8, diff: 3, q: "What do we call animals that eat both plants and meat?", choices: ["Herbivores","Carnivores","Insects","Omnivores"], answer: 3, explain: "Omnivores, like bears and humans, eat both plants and meat." },
  { id: "gk-08-010", cat: "gk", age: 8, diff: 3, q: "Which game is played with a shuttlecock?", choices: ["Football","Cricket","Hockey","Badminton"], answer: 3, explain: "Badminton players hit a shuttlecock over a net with rackets." },
  { id: "gk-08-011", cat: "gk", age: 8, diff: 3, q: "In which country did the Olympic Games begin long ago?", choices: ["India","Brazil","Greece","Japan"], answer: 2, explain: "The ancient Olympic Games began in Greece thousands of years ago." },
  { id: "gk-08-012", cat: "gk", age: 8, diff: 3, q: "How many minutes are in one hour?", choices: ["100","30","60","24"], answer: 2, explain: "One hour has 60 minutes." },
  { id: "gk-08-013", cat: "gk", age: 8, diff: 3, q: "Which insect lives in a hive and makes honey?", choices: ["Ant","Honeybee","Butterfly","Mosquito"], answer: 1, explain: "Honeybees live together in hives and make honey from flower nectar." },
  { id: "gk-09-001", cat: "gk", age: 9, diff: 1, q: "Who was known as the \"Father of the Nation\" in India?", choices: ["Jawaharlal Nehru","Bhagat Singh","Mahatma Gandhi","Subhas Chandra Bose"], answer: 2, explain: "Mahatma Gandhi is called the Father of the Nation for leading India's peaceful freedom struggle." },
  { id: "gk-09-002", cat: "gk", age: 9, diff: 1, q: "Which is the national game of Bangladesh?", choices: ["Cricket","Kabaddi","Tennis","Golf"], answer: 1, explain: "Kabaddi is the national game of Bangladesh. It is also very popular in India." },
  { id: "gk-09-003", cat: "gk", age: 9, diff: 1, q: "What do we call a scientist who studies stars and planets?", choices: ["Astronomer","Doctor","Chef","Architect"], answer: 0, explain: "An astronomer studies stars, planets and space." },
  { id: "gk-09-004", cat: "gk", age: 9, diff: 2, q: "What is the young one of a cow called?", choices: ["Calf","Kid","Lamb","Foal"], answer: 0, explain: "A young cow is called a calf." },
  { id: "gk-09-005", cat: "gk", age: 9, diff: 2, q: "Which bird is a symbol of peace?", choices: ["Crow","Vulture","Dove","Owl"], answer: 2, explain: "The white dove is a symbol of peace around the world." },
  { id: "gk-09-006", cat: "gk", age: 9, diff: 2, q: "Which planet is closest to the Sun?", choices: ["Earth","Mars","Jupiter","Mercury"], answer: 3, explain: "Mercury is the closest planet to the Sun." },
  { id: "gk-09-007", cat: "gk", age: 9, diff: 2, q: "Who invented the telephone?", choices: ["Alexander Graham Bell","Thomas Edison","Isaac Newton","Albert Einstein"], answer: 0, explain: "Alexander Graham Bell is credited with inventing the telephone in 1876." },
  { id: "gk-09-008", cat: "gk", age: 9, diff: 2, q: "What is the home of a lion called?", choices: ["Nest","Hive","Den","Kennel"], answer: 2, explain: "A lion rests in a den." },
  { id: "gk-09-009", cat: "gk", age: 9, diff: 2, q: "How many sides does a hexagon have?", choices: ["5","7","8","6"], answer: 3, explain: "A hexagon has 6 sides, like the cells in a honeycomb." },
  { id: "gk-09-010", cat: "gk", age: 9, diff: 3, q: "What do we call a group of wolves?", choices: ["Pack","Herd","Flock","School"], answer: 0, explain: "Wolves live and hunt together in a pack." },
  { id: "gk-09-011", cat: "gk", age: 9, diff: 3, q: "Which Indian monument was built by Shah Jahan in memory of his wife?", choices: ["Taj Mahal","Qutub Minar","Red Fort","Gateway of India"], answer: 0, explain: "Shah Jahan built the Taj Mahal in Agra in memory of his wife Mumtaz Mahal." },
  { id: "gk-09-012", cat: "gk", age: 9, diff: 3, q: "Which gas do humans breathe out?", choices: ["Oxygen","Helium","Carbon dioxide","Hydrogen"], answer: 2, explain: "We breathe in oxygen and breathe out carbon dioxide." },
  { id: "gk-09-013", cat: "gk", age: 9, diff: 3, q: "What is the main language of Brazil?", choices: ["Spanish","English","Portuguese","French"], answer: 2, explain: "People in Brazil mainly speak Portuguese." },
  { id: "gk-10-001", cat: "gk", age: 10, diff: 1, q: "Which is the largest planet in our solar system?", choices: ["Saturn","Jupiter","Earth","Neptune"], answer: 1, explain: "Jupiter is the largest planet. More than 1,000 Earths could fit inside it." },
  { id: "gk-10-002", cat: "gk", age: 10, diff: 1, q: "Who wrote India's national anthem \"Jana Gana Mana\"?", choices: ["Bankim Chandra Chatterjee","Sarojini Naidu","Rabindranath Tagore","Premchand"], answer: 2, explain: "Rabindranath Tagore wrote \"Jana Gana Mana\"." },
  { id: "gk-10-003", cat: "gk", age: 10, diff: 1, q: "What is the currency of Japan?", choices: ["Dollar","Yen","Rupee","Euro"], answer: 1, explain: "Japan uses the yen as its money." },
  { id: "gk-10-004", cat: "gk", age: 10, diff: 2, q: "Which is the longest river in India?", choices: ["Yamuna","Godavari","Narmada","Ganga"], answer: 3, explain: "The Ganga is the longest river flowing within India." },
  { id: "gk-10-005", cat: "gk", age: 10, diff: 2, q: "In which sport is the term \"checkmate\" used?", choices: ["Football","Tennis","Boxing","Chess"], answer: 3, explain: "In chess, checkmate means the king is trapped and the game is over." },
  { id: "gk-10-006", cat: "gk", age: 10, diff: 2, q: "What is the hardest natural substance?", choices: ["Gold","Iron","Diamond","Glass"], answer: 2, explain: "Diamond is the hardest natural material on Earth." },
  { id: "gk-10-007", cat: "gk", age: 10, diff: 2, q: "Which is the largest animal living on land?", choices: ["Hippopotamus","African elephant","Rhinoceros","Giraffe"], answer: 1, explain: "The African elephant is the largest land animal. It can weigh as much as six cars." },
  { id: "gk-10-008", cat: "gk", age: 10, diff: 2, q: "How many years make a century?", choices: ["10","1000","50","100"], answer: 3, explain: "A century is a period of 100 years." },
  { id: "gk-10-009", cat: "gk", age: 10, diff: 2, q: "Who was the first person to walk on the Moon?", choices: ["Yuri Gagarin","Rakesh Sharma","Neil Armstrong","Kalpana Chawla"], answer: 2, explain: "Neil Armstrong walked on the Moon in 1969." },
  { id: "gk-10-010", cat: "gk", age: 10, diff: 3, q: "Who was the first Indian to travel to space?", choices: ["Kalpana Chawla","Sunita Williams","APJ Abdul Kalam","Rakesh Sharma"], answer: 3, explain: "Rakesh Sharma went to space in 1984." },
  { id: "gk-10-011", cat: "gk", age: 10, diff: 3, q: "Which is the smallest continent?", choices: ["Europe","Antarctica","Australia","South America"], answer: 2, explain: "Australia is the smallest continent by land area." },
  { id: "gk-10-012", cat: "gk", age: 10, diff: 3, q: "What do we call a word that reads the same backwards, like \"level\"?", choices: ["Synonym","Antonym","Palindrome","Acronym"], answer: 2, explain: "A palindrome reads the same forwards and backwards, like \"level\" or \"madam\"." },
  { id: "gk-10-013", cat: "gk", age: 10, diff: 3, q: "Which instrument is used to measure temperature?", choices: ["Barometer","Thermometer","Ruler","Compass"], answer: 1, explain: "A thermometer measures how hot or cold something is." },
  { id: "gk-11-001", cat: "gk", age: 11, diff: 1, q: "Which organisation launched the Chandrayaan missions to the Moon?", choices: ["NASA","ISRO","WHO","UNICEF"], answer: 1, explain: "ISRO, the Indian Space Research Organisation, launched the Chandrayaan missions." },
  { id: "gk-11-002", cat: "gk", age: 11, diff: 1, q: "How many sides does an octagon have?", choices: ["6","10","8","12"], answer: 2, explain: "An octagon has 8 sides. A stop sign is shaped like an octagon." },
  { id: "gk-11-003", cat: "gk", age: 11, diff: 1, q: "Which famous scientist is known for the theory of relativity?", choices: ["Isaac Newton","Albert Einstein","Galileo Galilei","Marie Curie"], answer: 1, explain: "Albert Einstein developed the theory of relativity." },
  { id: "gk-11-004", cat: "gk", age: 11, diff: 2, q: "What is the Roman numeral for 50?", choices: ["L","C","X","D"], answer: 0, explain: "In Roman numerals, L stands for 50." },
  { id: "gk-11-005", cat: "gk", age: 11, diff: 2, q: "Who was known as the \"Missile Man of India\"?", choices: ["A. P. J. Abdul Kalam","C. V. Raman","Homi Bhabha","Vikram Sarabhai"], answer: 0, explain: "Dr A. P. J. Abdul Kalam worked on India's missile programmes and later became President." },
  { id: "gk-11-006", cat: "gk", age: 11, diff: 2, q: "Which is the largest ocean on Earth?", choices: ["Atlantic Ocean","Indian Ocean","Arctic Ocean","Pacific Ocean"], answer: 3, explain: "The Pacific Ocean is the largest and deepest ocean." },
  { id: "gk-11-007", cat: "gk", age: 11, diff: 2, q: "Which scientist discovered penicillin, the first antibiotic?", choices: ["Louis Pasteur","Edward Jenner","Alexander Fleming","Charles Darwin"], answer: 2, explain: "Alexander Fleming discovered penicillin in 1928." },
  { id: "gk-11-008", cat: "gk", age: 11, diff: 2, q: "In which city is the Gateway of India located?", choices: ["Delhi","Kolkata","Mumbai","Chennai"], answer: 2, explain: "The Gateway of India stands by the sea in Mumbai." },
  { id: "gk-11-009", cat: "gk", age: 11, diff: 2, q: "Which country gave the Statue of Liberty to the USA as a gift?", choices: ["France","England","Spain","Germany"], answer: 0, explain: "France gave the Statue of Liberty to the United States in 1886 as a sign of friendship." },
  { id: "gk-11-010", cat: "gk", age: 11, diff: 3, q: "How many bones are in an adult human body?", choices: ["106","300","206","512"], answer: 2, explain: "An adult human skeleton has 206 bones." },
  { id: "gk-11-011", cat: "gk", age: 11, diff: 3, q: "Which ancient wonder still stands today?", choices: ["Great Pyramid of Giza","Hanging Gardens of Babylon","Colossus of Rhodes","Lighthouse of Alexandria"], answer: 0, explain: "The Great Pyramid of Giza is the only one of the Seven Wonders of the Ancient World still standing." },
  { id: "gk-11-012", cat: "gk", age: 11, diff: 3, q: "Which Indian scientist won the Nobel Prize for Physics in 1930?", choices: ["C. V. Raman","Jagadish Chandra Bose","Srinivasa Ramanujan","Homi Bhabha"], answer: 0, explain: "C. V. Raman won the Nobel Prize for discovering the Raman effect in how light scatters." },
  { id: "gk-11-013", cat: "gk", age: 11, diff: 3, q: "What is the study of earthquakes called?", choices: ["Seismology","Zoology","Botany","Astronomy"], answer: 0, explain: "Seismology is the scientific study of earthquakes." },
  { id: "gk-12-001", cat: "gk", age: 12, diff: 1, q: "Which Indian mathematician is famous for his work on numbers, including the number 1729?", choices: ["Aryabhata","Srinivasa Ramanujan","C. V. Raman","Bhaskara"], answer: 1, explain: "Srinivasa Ramanujan was a brilliant mathematician. 1729 is called the Hardy-Ramanujan number." },
  { id: "gk-12-002", cat: "gk", age: 12, diff: 1, q: "Who painted the \"Mona Lisa\"?", choices: ["Pablo Picasso","Leonardo da Vinci","Vincent van Gogh","Michelangelo"], answer: 1, explain: "Leonardo da Vinci painted the Mona Lisa in the early 1500s." },
  { id: "gk-12-003", cat: "gk", age: 12, diff: 1, q: "What does the abbreviation \"UN\" stand for?", choices: ["Universal Network","United Navy","United Nations","Union of Nations"], answer: 2, explain: "UN stands for United Nations, an organisation where countries work together." },
  { id: "gk-12-004", cat: "gk", age: 12, diff: 2, q: "Which ancient Indian mathematician and astronomer has India's first satellite named after him?", choices: ["Brahmagupta","Varahamihira","Aryabhata","Charaka"], answer: 2, explain: "India's first satellite, launched in 1975, was named Aryabhata." },
  { id: "gk-12-005", cat: "gk", age: 12, diff: 2, q: "Who wrote the play \"Romeo and Juliet\"?", choices: ["William Shakespeare","Charles Dickens","Mark Twain","Leo Tolstoy"], answer: 0, explain: "William Shakespeare wrote \"Romeo and Juliet\" in the 1590s." },
  { id: "gk-12-006", cat: "gk", age: 12, diff: 2, q: "What is the Roman numeral for 1000?", choices: ["C","M","D","L"], answer: 1, explain: "In Roman numerals, M stands for 1000." },
  { id: "gk-12-007", cat: "gk", age: 12, diff: 2, q: "Which scientist proposed the theory of evolution by natural selection?", choices: ["Gregor Mendel","Charles Darwin","Isaac Newton","Louis Pasteur"], answer: 1, explain: "Charles Darwin explained evolution by natural selection in 1859." },
  { id: "gk-12-008", cat: "gk", age: 12, diff: 2, q: "Which document lays down the basic laws and rights of India?", choices: ["The Census","The Budget","The Constitution","The Gazette"], answer: 2, explain: "The Constitution of India came into force on 26 January 1950." },
  { id: "gk-12-009", cat: "gk", age: 12, diff: 2, q: "In computers, what does \"CPU\" stand for?", choices: ["Computer Power Unit","Central Processing Unit","Central Program Utility","Control Print Unit"], answer: 1, explain: "The CPU is the \"brain\" of a computer that carries out instructions." },
  { id: "gk-12-010", cat: "gk", age: 12, diff: 3, q: "Who was the first woman to win a Nobel Prize?", choices: ["Mother Teresa","Florence Nightingale","Marie Curie","Ada Lovelace"], answer: 2, explain: "Marie Curie won the Nobel Prize in Physics in 1903 and later a second one in Chemistry." },
  { id: "gk-12-011", cat: "gk", age: 12, diff: 3, q: "Which empire built Machu Picchu in the Andes mountains?", choices: ["Maya","Roman","Mughal","Inca"], answer: 3, explain: "The Inca built Machu Picchu in Peru in the 1400s." },
  { id: "gk-12-012", cat: "gk", age: 12, diff: 3, q: "What is the name of the line of latitude at 0 degrees?", choices: ["Prime Meridian","Equator","Tropic of Cancer","Arctic Circle"], answer: 1, explain: "The Equator is at 0 degrees latitude and divides Earth into north and south halves." },
  { id: "gk-12-013", cat: "gk", age: 12, diff: 3, q: "Which Indian emperor spread Buddhism after the Kalinga war?", choices: ["Ashoka","Akbar","Chandragupta Maurya","Harsha"], answer: 0, explain: "After the Kalinga war, Emperor Ashoka gave up violence and spread Buddhism." },
  { id: "math-04-001", cat: "math", age: 4, diff: 1, q: "How many apples are there?", pic: "🍎🍎🍎", choices: ["2","4","5","3"], answer: 3, explain: "Count them: 1, 2, 3. There are 3 apples." },
  { id: "math-04-002", cat: "math", age: 4, diff: 1, q: "How many stars are there?", pic: "⭐⭐", choices: ["1","3","2","4"], answer: 2, explain: "Count them: 1, 2. There are 2 stars." },
  { id: "math-04-003", cat: "math", age: 4, diff: 1, q: "How many ducks are there?", pic: "🦆🦆🦆🦆", choices: ["3","5","4","2"], answer: 2, explain: "Count them: 1, 2, 3, 4. There are 4 ducks." },
  { id: "math-04-004", cat: "math", age: 4, diff: 1, q: "What number comes after 1?", choices: ["3","0","5","2"], answer: 3, explain: "When we count, 2 comes right after 1." },
  { id: "math-04-005", cat: "math", age: 4, diff: 2, q: "What number comes after 4?", choices: ["3","5","6","7"], answer: 1, explain: "We count 3, 4, 5. So 5 comes after 4." },
  { id: "math-04-006", cat: "math", age: 4, diff: 2, q: "How many balloons are there?", pic: "🎈🎈🎈🎈🎈", choices: ["4","5","6","3"], answer: 1, explain: "Count them: 1, 2, 3, 4, 5. There are 5 balloons." },
  { id: "math-04-007", cat: "math", age: 4, diff: 2, q: "1 cookie and 1 more cookie make how many?", pic: "🍪🍪", choices: ["1","3","2","4"], answer: 2, explain: "1 and 1 more make 2." },
  { id: "math-04-008", cat: "math", age: 4, diff: 2, q: "Which number is bigger: 2 or 5?", choices: ["5","2","They are the same","1"], answer: 0, explain: "5 is bigger than 2." },
  { id: "math-04-009", cat: "math", age: 4, diff: 2, q: "How many fingers are on one hand?", choices: ["5","4","6","10"], answer: 0, explain: "One hand has 5 fingers." },
  { id: "math-04-010", cat: "math", age: 4, diff: 3, q: "2 fish and 1 more fish make how many?", pic: "🐟🐟🐟", choices: ["2","4","1","3"], answer: 3, explain: "2 and 1 more make 3." },
  { id: "math-04-011", cat: "math", age: 4, diff: 3, q: "What number comes before 3?", choices: ["4","1","2","5"], answer: 2, explain: "We count 1, 2, 3. So 2 comes before 3." },
  { id: "math-04-012", cat: "math", age: 4, diff: 3, q: "You have 3 sweets and eat 1. How many are left?", pic: "🍬🍬🍬", choices: ["2","3","1","4"], answer: 0, explain: "3 take away 1 leaves 2." },
  { id: "math-04-013", cat: "math", age: 4, diff: 3, q: "How many wheels does a bicycle have?", pic: "🚲", choices: ["3","4","2","1"], answer: 2, explain: "A bicycle has 2 wheels." },
  { id: "math-05-001", cat: "math", age: 5, diff: 1, q: "What is 2 + 2?", choices: ["3","5","6","4"], answer: 3, explain: "2 and 2 more make 4." },
  { id: "math-05-002", cat: "math", age: 5, diff: 1, q: "How many cars are there?", pic: "🚗🚗🚗🚗🚗🚗", choices: ["5","7","4","6"], answer: 3, explain: "Count them all: there are 6 cars." },
  { id: "math-05-003", cat: "math", age: 5, diff: 1, q: "What is 3 + 1?", choices: ["2","5","3","4"], answer: 3, explain: "3 and 1 more make 4." },
  { id: "math-05-004", cat: "math", age: 5, diff: 1, q: "What number comes after 9?", choices: ["10","8","11","7"], answer: 0, explain: "After 9 comes 10." },
  { id: "math-05-005", cat: "math", age: 5, diff: 2, q: "What is 5 - 2?", choices: ["2","4","3","7"], answer: 2, explain: "5 take away 2 leaves 3." },
  { id: "math-05-006", cat: "math", age: 5, diff: 2, q: "What is 4 + 3?", choices: ["6","7","8","5"], answer: 1, explain: "4 and 3 more make 7." },
  { id: "math-05-007", cat: "math", age: 5, diff: 2, q: "How many legs do 2 hens have together?", pic: "🐔🐔", choices: ["2","4","3","6"], answer: 1, explain: "Each hen has 2 legs. 2 + 2 = 4." },
  { id: "math-05-008", cat: "math", age: 5, diff: 2, q: "Which number is the smallest?", choices: ["7","4","9","1"], answer: 3, explain: "1 is the smallest of these numbers." },
  { id: "math-05-009", cat: "math", age: 5, diff: 2, q: "What number is between 6 and 8?", choices: ["5","9","7","6"], answer: 2, explain: "We count 6, 7, 8. So 7 is in between." },
  { id: "math-05-010", cat: "math", age: 5, diff: 3, q: "You have 6 grapes and eat 3. How many are left?", choices: ["2","3","4","9"], answer: 1, explain: "6 take away 3 leaves 3." },
  { id: "math-05-011", cat: "math", age: 5, diff: 3, q: "What comes next: 2, 4, 6, ...?", choices: ["7","10","9","8"], answer: 3, explain: "We are counting in twos: 2, 4, 6, 8." },
  { id: "math-05-012", cat: "math", age: 5, diff: 3, q: "What is 5 + 5?", choices: ["9","11","55","10"], answer: 3, explain: "5 and 5 more make 10. That is all your fingers!" },
  { id: "math-05-013", cat: "math", age: 5, diff: 3, q: "Riya has 2 red balls and 3 blue balls. How many balls does she have?", choices: ["4","5","6","3"], answer: 1, explain: "2 + 3 = 5 balls in all." },
  { id: "math-06-001", cat: "math", age: 6, diff: 1, q: "What is 6 + 4?", choices: ["10","9","11","12"], answer: 0, explain: "6 + 4 = 10." },
  { id: "math-06-002", cat: "math", age: 6, diff: 1, q: "What is 9 - 4?", choices: ["5","6","4","13"], answer: 0, explain: "9 take away 4 leaves 5." },
  { id: "math-06-003", cat: "math", age: 6, diff: 1, q: "How many tens are in 30?", choices: ["3","30","1","10"], answer: 0, explain: "30 is 3 tens: 10, 20, 30." },
  { id: "math-06-004", cat: "math", age: 6, diff: 2, q: "What is 8 + 7?", choices: ["14","16","15","13"], answer: 2, explain: "8 + 7 = 15. Think 8 + 2 = 10, then 5 more makes 15." },
  { id: "math-06-005", cat: "math", age: 6, diff: 2, q: "What comes next: 5, 10, 15, ...?", choices: ["25","16","18","20"], answer: 3, explain: "We are counting in fives: 5, 10, 15, 20." },
  { id: "math-06-006", cat: "math", age: 6, diff: 2, q: "What is 12 - 5?", choices: ["6","8","17","7"], answer: 3, explain: "12 - 5 = 7." },
  { id: "math-06-007", cat: "math", age: 6, diff: 2, q: "Which number is the largest: 19, 91, 9 or 61?", choices: ["19","91","61","9"], answer: 1, explain: "91 has 9 tens, which is the most." },
  { id: "math-06-008", cat: "math", age: 6, diff: 2, q: "A box has 10 crayons. 3 are broken. How many are not broken?", choices: ["13","7","6","8"], answer: 1, explain: "10 - 3 = 7 crayons are not broken." },
  { id: "math-06-009", cat: "math", age: 6, diff: 2, q: "What is double 6?", choices: ["12","10","8","66"], answer: 0, explain: "Double means two times. 6 + 6 = 12." },
  { id: "math-06-010", cat: "math", age: 6, diff: 3, q: "Aman has 15 marbles and gets 5 more. How many marbles does he have now?", choices: ["10","25","19","20"], answer: 3, explain: "15 + 5 = 20 marbles." },
  { id: "math-06-011", cat: "math", age: 6, diff: 3, q: "What is half of 10?", choices: ["2","20","4","5"], answer: 3, explain: "Half of 10 is 5, because 5 + 5 = 10." },
  { id: "math-06-012", cat: "math", age: 6, diff: 3, q: "How many sides does a triangle have?", choices: ["4","5","3","2"], answer: 2, explain: "A triangle has 3 sides and 3 corners." },
  { id: "math-06-013", cat: "math", age: 6, diff: 3, q: "What is 10 + 10 + 10?", choices: ["20","40","100","30"], answer: 3, explain: "Three tens make 30." },
  { id: "math-07-001", cat: "math", age: 7, diff: 1, q: "What is 25 + 10?", choices: ["26","35","45","30"], answer: 1, explain: "25 + 10 = 35. Adding 10 makes the tens digit go up by 1." },
  { id: "math-07-002", cat: "math", age: 7, diff: 1, q: "What is 2 x 5?", choices: ["10","7","25","12"], answer: 0, explain: "2 groups of 5 make 10." },
  { id: "math-07-003", cat: "math", age: 7, diff: 1, q: "What is 40 - 20?", choices: ["60","20","10","30"], answer: 1, explain: "4 tens take away 2 tens leaves 2 tens, which is 20." },
  { id: "math-07-004", cat: "math", age: 7, diff: 2, q: "What is 3 x 4?", choices: ["7","10","12","14"], answer: 2, explain: "3 groups of 4 make 12." },
  { id: "math-07-005", cat: "math", age: 7, diff: 2, q: "A pencil costs 5 rupees. How much do 3 pencils cost?", choices: ["8 rupees","15 rupees","10 rupees","20 rupees"], answer: 1, explain: "3 x 5 = 15 rupees." },
  { id: "math-07-006", cat: "math", age: 7, diff: 2, q: "What is 47 + 25?", choices: ["72","62","71","82"], answer: 0, explain: "47 + 25 = 72. 7 + 5 = 12, so carry 1 ten." },
  { id: "math-07-007", cat: "math", age: 7, diff: 2, q: "What is 63 - 28?", choices: ["45","25","35","34"], answer: 2, explain: "63 - 28 = 35." },
  { id: "math-07-008", cat: "math", age: 7, diff: 2, q: "How many 10-rupee notes make 100 rupees?", choices: ["5","10","20","100"], answer: 1, explain: "10 x 10 = 100, so 10 notes are needed." },
  { id: "math-07-009", cat: "math", age: 7, diff: 2, q: "What comes next: 3, 6, 9, 12, ...?", choices: ["14","13","16","15"], answer: 3, explain: "We add 3 each time. 12 + 3 = 15." },
  { id: "math-07-010", cat: "math", age: 7, diff: 3, q: "There are 4 tables with 5 children at each. How many children are there?", choices: ["9","20","25","15"], answer: 1, explain: "4 x 5 = 20 children." },
  { id: "math-07-011", cat: "math", age: 7, diff: 3, q: "20 sweets are shared equally among 4 friends. How many does each get?", choices: ["4","6","5","16"], answer: 2, explain: "20 ÷ 4 = 5 sweets each." },
  { id: "math-07-012", cat: "math", age: 7, diff: 3, q: "What is the value of the 7 in 72?", choices: ["7","72","700","70"], answer: 3, explain: "The 7 is in the tens place, so it means 70." },
  { id: "math-07-013", cat: "math", age: 7, diff: 3, q: "How many minutes are in half an hour?", choices: ["30","15","60","50"], answer: 0, explain: "An hour has 60 minutes, so half an hour is 30 minutes." },
  { id: "math-08-001", cat: "math", age: 8, diff: 1, q: "What is 6 x 7?", choices: ["36","48","42","13"], answer: 2, explain: "6 x 7 = 42." },
  { id: "math-08-002", cat: "math", age: 8, diff: 1, q: "What is 56 ÷ 8?", choices: ["6","8","7","9"], answer: 2, explain: "8 x 7 = 56, so 56 ÷ 8 = 7." },
  { id: "math-08-003", cat: "math", age: 8, diff: 1, q: "What is 100 - 45?", choices: ["55","65","45","50"], answer: 0, explain: "100 - 45 = 55." },
  { id: "math-08-004", cat: "math", age: 8, diff: 2, q: "What is 9 x 8?", choices: ["64","72","81","63"], answer: 1, explain: "9 x 8 = 72." },
  { id: "math-08-005", cat: "math", age: 8, diff: 2, q: "Meena buys a toy for 75 rupees and pays with a 100-rupee note. How much change does she get?", choices: ["25 rupees","35 rupees","15 rupees","175 rupees"], answer: 0, explain: "100 - 75 = 25 rupees change." },
  { id: "math-08-006", cat: "math", age: 8, diff: 2, q: "What is 234 + 158?", choices: ["392","382","482","391"], answer: 0, explain: "234 + 158 = 392." },
  { id: "math-08-007", cat: "math", age: 8, diff: 2, q: "What fraction of the circle is shaded?", svg: "<svg viewBox=\"0 0 100 100\"><path d=\"M50 50 L50.00 8.00 A42 42 0 0 1 92.00 50.00 Z\" fill=\"#4cc9f0\" stroke=\"#333\" stroke-width=\"2\"/><path d=\"M50 50 L92.00 50.00 A42 42 0 0 1 50.00 92.00 Z\" fill=\"#ffffff\" stroke=\"#333\" stroke-width=\"2\"/><path d=\"M50 50 L50.00 92.00 A42 42 0 0 1 8.00 50.00 Z\" fill=\"#ffffff\" stroke=\"#333\" stroke-width=\"2\"/><path d=\"M50 50 L8.00 50.00 A42 42 0 0 1 50.00 8.00 Z\" fill=\"#ffffff\" stroke=\"#333\" stroke-width=\"2\"/></svg>", choices: ["1/4","1/2","3/4","1/3"], answer: 0, explain: "The circle has 4 equal parts and 1 is shaded, so it is 1/4." },
  { id: "math-08-008", cat: "math", age: 8, diff: 2, q: "How many centimetres are in 1 metre?", choices: ["10","100","1000","50"], answer: 1, explain: "1 metre = 100 centimetres." },
  { id: "math-08-009", cat: "math", age: 8, diff: 2, q: "What is 3 x 3 x 2?", choices: ["9","18","12","27"], answer: 1, explain: "3 x 3 = 9, then 9 x 2 = 18." },
  { id: "math-08-010", cat: "math", age: 8, diff: 3, q: "A bus has 9 rows with 4 seats in each row. How many seats are there?", choices: ["13","36","32","40"], answer: 1, explain: "9 x 4 = 36 seats." },
  { id: "math-08-011", cat: "math", age: 8, diff: 3, q: "What is the next number: 1, 2, 4, 8, ...?", choices: ["10","12","16","14"], answer: 2, explain: "Each number is double the one before. 8 x 2 = 16." },
  { id: "math-08-012", cat: "math", age: 8, diff: 3, q: "What is half of 90?", choices: ["40","50","45","30"], answer: 2, explain: "90 ÷ 2 = 45." },
  { id: "math-08-013", cat: "math", age: 8, diff: 3, q: "Round 47 to the nearest ten.", choices: ["40","50","45","47"], answer: 1, explain: "47 is closer to 50 than to 40." },
  { id: "math-09-001", cat: "math", age: 9, diff: 1, q: "What is 12 x 5?", choices: ["50","65","60","17"], answer: 2, explain: "12 x 5 = 60." },
  { id: "math-09-002", cat: "math", age: 9, diff: 1, q: "What is 81 ÷ 9?", choices: ["8","7","9","72"], answer: 2, explain: "9 x 9 = 81, so 81 ÷ 9 = 9." },
  { id: "math-09-003", cat: "math", age: 9, diff: 1, q: "What is 1,000 - 1?", choices: ["990","909","900","999"], answer: 3, explain: "One less than 1,000 is 999." },
  { id: "math-09-004", cat: "math", age: 9, diff: 2, q: "What is 3/4 of 20?", choices: ["5","12","15","16"], answer: 2, explain: "1/4 of 20 is 5, so 3/4 is 3 x 5 = 15." },
  { id: "math-09-005", cat: "math", age: 9, diff: 2, q: "What is the perimeter of a square with sides of 6 cm?", choices: ["24 cm","36 cm","12 cm","18 cm"], answer: 0, explain: "A square has 4 equal sides: 4 x 6 = 24 cm." },
  { id: "math-09-006", cat: "math", age: 9, diff: 2, q: "What is 125 x 4?", choices: ["450","400","525","500"], answer: 3, explain: "125 x 4 = 500." },
  { id: "math-09-007", cat: "math", age: 9, diff: 2, q: "How many grams are in 2 kilograms?", choices: ["200","2000","20","20000"], answer: 1, explain: "1 kilogram = 1000 grams, so 2 kg = 2000 g." },
  { id: "math-09-008", cat: "math", age: 9, diff: 2, q: "What is 7 x 12?", choices: ["74","72","96","84"], answer: 3, explain: "7 x 12 = 84." },
  { id: "math-09-009", cat: "math", age: 9, diff: 2, q: "Which fraction is the biggest?", choices: ["1/3","1/2","1/4","1/8"], answer: 1, explain: "When the top number is 1, the smaller the bottom number, the bigger the piece. 1/2 is biggest." },
  { id: "math-09-010", cat: "math", age: 9, diff: 3, q: "A shop sells 24 eggs in a tray. How many eggs are in 5 trays?", choices: ["120","100","96","144"], answer: 0, explain: "24 x 5 = 120 eggs." },
  { id: "math-09-011", cat: "math", age: 9, diff: 3, q: "Ravi read 15 pages each day for 6 days. How many pages did he read?", choices: ["80","21","96","90"], answer: 3, explain: "15 x 6 = 90 pages." },
  { id: "math-09-012", cat: "math", age: 9, diff: 3, q: "What is 0.5 written as a fraction?", choices: ["1/5","5/1","1/50","1/2"], answer: 3, explain: "0.5 means 5 tenths, which equals 1/2." },
  { id: "math-09-013", cat: "math", age: 9, diff: 3, q: "A film starts at 4:30 pm and lasts 2 hours. When does it end?", choices: ["6:00 pm","5:30 pm","6:30 pm","7:30 pm"], answer: 2, explain: "4:30 pm plus 2 hours is 6:30 pm." },
  { id: "math-10-001", cat: "math", age: 10, diff: 1, q: "What is 15 x 4?", choices: ["45","54","60","19"], answer: 2, explain: "15 x 4 = 60." },
  { id: "math-10-002", cat: "math", age: 10, diff: 1, q: "What is 144 ÷ 12?", choices: ["12","11","14","10"], answer: 0, explain: "12 x 12 = 144, so 144 ÷ 12 = 12." },
  { id: "math-10-003", cat: "math", age: 10, diff: 1, q: "What is 25% of 100?", choices: ["25","4","50","75"], answer: 0, explain: "25% means 25 out of every 100." },
  { id: "math-10-004", cat: "math", age: 10, diff: 2, q: "What is the area of a rectangle 8 cm long and 5 cm wide?", choices: ["26 square cm","40 square cm","13 square cm","45 square cm"], answer: 1, explain: "Area = length x width = 8 x 5 = 40 square cm." },
  { id: "math-10-005", cat: "math", age: 10, diff: 2, q: "What is 2.5 + 1.75?", choices: ["3.25","4.3","3.75","4.25"], answer: 3, explain: "2.5 + 1.75 = 4.25." },
  { id: "math-10-006", cat: "math", age: 10, diff: 2, q: "What is the smallest prime number?", choices: ["1","3","0","2"], answer: 3, explain: "2 is the smallest prime. It is also the only even prime number." },
  { id: "math-10-007", cat: "math", age: 10, diff: 2, q: "Which of these is a factor of 36?", choices: ["7","8","5","9"], answer: 3, explain: "9 x 4 = 36, so 9 is a factor of 36." },
  { id: "math-10-008", cat: "math", age: 10, diff: 2, q: "What is 1/2 + 1/4?", choices: ["3/4","2/6","1/6","2/4"], answer: 0, explain: "1/2 = 2/4, and 2/4 + 1/4 = 3/4." },
  { id: "math-10-009", cat: "math", age: 10, diff: 2, q: "How many seconds are in 3 minutes?", choices: ["300","120","360","180"], answer: 3, explain: "1 minute = 60 seconds, so 3 minutes = 3 x 60 = 180 seconds." },
  { id: "math-10-010", cat: "math", age: 10, diff: 3, q: "A notebook costs 35 rupees. How much do 12 notebooks cost?", choices: ["350 rupees","400 rupees","420 rupees","470 rupees"], answer: 2, explain: "35 x 12 = 420 rupees." },
  { id: "math-10-011", cat: "math", age: 10, diff: 3, q: "What is the average of 4, 8 and 12?", choices: ["8","6","12","24"], answer: 0, explain: "Add them: 4 + 8 + 12 = 24. Divide by 3: 24 ÷ 3 = 8." },
  { id: "math-10-012", cat: "math", age: 10, diff: 3, q: "Round 3,648 to the nearest hundred.", choices: ["3,700","3,650","3,600","4,000"], answer: 2, explain: "3,648 is closer to 3,600 than to 3,700, because 48 is less than 50." },
  { id: "math-10-013", cat: "math", age: 10, diff: 3, q: "A train travels 60 km in 1 hour. How far does it go in 3 and a half hours?", choices: ["210 km","180 km","240 km","200 km"], answer: 0, explain: "60 x 3.5 = 210 km." },
  { id: "math-11-001", cat: "math", age: 11, diff: 1, q: "What is 10% of 250?", choices: ["2.5","250","10","25"], answer: 3, explain: "10% is one tenth. 250 ÷ 10 = 25." },
  { id: "math-11-002", cat: "math", age: 11, diff: 1, q: "What is the square of 9?", choices: ["81","18","99","72"], answer: 0, explain: "The square of 9 is 9 x 9 = 81." },
  { id: "math-11-003", cat: "math", age: 11, diff: 1, q: "What is 3/5 as a percentage?", choices: ["35%","53%","30%","60%"], answer: 3, explain: "3/5 = 6/10 = 60/100 = 60%." },
  { id: "math-11-004", cat: "math", age: 11, diff: 2, q: "What is the lowest common multiple (LCM) of 4 and 6?", choices: ["24","2","10","12"], answer: 3, explain: "Multiples of 4: 4, 8, 12. Multiples of 6: 6, 12. The lowest common one is 12." },
  { id: "math-11-005", cat: "math", age: 11, diff: 2, q: "What is the highest common factor (HCF) of 18 and 24?", choices: ["3","12","2","6"], answer: 3, explain: "6 divides both 18 and 24, and no bigger number does." },
  { id: "math-11-006", cat: "math", age: 11, diff: 2, q: "If 5 pens cost 60 rupees, how much do 8 pens cost?", choices: ["96 rupees","90 rupees","100 rupees","80 rupees"], answer: 0, explain: "1 pen costs 60 ÷ 5 = 12 rupees. 8 x 12 = 96 rupees." },
  { id: "math-11-007", cat: "math", age: 11, diff: 2, q: "What is 0.75 x 4?", choices: ["2.75","3","0.3","30"], answer: 1, explain: "0.75 x 4 = 3." },
  { id: "math-11-008", cat: "math", age: 11, diff: 2, q: "The angles of a triangle add up to how many degrees?", choices: ["90","360","180","270"], answer: 2, explain: "The three angles inside any triangle always add up to 180 degrees." },
  { id: "math-11-009", cat: "math", age: 11, diff: 2, q: "What is 7 cubed (7 x 7 x 7)?", choices: ["49","21","294","343"], answer: 3, explain: "7 x 7 = 49, and 49 x 7 = 343." },
  { id: "math-11-010", cat: "math", age: 11, diff: 3, q: "A shirt costs 400 rupees. It is on sale for 20% off. What is the sale price?", choices: ["380 rupees","200 rupees","80 rupees","320 rupees"], answer: 3, explain: "20% of 400 is 80. 400 - 80 = 320 rupees." },
  { id: "math-11-011", cat: "math", age: 11, diff: 3, q: "What is the value of x if x + 15 = 42?", choices: ["57","37","27","23"], answer: 2, explain: "x = 42 - 15 = 27." },
  { id: "math-11-012", cat: "math", age: 11, diff: 3, q: "What is the area of a triangle with base 10 cm and height 6 cm?", choices: ["60 square cm","16 square cm","36 square cm","30 square cm"], answer: 3, explain: "Area of a triangle = half x base x height = 1/2 x 10 x 6 = 30 square cm." },
  { id: "math-11-013", cat: "math", age: 11, diff: 3, q: "What is 2/3 of 1/2?", choices: ["1/6","1/3","2/5","3/4"], answer: 1, explain: "Multiply: 2/3 x 1/2 = 2/6 = 1/3." },
  { id: "math-12-001", cat: "math", age: 12, diff: 1, q: "What is -5 + 8?", choices: ["-3","13","-13","3"], answer: 3, explain: "Start at -5 and move 8 steps up the number line to reach 3." },
  { id: "math-12-002", cat: "math", age: 12, diff: 1, q: "What is the square root of 144?", choices: ["14","12","72","11"], answer: 1, explain: "12 x 12 = 144, so the square root of 144 is 12." },
  { id: "math-12-003", cat: "math", age: 12, diff: 1, q: "Simplify the ratio 12 : 18.", choices: ["3 : 2","4 : 6","2 : 3","6 : 9"], answer: 2, explain: "Divide both by 6: 12 ÷ 6 = 2 and 18 ÷ 6 = 3." },
  { id: "math-12-004", cat: "math", age: 12, diff: 2, q: "Solve: 3x - 4 = 11. What is x?", choices: ["7","5","3","15"], answer: 1, explain: "Add 4: 3x = 15. Divide by 3: x = 5." },
  { id: "math-12-005", cat: "math", age: 12, diff: 2, q: "What is the circumference of a circle with radius 7 cm? (Use pi = 22/7)", choices: ["22 cm","44 cm","154 cm","49 cm"], answer: 1, explain: "Circumference = 2 x pi x r = 2 x 22/7 x 7 = 44 cm." },
  { id: "math-12-006", cat: "math", age: 12, diff: 2, q: "What is 15% of 80?", choices: ["15","8","1.2","12"], answer: 3, explain: "10% of 80 is 8 and 5% is 4, so 15% is 12." },
  { id: "math-12-007", cat: "math", age: 12, diff: 2, q: "What is (-3) x (-4)?", choices: ["-12","12","-7","7"], answer: 1, explain: "A negative times a negative gives a positive: 12." },
  { id: "math-12-008", cat: "math", age: 12, diff: 2, q: "What is 2 to the power of 5?", choices: ["32","10","25","64"], answer: 0, explain: "2 x 2 x 2 x 2 x 2 = 32." },
  { id: "math-12-009", cat: "math", age: 12, diff: 2, q: "The ratio of boys to girls in a class is 3 : 2. There are 30 children. How many are girls?", choices: ["18","10","15","12"], answer: 3, explain: "There are 5 parts in all. 30 ÷ 5 = 6 per part. Girls = 2 x 6 = 12." },
  { id: "math-12-010", cat: "math", age: 12, diff: 3, q: "A cuboid is 5 cm long, 4 cm wide and 3 cm high. What is its volume?", choices: ["12 cubic cm","47 cubic cm","94 cubic cm","60 cubic cm"], answer: 3, explain: "Volume = length x width x height = 5 x 4 x 3 = 60 cubic cm." },
  { id: "math-12-011", cat: "math", age: 12, diff: 3, q: "A sum of 2,000 rupees earns simple interest at 5% per year. What is the interest after 3 years?", choices: ["300 rupees","100 rupees","150 rupees","3,000 rupees"], answer: 0, explain: "Interest = 2,000 x 5 x 3 ÷ 100 = 300 rupees." },
  { id: "math-12-012", cat: "math", age: 12, diff: 3, q: "What is the mean of 10, 15, 20, 25 and 30?", choices: ["25","15","100","20"], answer: 3, explain: "The total is 100. 100 ÷ 5 = 20." },
  { id: "math-12-013", cat: "math", age: 12, diff: 3, q: "The angles of a quadrilateral add up to how many degrees?", choices: ["360","180","270","540"], answer: 0, explain: "A quadrilateral can be split into 2 triangles: 2 x 180 = 360 degrees." },
  { id: "eng-04-001", cat: "english", age: 4, diff: 1, q: "Which letter does \"apple\" start with?", pic: "🍎", choices: ["B","A","C","D"], answer: 1, explain: "\"Apple\" starts with the letter A." },
  { id: "eng-04-002", cat: "english", age: 4, diff: 1, q: "Which letter does \"ball\" start with?", pic: "⚽", choices: ["D","P","A","B"], answer: 3, explain: "\"Ball\" starts with the letter B." },
  { id: "eng-04-003", cat: "english", age: 4, diff: 1, q: "Which letter comes after A?", choices: ["C","Z","B","D"], answer: 2, explain: "A, B, C... B comes right after A." },
  { id: "eng-04-004", cat: "english", age: 4, diff: 1, q: "Which word starts with the letter C?", choices: ["Dog","Hat","Cat","Sun"], answer: 2, explain: "\"Cat\" starts with C." },
  { id: "eng-04-005", cat: "english", age: 4, diff: 2, q: "Which word rhymes with \"cat\"?", choices: ["Hat","Dog","Cup","Pen"], answer: 0, explain: "\"Cat\" and \"hat\" both end with \"at\"." },
  { id: "eng-04-006", cat: "english", age: 4, diff: 2, q: "What is the opposite of \"big\"?", choices: ["Tall","Huge","Long","Small"], answer: 3, explain: "The opposite of big is small." },
  { id: "eng-04-007", cat: "english", age: 4, diff: 2, q: "Which letter does \"sun\" start with?", pic: "☀️", choices: ["N","S","U","C"], answer: 1, explain: "\"Sun\" starts with the letter S." },
  { id: "eng-04-008", cat: "english", age: 4, diff: 2, q: "Which one is a colour?", choices: ["Run","Cup","Red","Six"], answer: 2, explain: "Red is a colour." },
  { id: "eng-04-009", cat: "english", age: 4, diff: 2, q: "What is the opposite of \"up\"?", choices: ["In","On","Top","Down"], answer: 3, explain: "The opposite of up is down." },
  { id: "eng-04-010", cat: "english", age: 4, diff: 3, q: "Which word rhymes with \"bee\"?", choices: ["Bag","Bus","Tree","Cow"], answer: 2, explain: "\"Bee\" and \"tree\" both end with the \"ee\" sound." },
  { id: "eng-04-011", cat: "english", age: 4, diff: 3, q: "Which letter does \"fish\" start with?", pic: "🐟", choices: ["S","H","F","P"], answer: 2, explain: "\"Fish\" starts with the letter F." },
  { id: "eng-04-012", cat: "english", age: 4, diff: 3, q: "What is the opposite of \"hot\"?", choices: ["Warm","Wet","Sunny","Cold"], answer: 3, explain: "The opposite of hot is cold." },
  { id: "eng-04-013", cat: "english", age: 4, diff: 3, q: "Which word means more than one dog?", choices: ["Doggy","Dogs","Dog","Dogz"], answer: 1, explain: "We add \"s\" to show more than one: dogs." },
  { id: "eng-05-001", cat: "english", age: 5, diff: 1, q: "Which word rhymes with \"sun\"?", choices: ["Sit","Cap","Map","Fun"], answer: 3, explain: "\"Sun\" and \"fun\" both end with \"un\"." },
  { id: "eng-05-002", cat: "english", age: 5, diff: 1, q: "What is the opposite of \"happy\"?", choices: ["Sad","Glad","Funny","Kind"], answer: 0, explain: "The opposite of happy is sad." },
  { id: "eng-05-003", cat: "english", age: 5, diff: 1, q: "Which letter comes before D?", choices: ["E","B","F","C"], answer: 3, explain: "A, B, C, D. C comes right before D." },
  { id: "eng-05-004", cat: "english", age: 5, diff: 2, q: "Which word is spelled correctly?", choices: ["Dog","Dgo","Odg","Gdo"], answer: 0, explain: "D-O-G spells dog." },
  { id: "eng-05-005", cat: "english", age: 5, diff: 2, q: "Which is a vowel?", choices: ["B","K","T","E"], answer: 3, explain: "The vowels are A, E, I, O and U." },
  { id: "eng-05-006", cat: "english", age: 5, diff: 2, q: "What is the opposite of \"open\"?", choices: ["Closed","Wide","Empty","Full"], answer: 0, explain: "The opposite of open is closed." },
  { id: "eng-05-007", cat: "english", age: 5, diff: 2, q: "Which word names an animal?", choices: ["Horse","Chair","Green","Jump"], answer: 0, explain: "A horse is an animal." },
  { id: "eng-05-008", cat: "english", age: 5, diff: 2, q: "More than one \"box\" is called...?", choices: ["Boxs","Boxes","Boxies","Boxen"], answer: 1, explain: "Words ending in x add \"es\": box becomes boxes." },
  { id: "eng-05-009", cat: "english", age: 5, diff: 2, q: "What sound does the word \"ship\" start with?", choices: ["S","P","Ch","Sh"], answer: 3, explain: "\"Ship\" starts with the \"sh\" sound." },
  { id: "eng-05-010", cat: "english", age: 5, diff: 3, q: "Fill in the blank: I ___ a cat.", choices: ["has","having","haves","have"], answer: 3, explain: "We say \"I have a cat.\"" },
  { id: "eng-05-011", cat: "english", age: 5, diff: 3, q: "Which word is an action word?", choices: ["Table","Jump","Blue","Apple"], answer: 1, explain: "\"Jump\" is something you can do. It is an action word." },
  { id: "eng-05-012", cat: "english", age: 5, diff: 3, q: "What is the opposite of \"fast\"?", choices: ["Quick","Slow","Fun","Loud"], answer: 1, explain: "The opposite of fast is slow." },
  { id: "eng-05-013", cat: "english", age: 5, diff: 3, q: "Which word rhymes with \"cake\"?", choices: ["Cook","Cart","Lake","Kite"], answer: 2, explain: "\"Cake\" and \"lake\" both end with \"ake\"." },
  { id: "eng-06-001", cat: "english", age: 6, diff: 1, q: "What is the opposite of \"day\"?", choices: ["Night","Morning","Sun","Week"], answer: 0, explain: "The opposite of day is night." },
  { id: "eng-06-002", cat: "english", age: 6, diff: 1, q: "Which word is spelled correctly?", choices: ["Fsih","Fihs","Ffish","Fish"], answer: 3, explain: "F-I-S-H spells fish." },
  { id: "eng-06-003", cat: "english", age: 6, diff: 1, q: "More than one \"child\" is called...?", choices: ["Children","Childs","Childes","Childrens"], answer: 0, explain: "\"Children\" is the special plural of \"child\"." },
  { id: "eng-06-004", cat: "english", age: 6, diff: 2, q: "Fill in the blank: She ___ to school every day.", choices: ["go","going","gone","goes"], answer: 3, explain: "With \"she\" we say \"goes\": She goes to school." },
  { id: "eng-06-005", cat: "english", age: 6, diff: 2, q: "Which word is a naming word (noun)?", choices: ["Tree","Run","Pretty","Quickly"], answer: 0, explain: "A noun names a person, place or thing. A tree is a thing." },
  { id: "eng-06-006", cat: "english", age: 6, diff: 2, q: "What is the opposite of \"full\"?", choices: ["Heavy","Round","Empty","Many"], answer: 2, explain: "The opposite of full is empty." },
  { id: "eng-06-007", cat: "english", age: 6, diff: 2, q: "Which word means the same as \"big\"?", choices: ["Tiny","Thin","Short","Large"], answer: 3, explain: "\"Large\" means the same as big." },
  { id: "eng-06-008", cat: "english", age: 6, diff: 2, q: "Which word is a describing word?", choices: ["Soft","Sleep","Pillow","Under"], answer: 0, explain: "\"Soft\" describes how something feels." },
  { id: "eng-06-009", cat: "english", age: 6, diff: 2, q: "What is the missing letter: c _ t (an animal that meows)?", choices: ["o","u","a","e"], answer: 2, explain: "C-A-T spells cat." },
  { id: "eng-06-010", cat: "english", age: 6, diff: 3, q: "Which word always starts with a capital letter?", choices: ["apple","Monday","chair","happy"], answer: 1, explain: "Names of days, like Monday, always start with a capital letter." },
  { id: "eng-06-011", cat: "english", age: 6, diff: 3, q: "Fill in the blank: There are two ___ on the tree.", choices: ["bird","birds","birdes","birdy"], answer: 1, explain: "\"Two\" means more than one, so we say birds." },
  { id: "eng-06-012", cat: "english", age: 6, diff: 3, q: "Which word rhymes with \"light\"?", choices: ["Leaf","Lamp","Night","Late"], answer: 2, explain: "\"Light\" and \"night\" both end with \"ight\"." },
  { id: "eng-06-013", cat: "english", age: 6, diff: 3, q: "What do we put at the end of a question?", choices: ["Full stop","Comma","Capital letter","Question mark"], answer: 3, explain: "A question ends with a question mark (?)." },
  { id: "eng-07-001", cat: "english", age: 7, diff: 1, q: "What is the opposite of \"early\"?", choices: ["Soon","Quick","Late","First"], answer: 2, explain: "The opposite of early is late." },
  { id: "eng-07-002", cat: "english", age: 7, diff: 1, q: "Which word means the same as \"small\"?", choices: ["Huge","Wide","Little","Tall"], answer: 2, explain: "\"Little\" means the same as small." },
  { id: "eng-07-003", cat: "english", age: 7, diff: 1, q: "Fill in the blank: I ___ a book yesterday.", choices: ["read","reading","reads","will read"], answer: 0, explain: "\"Yesterday\" means the past, so we use \"read\"." },
  { id: "eng-07-004", cat: "english", age: 7, diff: 2, q: "Which word is spelled correctly?", choices: ["Freind","Frend","Friend","Friennd"], answer: 2, explain: "\"Friend\" is spelled F-R-I-E-N-D." },
  { id: "eng-07-005", cat: "english", age: 7, diff: 2, q: "More than one \"mouse\" is called...?", choices: ["Mice","Mouses","Mices","Mousies"], answer: 0, explain: "The plural of mouse is mice." },
  { id: "eng-07-006", cat: "english", age: 7, diff: 2, q: "Which word is a verb (doing word)?", choices: ["Pool","Blue","Swim","Happy"], answer: 2, explain: "\"Swim\" is an action, so it is a verb." },
  { id: "eng-07-007", cat: "english", age: 7, diff: 2, q: "Choose the correct word: The sun ___ in the east.", choices: ["rises","rise","rising","risen"], answer: 0, explain: "\"The sun\" is one thing, so we use \"rises\"." },
  { id: "eng-07-008", cat: "english", age: 7, diff: 2, q: "What is the opposite of \"brave\"?", choices: ["Scared","Strong","Bold","Kind"], answer: 0, explain: "The opposite of brave is scared or afraid." },
  { id: "eng-07-009", cat: "english", age: 7, diff: 2, q: "Which word is a proper noun?", choices: ["Delhi","City","River","Teacher"], answer: 0, explain: "Proper nouns name a special person or place. Delhi is a city's name." },
  { id: "eng-07-010", cat: "english", age: 7, diff: 3, q: "Which word comes first in alphabetical order?", choices: ["Bat","Ant","Cat","Dog"], answer: 1, explain: "A comes before B, C and D, so \"ant\" comes first." },
  { id: "eng-07-011", cat: "english", age: 7, diff: 3, q: "Join the two words: \"rain\" + \"bow\" = ?", choices: ["Rainbowl","Rainow","Rainbo","Rainbow"], answer: 3, explain: "\"Rain\" and \"bow\" join to make the word \"rainbow\"." },
  { id: "eng-07-012", cat: "english", age: 7, diff: 3, q: "Fill in the blank: An ___ a day keeps the doctor away.", choices: ["banana","grape","mango","apple"], answer: 3, explain: "We say \"an\" before words starting with a vowel sound, like apple." },
  { id: "eng-07-013", cat: "english", age: 7, diff: 3, q: "What is the past tense of \"run\"?", choices: ["Runned","Ran","Running","Runs"], answer: 1, explain: "Yesterday I ran. \"Ran\" is the past tense of run." },
  { id: "eng-08-001", cat: "english", age: 8, diff: 1, q: "Which word means the same as \"happy\"?", choices: ["Angry","Tired","Hungry","Joyful"], answer: 3, explain: "\"Joyful\" means very happy." },
  { id: "eng-08-002", cat: "english", age: 8, diff: 1, q: "What is the opposite of \"ancient\"?", choices: ["Old","Modern","Broken","Huge"], answer: 1, explain: "Ancient means very old. The opposite is modern." },
  { id: "eng-08-003", cat: "english", age: 8, diff: 1, q: "Which word is spelled correctly?", choices: ["Becuase","Becose","Because","Beacause"], answer: 2, explain: "\"Because\" is spelled B-E-C-A-U-S-E." },
  { id: "eng-08-004", cat: "english", age: 8, diff: 2, q: "Choose the correct word: Neither of the boys ___ here.", choices: ["is","are","were","be"], answer: 0, explain: "\"Neither\" means not one, so we use the singular \"is\"." },
  { id: "eng-08-005", cat: "english", age: 8, diff: 2, q: "What is the plural of \"leaf\"?", choices: ["Leafs","Leafes","Leavs","Leaves"], answer: 3, explain: "Many words ending in \"f\" change to \"ves\": leaf becomes leaves." },
  { id: "eng-08-006", cat: "english", age: 8, diff: 2, q: "Which word is an adjective?", choices: ["Beauty","Beautifully","Beautify","Beautiful"], answer: 3, explain: "An adjective describes a noun. \"Beautiful\" describes something." },
  { id: "eng-08-007", cat: "english", age: 8, diff: 2, q: "Which word is a pronoun?", choices: ["They","Table","Run","Green"], answer: 0, explain: "A pronoun takes the place of a noun. \"They\" is a pronoun." },
  { id: "eng-08-008", cat: "english", age: 8, diff: 2, q: "Fill in the blank: We went to the park ___ it was sunny.", choices: ["but","or","because","although"], answer: 2, explain: "We went because it was sunny. \"Because\" gives a reason." },
  { id: "eng-08-009", cat: "english", age: 8, diff: 2, q: "What is the past tense of \"bring\"?", choices: ["Bringed","Brang","Brought","Brung"], answer: 2, explain: "Today I bring, yesterday I brought." },
  { id: "eng-08-010", cat: "english", age: 8, diff: 3, q: "Which sentence uses a comma correctly?", choices: ["I bought, apples bananas and pears.","I, bought apples bananas and pears.","I bought apples, bananas and pears.","I bought apples bananas, and, pears."], answer: 2, explain: "Commas separate items in a list." },
  { id: "eng-08-011", cat: "english", age: 8, diff: 3, q: "What does \"enormous\" mean?", choices: ["Very large","Very small","Very fast","Very quiet"], answer: 0, explain: "Enormous means very, very big." },
  { id: "eng-08-012", cat: "english", age: 8, diff: 3, q: "Which word is a homophone of \"flower\"?", choices: ["Flour","Floor","Flow","Power"], answer: 0, explain: "\"Flower\" and \"flour\" sound the same but mean different things." },
  { id: "eng-08-013", cat: "english", age: 8, diff: 3, q: "Choose the correct word: This is ___ bag; it belongs to them.", choices: ["there","they're","theirs","their"], answer: 3, explain: "\"Their\" shows that something belongs to them." },
  { id: "eng-09-001", cat: "english", age: 9, diff: 1, q: "What is the opposite of \"generous\"?", choices: ["Kind","Selfish","Giving","Helpful"], answer: 1, explain: "A generous person shares. The opposite is selfish." },
  { id: "eng-09-002", cat: "english", age: 9, diff: 1, q: "Which word means the same as \"difficult\"?", choices: ["Easy","Hard","Simple","Soft"], answer: 1, explain: "\"Difficult\" and \"hard\" have the same meaning." },
  { id: "eng-09-003", cat: "english", age: 9, diff: 1, q: "What is the plural of \"tooth\"?", choices: ["Teeth","Tooths","Teeths","Toothes"], answer: 0, explain: "The plural of tooth is teeth." },
  { id: "eng-09-004", cat: "english", age: 9, diff: 2, q: "Which word is an adverb?", choices: ["Quick","Quickly","Quickness","Quicken"], answer: 1, explain: "Adverbs often end in \"-ly\" and tell how something is done." },
  { id: "eng-09-005", cat: "english", age: 9, diff: 2, q: "Choose the correct form: She is the ___ girl in the class.", choices: ["taller","tallest","most tall","tall"], answer: 1, explain: "When comparing more than two, use \"-est\": tallest." },
  { id: "eng-09-006", cat: "english", age: 9, diff: 2, q: "Which word is spelled correctly?", choices: ["Neccessary","Necessery","Necessary","Nesessary"], answer: 2, explain: "\"Necessary\" has one C and double S." },
  { id: "eng-09-007", cat: "english", age: 9, diff: 2, q: "What is a group of words that expresses a complete thought?", choices: ["Sentence","Letter","Syllable","Vowel"], answer: 0, explain: "A sentence is a group of words that makes complete sense." },
  { id: "eng-09-008", cat: "english", age: 9, diff: 2, q: "What does the prefix \"un-\" mean in \"unhappy\"?", choices: ["Not","Very","Again","Before"], answer: 0, explain: "\"Un-\" means not. Unhappy means not happy." },
  { id: "eng-09-009", cat: "english", age: 9, diff: 2, q: "Fill in the blank: He has ___ his homework.", choices: ["did","do","done","doing"], answer: 2, explain: "With \"has\" we use \"done\": He has done his homework." },
  { id: "eng-09-010", cat: "english", age: 9, diff: 3, q: "What is the collective noun for a group of fish?", choices: ["Herd","School","Pack","Pride"], answer: 1, explain: "A group of fish swimming together is called a school." },
  { id: "eng-09-011", cat: "english", age: 9, diff: 3, q: "What does \"to let the cat out of the bag\" mean?", choices: ["To reveal a secret","To free a pet","To go shopping","To be very angry"], answer: 0, explain: "This idiom means telling a secret by mistake." },
  { id: "eng-09-012", cat: "english", age: 9, diff: 3, q: "Which word is a conjunction?", choices: ["And","Under","Quickly","Happy"], answer: 0, explain: "A conjunction joins words or sentences, like \"and\", \"but\" and \"or\"." },
  { id: "eng-09-013", cat: "english", age: 9, diff: 3, q: "Find the noun: \"The clever fox jumped over the fence.\"", choices: ["Fox","Clever","Jumped","Over"], answer: 0, explain: "\"Fox\" is a noun because it names an animal. (\"Fence\" is also a noun.)" },
  { id: "eng-10-001", cat: "english", age: 10, diff: 1, q: "What is the opposite of \"victory\"?", choices: ["Success","Win","Prize","Defeat"], answer: 3, explain: "Victory means winning. The opposite is defeat." },
  { id: "eng-10-002", cat: "english", age: 10, diff: 1, q: "Which word means the same as \"rapid\"?", choices: ["Slow","Lazy","Heavy","Swift"], answer: 3, explain: "\"Rapid\" and \"swift\" both mean very fast." },
  { id: "eng-10-003", cat: "english", age: 10, diff: 1, q: "What is the plural of \"knife\"?", choices: ["Knifes","Knives","Knifies","Knive"], answer: 1, explain: "Many words ending in \"fe\" change to \"ves\": knife becomes knives." },
  { id: "eng-10-004", cat: "english", age: 10, diff: 2, q: "Which sentence is in the future tense?", choices: ["I visited my grandmother.","I will visit my grandmother.","I visit my grandmother.","I was visiting my grandmother."], answer: 1, explain: "\"Will visit\" shows something that is going to happen." },
  { id: "eng-10-005", cat: "english", age: 10, diff: 2, q: "Which word is spelled correctly?", choices: ["Begining","Beginning","Beggining","Beginnig"], answer: 1, explain: "\"Beginning\" has double N in the middle." },
  { id: "eng-10-006", cat: "english", age: 10, diff: 2, q: "What is a synonym for \"brave\"?", choices: ["Fearful","Timid","Courageous","Weak"], answer: 2, explain: "\"Courageous\" means the same as brave." },
  { id: "eng-10-007", cat: "english", age: 10, diff: 2, q: "Choose the correct preposition: The cat is hiding ___ the bed.", choices: ["under","on","at","into"], answer: 0, explain: "The cat is below the bed, so we say \"under\"." },
  { id: "eng-10-008", cat: "english", age: 10, diff: 2, q: "What does the suffix \"-less\" mean in \"careless\"?", choices: ["Without","Full of","Again","Before"], answer: 0, explain: "\"-less\" means without. Careless means without care." },
  { id: "eng-10-009", cat: "english", age: 10, diff: 2, q: "Which word is an antonym of \"expand\"?", choices: ["Grow","Shrink","Widen","Stretch"], answer: 1, explain: "Expand means to get bigger. Shrink means to get smaller." },
  { id: "eng-10-010", cat: "english", age: 10, diff: 3, q: "What does \"a piece of cake\" mean?", choices: ["A tasty snack","A birthday party","Something very easy","Something very costly"], answer: 2, explain: "\"A piece of cake\" is an idiom meaning very easy." },
  { id: "eng-10-011", cat: "english", age: 10, diff: 3, q: "Identify the type of sentence: \"What a beautiful day!\"", choices: ["Interrogative","Imperative","Exclamatory","Declarative"], answer: 2, explain: "It shows strong feeling and ends with \"!\", so it is exclamatory." },
  { id: "eng-10-012", cat: "english", age: 10, diff: 3, q: "Which word is correctly spelled?", choices: ["Seperate","Separate","Separete","Seprate"], answer: 1, explain: "Remember: there is \"a rat\" in sep-a-rate." },
  { id: "eng-10-013", cat: "english", age: 10, diff: 3, q: "Change to passive voice: \"Riya wrote a letter.\"", choices: ["A letter is written by Riya.","Riya was written a letter.","A letter writes Riya.","A letter was written by Riya."], answer: 3, explain: "In passive voice, the object comes first: \"A letter was written by Riya.\"" },
  { id: "eng-11-001", cat: "english", age: 11, diff: 1, q: "What is a synonym for \"ancient\"?", choices: ["Recent","Fresh","Antique","Modern"], answer: 2, explain: "\"Ancient\" and \"antique\" both mean very old." },
  { id: "eng-11-002", cat: "english", age: 11, diff: 1, q: "What is the antonym of \"humble\"?", choices: ["Modest","Proud","Gentle","Quiet"], answer: 1, explain: "A humble person does not boast. The opposite is proud." },
  { id: "eng-11-003", cat: "english", age: 11, diff: 1, q: "Which word is spelled correctly?", choices: ["Accommodation","Acommodation","Accomodation","Acomodation"], answer: 0, explain: "\"Accommodation\" has double C and double M." },
  { id: "eng-11-004", cat: "english", age: 11, diff: 2, q: "What figure of speech is \"as brave as a lion\"?", choices: ["Simile","Metaphor","Alliteration","Onomatopoeia"], answer: 0, explain: "A simile compares two things using \"as\" or \"like\"." },
  { id: "eng-11-005", cat: "english", age: 11, diff: 2, q: "Which word is an example of onomatopoeia?", choices: ["Quiet","Happy","Table","Buzz"], answer: 3, explain: "Onomatopoeia is a word that sounds like the noise it describes, like \"buzz\"." },
