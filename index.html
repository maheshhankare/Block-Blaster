  { id: "logic-08-006", cat: "logic", age: 8, diff: 2, q: "What comes next: AB, CD, EF, ...?", choices: ["FG","HI","GI","GH"], answer: 3, explain: "The letters go in pairs: AB, CD, EF, GH." },
  { id: "logic-08-007", cat: "logic", age: 8, diff: 2, q: "Five friends sit in a row. Asha is in the middle. How many people sit on her left?", choices: ["3","2","1","4"], answer: 1, explain: "With 5 people and Asha in the middle, there are 2 on each side." },
  { id: "logic-08-008", cat: "logic", age: 8, diff: 2, q: "What time is shown on the clock?", svg: "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"45\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"3\"/><text x=\"50.0\" y=\"19.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">12</text><text x=\"67.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">1</text><text x=\"80.3\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">2</text><text x=\"85.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">3</text><text x=\"80.3\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">4</text><text x=\"67.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">5</text><text x=\"50.0\" y=\"89.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">6</text><text x=\"32.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">7</text><text x=\"19.7\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">8</text><text x=\"15.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">9</text><text x=\"19.7\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">10</text><text x=\"32.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">11</text><line x1=\"50\" y1=\"50\" x2=\"30.0\" y2=\"50.0\" stroke=\"#222\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"50\" x2=\"50.0\" y2=\"19.0\" stroke=\"#e63946\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#222\"/></svg>", choices: ["9 o'clock","3 o'clock","12 o'clock","6 o'clock"], answer: 0, explain: "The short hand points to 9 and the long hand points to 12. It is 9 o'clock." },
  { id: "logic-08-009", cat: "logic", age: 8, diff: 2, q: "How many sides do 3 triangles have altogether?", choices: ["6","12","9","3"], answer: 2, explain: "Each triangle has 3 sides. 3 x 3 = 9." },
  { id: "logic-08-010", cat: "logic", age: 8, diff: 3, q: "Which number does not fit: 3, 6, 9, 13, 15?", choices: ["13","3","9","15"], answer: 0, explain: "3, 6, 9 and 15 are multiples of 3. 13 is not." },
  { id: "logic-08-011", cat: "logic", age: 8, diff: 3, q: "A frog climbs 3 steps up and slips 1 step down each turn. Where is it after 2 turns?", choices: ["Step 6","Step 2","Step 5","Step 4"], answer: 3, explain: "Each turn it goes up 3 and down 1, so it gains 2. After 2 turns: 2 + 2 = step 4." },
  { id: "logic-08-012", cat: "logic", age: 8, diff: 3, q: "What comes next: 1, 1, 2, 3, 5, 8, ...?", choices: ["11","10","16","13"], answer: 3, explain: "Each number is the sum of the two before it. 5 + 8 = 13." },
  { id: "logic-08-013", cat: "logic", age: 8, diff: 3, q: "Which letter is the 5th letter of the alphabet?", choices: ["E","D","F","C"], answer: 0, explain: "A, B, C, D, E. E is the 5th letter." },
  { id: "logic-09-001", cat: "logic", age: 9, diff: 1, q: "What comes next: 7, 14, 21, 28, ...?", choices: ["32","36","42","35"], answer: 3, explain: "These are multiples of 7. 28 + 7 = 35." },
  { id: "logic-09-002", cat: "logic", age: 9, diff: 1, q: "Book is to read as song is to...?", choices: ["Write","Draw","Cook","Sing"], answer: 3, explain: "We read a book and sing a song." },
  { id: "logic-09-003", cat: "logic", age: 9, diff: 1, q: "Which number is the odd one out: 16, 25, 36, 40?", choices: ["16","40","25","36"], answer: 1, explain: "16, 25 and 36 are square numbers. 40 is not." },
  { id: "logic-09-004", cat: "logic", age: 9, diff: 2, q: "What comes next: 2, 6, 18, 54, ...?", choices: ["108","72","160","162"], answer: 3, explain: "Each number is multiplied by 3. 54 x 3 = 162." },
  { id: "logic-09-005", cat: "logic", age: 9, diff: 2, q: "Unscramble the letters \"RATEH\" to make the name of a body part.", choices: ["Earth","Heart","Hater","Liver"], answer: 1, explain: "R, A, T, E and H can be rearranged to spell \"heart\", which pumps blood around the body." },
  { id: "logic-09-006", cat: "logic", age: 9, diff: 2, q: "Mohan is older than Riya. Riya is older than Kabir. Kabir is older than Dev. Who is the youngest?", choices: ["Kabir","Dev","Riya","Mohan"], answer: 1, explain: "The order from oldest is Mohan, Riya, Kabir, Dev. So Dev is the youngest." },
  { id: "logic-09-007", cat: "logic", age: 9, diff: 2, q: "How many squares are on a standard chessboard (small squares only)?", choices: ["32","81","64","100"], answer: 2, explain: "A chessboard has 8 rows of 8 squares: 8 x 8 = 64." },
  { id: "logic-09-008", cat: "logic", age: 9, diff: 2, q: "What comes next: J, F, M, A, M, J, ...?", choices: ["A","S","J","D"], answer: 2, explain: "These are the first letters of the months: January, February, March, April, May, June, July." },
  { id: "logic-09-009", cat: "logic", age: 9, diff: 2, q: "What time is shown on the clock?", svg: "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"45\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"3\"/><text x=\"50.0\" y=\"19.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">12</text><text x=\"67.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">1</text><text x=\"80.3\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">2</text><text x=\"85.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">3</text><text x=\"80.3\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">4</text><text x=\"67.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">5</text><text x=\"50.0\" y=\"89.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">6</text><text x=\"32.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">7</text><text x=\"19.7\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">8</text><text x=\"15.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">9</text><text x=\"19.7\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">10</text><text x=\"32.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">11</text><line x1=\"50\" y1=\"50\" x2=\"64.1\" y2=\"64.1\" stroke=\"#222\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"50\" x2=\"50.0\" y2=\"81.0\" stroke=\"#e63946\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#222\"/></svg>", choices: ["Half past 4","Half past 6","4 o'clock","Quarter past 4"], answer: 0, explain: "The long hand points to 6 (half past) and the short hand is between 4 and 5." },
  { id: "logic-09-010", cat: "logic", age: 9, diff: 3, q: "A farmer has 17 sheep. All but 9 run away. How many sheep are left?", choices: ["8","17","9","26"], answer: 2, explain: "\"All but 9\" means 9 did not run away. So 9 are left." },
  { id: "logic-09-011", cat: "logic", age: 9, diff: 3, q: "If the day after tomorrow is Friday, what day is today?", choices: ["Thursday","Tuesday","Wednesday","Saturday"], answer: 2, explain: "Tomorrow is Thursday, and the day after is Friday. So today is Wednesday." },
  { id: "logic-09-012", cat: "logic", age: 9, diff: 3, q: "What comes next: 1, 8, 27, 64, ...?", choices: ["100","81","125","96"], answer: 2, explain: "These are cube numbers: 1, 8, 27, 64, then 5 x 5 x 5 = 125." },
  { id: "logic-09-013", cat: "logic", age: 9, diff: 3, q: "How many faces does a cube have?", svg: "<svg viewBox=\"0 0 100 100\"><polygon points=\"20,35 50,20 80,35 50,50\" fill=\"#8ecae6\" opacity=\"0.7\"/><polygon points=\"20,35 50,50 50,85 20,70\" fill=\"#8ecae6\"/><polygon points=\"50,50 80,35 80,70 50,85\" fill=\"#8ecae6\" opacity=\"0.85\"/><g fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\"><polygon points=\"20,35 50,20 80,35 50,50\"/><polygon points=\"20,35 50,50 50,85 20,70\"/><polygon points=\"50,50 80,35 80,70 50,85\"/></g></svg>", choices: ["4","6","8","12"], answer: 1, explain: "A cube has 6 square faces, like a dice." },
  { id: "logic-10-001", cat: "logic", age: 10, diff: 1, q: "What comes next: 3, 7, 11, 15, ...?", choices: ["18","20","19","21"], answer: 2, explain: "We add 4 each time. 15 + 4 = 19." },
  { id: "logic-10-002", cat: "logic", age: 10, diff: 1, q: "Bee is to hive as bird is to...?", choices: ["Den","Burrow","Nest","Stable"], answer: 2, explain: "A bee lives in a hive and a bird lives in a nest." },
  { id: "logic-10-003", cat: "logic", age: 10, diff: 1, q: "Which word is the odd one out: Mercury, Venus, Moon, Mars?", choices: ["Mercury","Moon","Venus","Mars"], answer: 1, explain: "Mercury, Venus and Mars are planets. The Moon is a natural satellite." },
  { id: "logic-10-004", cat: "logic", age: 10, diff: 2, q: "What comes next: 1, 2, 6, 24, ...?", choices: ["120","48","96","72"], answer: 0, explain: "Multiply by 2, then 3, then 4. Next multiply by 5: 24 x 5 = 120." },
  { id: "logic-10-005", cat: "logic", age: 10, diff: 2, q: "If CAT is written as DBU, how is DOG written?", choices: ["EPH","EOG","CNF","EPG"], answer: 0, explain: "Each letter moves one step forward: D to E, O to P, G to H." },
  { id: "logic-10-006", cat: "logic", age: 10, diff: 2, q: "What time does the clock show?", svg: "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"45\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"3\"/><text x=\"50.0\" y=\"19.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">12</text><text x=\"67.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">1</text><text x=\"80.3\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">2</text><text x=\"85.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">3</text><text x=\"80.3\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">4</text><text x=\"67.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">5</text><text x=\"50.0\" y=\"89.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">6</text><text x=\"32.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">7</text><text x=\"19.7\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">8</text><text x=\"15.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">9</text><text x=\"19.7\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">10</text><text x=\"32.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">11</text><line x1=\"50\" y1=\"50\" x2=\"69.8\" y2=\"52.6\" stroke=\"#222\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"50\" x2=\"81.0\" y2=\"50.0\" stroke=\"#e63946\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#222\"/></svg>", choices: ["Quarter to 3","Quarter past 3","Half past 3","3 o'clock"], answer: 1, explain: "The long hand on 3 means 15 minutes past, and the short hand is just past 3." },
  { id: "logic-10-007", cat: "logic", age: 10, diff: 2, q: "What is the next number: 2, 3, 5, 7, 11, ...?", choices: ["13","12","15","14"], answer: 0, explain: "These are prime numbers. The next prime after 11 is 13." },
  { id: "logic-10-008", cat: "logic", age: 10, diff: 2, q: "How many edges does a cube have?", choices: ["6","8","10","12"], answer: 3, explain: "A cube has 12 edges: 4 on top, 4 on the bottom and 4 going up the sides." },
  { id: "logic-10-009", cat: "logic", age: 10, diff: 2, q: "If all bloops are razzies and all razzies are lazzies, are all bloops lazzies?", choices: ["No","Yes","Only some","We cannot know"], answer: 1, explain: "Every bloop is a razzie, and every razzie is a lazzie, so every bloop must be a lazzie." },
  { id: "logic-10-010", cat: "logic", age: 10, diff: 3, q: "A boy walks 5 m north, then 5 m east, then 5 m south. How far is he from where he started?", choices: ["10 m","5 m","15 m","0 m"], answer: 1, explain: "North and south cancel out, so he is 5 m east of the start." },
  { id: "logic-10-011", cat: "logic", age: 10, diff: 3, q: "Which number comes next: 121, 144, 169, ...?", choices: ["180","186","196","200"], answer: 2, explain: "These are squares of 11, 12 and 13. Next is 14 x 14 = 196." },
  { id: "logic-10-012", cat: "logic", age: 10, diff: 3, q: "What is the missing number? 4, 9, 16, __, 36", choices: ["20","25","24","30"], answer: 1, explain: "These are squares: 2x2, 3x3, 4x4, 5x5, 6x6. The missing one is 25." },
  { id: "logic-10-013", cat: "logic", age: 10, diff: 3, q: "In a race, you overtake the person in 2nd place. What place are you in now?", choices: ["1st","3rd","Last","2nd"], answer: 3, explain: "You take the place of the person you passed, so you are 2nd." },
  { id: "logic-11-001", cat: "logic", age: 11, diff: 1, q: "What comes next: 0, 1, 3, 6, 10, ...?", choices: ["14","16","15","12"], answer: 2, explain: "We add 1, 2, 3, 4, then 5. 10 + 5 = 15. These are triangular numbers." },
  { id: "logic-11-002", cat: "logic", age: 11, diff: 1, q: "Thermometer is to temperature as clock is to...?", choices: ["Time","Weight","Speed","Length"], answer: 0, explain: "A thermometer measures temperature, and a clock measures time." },
  { id: "logic-11-003", cat: "logic", age: 11, diff: 1, q: "Which is the odd one out: 27, 64, 125, 150?", choices: ["27","150","64","125"], answer: 1, explain: "27, 64 and 125 are cube numbers. 150 is not." },
  { id: "logic-11-004", cat: "logic", age: 11, diff: 2, q: "If 5 machines make 5 toys in 5 minutes, how long would 100 machines take to make 100 toys?", choices: ["100 minutes","5 minutes","20 minutes","1 minute"], answer: 1, explain: "Each machine makes 1 toy in 5 minutes. So 100 machines make 100 toys in 5 minutes." },
  { id: "logic-11-005", cat: "logic", age: 11, diff: 2, q: "What comes next: B, E, H, K, ...?", choices: ["M","N","L","O"], answer: 1, explain: "We skip two letters each time: B (CD) E (FG) H (IJ) K (LM) N." },
  { id: "logic-11-006", cat: "logic", age: 11, diff: 2, q: "If PENCIL is coded as QFODJM, what is the code for BOOK?", choices: ["CPPL","APPL","CPPJ","COOL"], answer: 0, explain: "Each letter moves one step forward in the alphabet: B to C, O to P, O to P, K to L." },
  { id: "logic-11-007", cat: "logic", age: 11, diff: 2, q: "A father is 30 years older than his son. In 5 years, the father will be 3 times as old as the son. How old is the son now?", choices: ["5","10","15","20"], answer: 1, explain: "In 5 years the son is 15 and the father is 45. 45 = 3 x 15. So the son is 10 now." },
  { id: "logic-11-008", cat: "logic", age: 11, diff: 2, q: "Which number is missing? 3, 9, 27, __, 243", choices: ["81","54","72","90"], answer: 0, explain: "Each number is 3 times the one before. 27 x 3 = 81." },
  { id: "logic-11-009", cat: "logic", age: 11, diff: 2, q: "A shape has 5 sides. How many diagonals does it have?", svg: "<svg viewBox=\"0 0 100 100\"><polygon points=\"50.0,10.0 89.9,39.0 74.7,86.0 25.3,86.0 10.1,39.0\" fill=\"#90be6d\"/></svg>", choices: ["3","10","2","5"], answer: 3, explain: "A pentagon has 5 diagonals, forming a star inside it." },
  { id: "logic-11-010", cat: "logic", age: 11, diff: 3, q: "What is the mirror image of the time 3:00 on a clock face?", choices: ["3:00","9:00","6:00","12:00"], answer: 1, explain: "In a mirror, the hand on 3 appears on 9, so 3:00 looks like 9:00." },
  { id: "logic-11-011", cat: "logic", age: 11, diff: 3, q: "Some cats are black. All black things are dark. Which must be true?", choices: ["All cats are dark","No cats are dark","Some cats are dark","All dark things are cats"], answer: 2, explain: "The black cats are dark, so at least some cats are dark." },
  { id: "logic-11-012", cat: "logic", age: 11, diff: 3, q: "What comes next: 1, 4, 13, 40, ...?", choices: ["121","80","120","160"], answer: 0, explain: "Multiply by 3 and add 1: 40 x 3 + 1 = 121." },
  { id: "logic-11-013", cat: "logic", age: 11, diff: 3, q: "How many squares of any size are in a 2 by 2 grid?", svg: "<svg viewBox=\"0 0 100 100\"><g fill=\"#ffe066\" stroke=\"#333\" stroke-width=\"3\"><rect x=\"10\" y=\"10\" width=\"40\" height=\"40\"/><rect x=\"50\" y=\"10\" width=\"40\" height=\"40\"/><rect x=\"10\" y=\"50\" width=\"40\" height=\"40\"/><rect x=\"50\" y=\"50\" width=\"40\" height=\"40\"/></g></svg>", choices: ["5","4","6","8"], answer: 0, explain: "There are 4 small squares and 1 big square made of all four: 5 in total." },
  { id: "logic-12-001", cat: "logic", age: 12, diff: 1, q: "What comes next: 2, 5, 10, 17, 26, ...?", choices: ["35","36","37","39"], answer: 2, explain: "Each number is a square plus 1: 1+1, 4+1, 9+1, 16+1, 25+1, so next is 36+1 = 37." },
  { id: "logic-12-002", cat: "logic", age: 12, diff: 1, q: "Author is to novel as composer is to...?", choices: ["Symphony","Painting","Building","Sculpture"], answer: 0, explain: "An author writes a novel, and a composer writes a symphony." },
  { id: "logic-12-003", cat: "logic", age: 12, diff: 1, q: "Which number is the odd one out: 11, 13, 17, 21, 23?", choices: ["21","11","13","23"], answer: 0, explain: "All the others are prime. 21 = 3 x 7, so it is not prime." },
  { id: "logic-12-004", cat: "logic", age: 12, diff: 2, q: "If APPLE is coded as 1-16-16-12-5, what is the code for CAB?", choices: ["2-1-3","3-1-2","3-2-1","1-2-3"], answer: 1, explain: "Each letter is replaced by its place in the alphabet: C=3, A=1, B=2." },
  { id: "logic-12-005", cat: "logic", age: 12, diff: 2, q: "A clock loses 5 minutes every hour. If it is set right at 12 noon, what will it show at 4 pm?", choices: ["3:40 pm","3:55 pm","4:20 pm","3:45 pm"], answer: 0, explain: "In 4 hours it loses 4 x 5 = 20 minutes, so it shows 3:40 pm." },
  { id: "logic-12-006", cat: "logic", age: 12, diff: 2, q: "What comes next: 5, 11, 23, 47, ...?", choices: ["94","71","95","96"], answer: 2, explain: "Each number is doubled and then 1 is added: 47 x 2 + 1 = 95." },
  { id: "logic-12-007", cat: "logic", age: 12, diff: 2, q: "All squares are rectangles. All rectangles have 4 sides. Which statement must be true?", choices: ["All squares have 4 sides","All 4-sided shapes are squares","Some squares have 3 sides","All rectangles are squares"], answer: 0, explain: "Every square is a rectangle, and every rectangle has 4 sides, so every square has 4 sides." },
  { id: "logic-12-008", cat: "logic", age: 12, diff: 2, q: "How many handshakes happen if 5 people each shake hands once with everyone else?", choices: ["20","25","5","10"], answer: 3, explain: "Each pair shakes once: 4 + 3 + 2 + 1 = 10 handshakes." },
  { id: "logic-12-009", cat: "logic", age: 12, diff: 2, q: "A cube painted red is cut into 27 equal small cubes. How many small cubes have no red paint?", svg: "<svg viewBox=\"0 0 100 100\"><polygon points=\"20,35 50,20 80,35 50,50\" fill=\"#e63946\" opacity=\"0.7\"/><polygon points=\"20,35 50,50 50,85 20,70\" fill=\"#e63946\"/><polygon points=\"50,50 80,35 80,70 50,85\" fill=\"#e63946\" opacity=\"0.85\"/><g fill=\"none\" stroke=\"#333\" stroke-width=\"1.5\"><polygon points=\"20,35 50,20 80,35 50,50\"/><polygon points=\"20,35 50,50 50,85 20,70\"/><polygon points=\"50,50 80,35 80,70 50,85\"/></g></svg>", choices: ["0","8","1","6"], answer: 2, explain: "Only the one cube right in the centre has no painted face." },
  { id: "logic-12-010", cat: "logic", age: 12, diff: 3, q: "What comes next: 1, 11, 21, 1211, 111221, ...?", choices: ["112211","1112221","122111","312211"], answer: 3, explain: "Each term describes the one before: \"111221\" is three 1s, two 2s, one 1, giving 312211." },
  { id: "logic-12-011", cat: "logic", age: 12, diff: 3, q: "If the day before yesterday was Thursday, what day will it be the day after tomorrow?", choices: ["Sunday","Tuesday","Saturday","Monday"], answer: 3, explain: "Day before yesterday = Thursday, so today is Saturday. Day after tomorrow is Monday." },
  { id: "logic-12-012", cat: "logic", age: 12, diff: 3, q: "A bat and a ball cost 110 rupees together. The bat costs 100 rupees more than the ball. How much is the ball?", choices: ["5 rupees","10 rupees","15 rupees","20 rupees"], answer: 0, explain: "If the ball is 5, the bat is 105, and 5 + 105 = 110." },
  { id: "logic-12-013", cat: "logic", age: 12, diff: 3, q: "Which number completes the grid row 2, 3, 6 / 4, 5, 20 / 6, 7, ?", choices: ["13","42","36","49"], answer: 1, explain: "In each row, the first two numbers multiply to give the third: 6 x 7 = 42." },
  { id: "pic-04-001", cat: "picture", age: 4, diff: 1, q: "What fruit is this?", pic: "🍎", choices: ["Banana","Apple","Grapes","Orange"], answer: 1, explain: "This is a red apple." },
  { id: "pic-04-002", cat: "picture", age: 4, diff: 1, q: "What animal is this?", pic: "🐶", choices: ["Cat","Cow","Dog","Horse"], answer: 2, explain: "This is a dog. It says \"woof\"." },
  { id: "pic-04-003", cat: "picture", age: 4, diff: 1, q: "What colour is this?", svg: "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"#e63946\" stroke=\"#888\" stroke-width=\"1\"/></svg>", choices: ["Blue","Red","Green","Yellow"], answer: 1, explain: "This colour is red, like a tomato." },
  { id: "pic-04-004", cat: "picture", age: 4, diff: 1, q: "What colour is this?", svg: "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"42\" fill=\"#1d4ed8\" stroke=\"#888\" stroke-width=\"1\"/></svg>", choices: ["Blue","Red","Pink","Brown"], answer: 0, explain: "This colour is blue, like the sky." },

  <script>
/* BLOCK BLASTER — block-placement engine shared by Classic and Adventure.
   Handles the 10×10 board, the tray of three pieces, drag-and-drop / tap-to-place,
   line detection, blasting, obstacles (stone, ice), bombs, diamonds, undo snapshots
   and "no move left" detection. Scoring and objectives live in the modes. */
(function () {
  'use strict';
  var BB = window.BB, U = BB.util, SH = window.BB_SHAPES;
  var N = 10;

  function emptyGrid() { var g = []; for (var r = 0; r < N; r++) { g.push([]); for (var c = 0; c < N; c++) g[r].push(null); } return g; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function bounds(cells) {
    var h = 0, w = 0;
    cells.forEach(function (p) { h = Math.max(h, p[0] + 1); w = Math.max(w, p[1] + 1); });
    return { h: h, w: w };
  }
  function fits(grid, piece, r0, c0) {
    for (var i = 0; i < piece.cells.length; i++) {
      var r = r0 + piece.cells[i][0], c = c0 + piece.cells[i][1];
      if (r < 0 || c < 0 || r >= N || c >= N || grid[r][c]) return false;
    }
    return true;
  }
  function fitsAnywhere(grid, piece) {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (fits(grid, piece, r, c)) return true;
    return false;
  }

  /** Make a random piece. opts: {maxTier, gemChance, gemColors, bombChance, rng} */
  function randomPiece(opts) {

            var pts = linePoints(res.lines, level, st.combo);

            gained += pts;
            st.lines += res.lines;
            st.combo += 1; st.sinceClear = 0;
            var words = ['', 'Nice!', 'Great!', 'Amazing!', 'Fantastic!', 'BLASTASTIC!'];
            text = '<div>' + (words[Math.min(res.lines, 5)]) + '</div>+' + U.fmt(gained) + (st.combo > 1 ? '<div style="font-size:.7em">Combo x' + st.combo + '</div>' : '');
            if (res.boardEmpty) text = '<div>Board Clear!</div>' + text;
            if (levelFor(st.lines) > level) setTimeout(function () { BB.ui.toast('Level ' + levelFor(st.lines) + '! Points multiplier up'); BB.audio.sfx('star'); }, 400);
          } else {
            st.sinceClear += 1;
            if (st.sinceClear >= 3) st.combo = 0;
          }
          st.score += gained;
          if (st.score > best) { best = st.score; BB.store.set('classic:best', best); }
          if (!st.won && st.score >= TARGET) { st.won = true; setTimeout(victory, 600); }
          return { text: text, big: res.lines >= 2 };
        },
        onChange: function () { updateHud(); save(); },
        onGameOver: function () { save(); if (BB.app.current === 'classic') gameOver(); else pendingOver = true; }
      });

      function updateHud() {
        q('.js-score').textContent = U.fmt(st.score);
        q('.js-best').textContent = U.fmt(best);
        q('.js-level').textContent = levelFor(st.lines);
        q('.js-prog').style.width = Math.min(100, st.score / TARGET * 100).toFixed(2) + '%';
        q('.js-combo').textContent = st.combo > 1 ? '🔥 Combo x' + st.combo + ' · Lines: ' + st.lines : 'Lines cleared: ' + st.lines + ' · ' + Math.min(100, st.score / TARGET * 100).toFixed(2) + '% to 1 crore';
        q('.js-undos').textContent = '(' + st.undos + ')';
        q('.js-undo').disabled = !(st.undos > 0 && engine.canUndo());
      }
      function save() {
        BB.store.set('classic:state', Object.assign({}, st, engine.getState()));
        BB.events.emit('stats');
      }
      function newGame() {
        st = { score: 0, lines: 0, combo: 0, sinceClear: 0, undos: UNDOS_PER_GAME, won: false };
        engine.newGame();
        updateHud(); save();
      }
      function gameOver() {
        BB.audio.sfx('lose');
        var isBest = st.score >= best && st.score > 0;
        var games = BB.store.get('classic:games', 0) + 1; BB.store.set('classic:games', games);
        BB.ui.modal({
          title: 'Game Over', dismissable: false,
          html: '<div class="overlay-card"><div class="big-emoji">' + (isBest ? '🏅' : '🧱') + '</div>' +
            '<p>No more space for these blocks.</p><div class="final-score">' + U.fmt(st.score) + '</div>' +
            '<p>' + (isBest ? 'New best score! 🎉' : 'Best: ' + U.fmt(best)) + '</p></div>',
          buttons: [
            st.undos > 0 && engine.canUndo() ? { label: '↶ Undo (' + st.undos + ')', cls: 'btn-yellow', onClick: function () { doUndo(); } } : null,
            { label: '🏠 Home', cls: 'btn-ghost', onClick: function () { BB.app.go('home'); newGame(); } },
            { label: '↻ Play Again', cls: 'btn-primary', onClick: function () { newGame(); } }
          ].filter(Boolean)
        });
      }
      function victory() {
        BB.audio.sfx('win');
        BB.fx.fireworks(10); BB.fx.confetti(160);
        var tro = BB.store.get('trophies', {}); tro.classicCrore = Date.now(); BB.store.set('trophies', tro);
        BB.ui.modal({
          title: 'VICTORY!', html: '<div class="overlay-card"><div class="big-emoji">🏆</div><p>You reached <b>1 crore</b> points!</p>' +
            '<div class="final-score">' + U.fmt(st.score) + '</div><p>The Crore Champion trophy is yours. Keep blasting for a higher best score!</p></div>',
          buttons: [{ label: 'Keep Playing', cls: 'btn-green' }, { label: 'New Game', cls: 'btn-primary', onClick: newGame }]
        });
        save();
      }
      function doUndo() {
        if (st.undos <= 0) { BB.ui.toast('No undos left this game'); return; }
        var undos = st.undos;
        if (engine.undo()) { st.undos = undos - 1; BB.audio.sfx('whoosh'); updateHud(); save(); }
      }
      q('.js-undo').addEventListener('click', doUndo);
      q('.js-restart').addEventListener('click', function () {
        BB.audio.sfx('click');
        if (st.score === 0 || engine.over) { newGame(); return; }
        BB.ui.confirm('Restart?', 'Start a new Classic game? Your current score will be lost (your best score is kept).', 'Restart').then(function (ok) { if (ok) newGame(); });
      });
      q('.js-help').addEventListener('click', function () { BB.audio.sfx('click'); help(); });
      function help() {
        BB.ui.modal({
          title: '🧱 How to play Classic',
          html: '<p>Drag a block from the tray onto the board (or tap a block, then tap the board). Blocks cannot overlap or hang off the edge.</p>' +
            '<p>Fill a whole <b>row</b> or <b>column</b> to blast it. When all three blocks are used, you get three new ones.</p>' +
            '<p><b>Scoring</b><br>• Each placed square: 10 points<br>• Lines blasted together: 100 × lines × lines × level (1 line = 100, 2 = 400, 3 = 900…)<br>' +
            '• Combo: keep clearing (at least once every 3 blocks) for +50% per combo step<br>• Clear the whole board: 5,000 × level bonus<br>• Level goes up every 10 lines, multiplying line points.</p>' +
            '<p>There is no time limit. Reach <b>1 crore (10,000,000)</b> points to win the trophy. When no block fits anywhere, the game is over. You get 3 undos per game.</p>'
        });
      }

      var saved = BB.store.get('classic:state', null);
      if (saved && saved.grid) {
        st = { score: saved.score || 0, lines: saved.lines || 0, combo: saved.combo || 0, sinceClear: saved.sinceClear || 0, undos: saved.undos == null ? UNDOS_PER_GAME : saved.undos, won: !!saved.won };
        engine.setState(saved);
        if (saved.over || !engine.anyMove()) { engine.over = true; pendingOver = true; }
      } else newGame();
      updateHud();
      if (!BB.store.get('classic:seenHelp', false)) { BB.store.set('classic:seenHelp', true); help(); }

      return {
        show: function () { engine.layout(); updateHud(); if (pendingOver) { pendingOver = false; gameOver(); } },
        hide: function () { save(); },
        _engine: engine, _state: function () { return st; }
      };
    }
  });
})();

</script>
  <script>
/* BLOCK BLASTER — Mode 2: Adventure (trophy worlds × 100 levels, diamond missions). */
(function () {
  'use strict';
  var BB = window.BB, U = BB.util, CFG = window.BB_ADVENTURE, SH = window.BB_SHAPES;
  var LPT = CFG.levelsPerTrophy;

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------------- progress ---------------- */
  function loadProg() {
    var p = BB.store.get('adv:progress', null) || {};
    p.worlds = p.worlds || {}; p.diamonds = p.diamonds || 0; p.badges = p.badges || [];
    return p;
  }
  function saveProg(p) { BB.store.set('adv:progress', p); BB.events.emit('stats'); }
  function worldDone(p, tid) { return p.worlds[tid] ? p.worlds[tid] : (p.worlds[tid] = {}); }
  function countDone(p, tid) { return Object.keys(p.worlds[tid] || {}).length; }
  function totalStars(p) {
    var s = 0;
    Object.keys(p.worlds).forEach(function (t) { Object.keys(p.worlds[t]).forEach(function (l) { s += p.worlds[t][l]; }); });
    return s;
  }
  function trophyUnlocked(p, idx) { return idx === 0 || countDone(p, CFG.trophies[idx - 1].id) >= CFG.unlockAfter; }
  function levelUnlocked(p, tid, lv) { return lv === 1 || !!(p.worlds[tid] && p.worlds[tid][lv - 1]); }

  BB.adventureSummary = function () {
    var p = loadProg(), levels = 0;
    CFG.trophies.forEach(function (t) { levels += countDone(p, t.id); });
    return {
      levels: levels, stars: totalStars(p), diamonds: p.diamonds,
      trophies: CFG.trophies.map(function (t) { var d = countDone(p, t.id); return { name: t.name, icon: t.icon, done: d, won: d >= LPT }; })
    };
  };

  /* ---------------- level generator (deterministic per world+level) ---------------- */
  function makeLevel(tIdx, lv) {
    var T = CFG.trophies[tIdx];
    var rnd = mulberry32(tIdx * 7919 + lv * 104729 + 17);
    var d = lv - 1 + T.offset;
    var L = { tIdx: tIdx, trophy: T.id, level: lv, d: d, goals: [], moves: null };
    var colors = CFG.gemColors;
    var types = ['gems', 'lines', 'gems', 'multi', 'color', 'score', 'gems'];
    if (lv === 1 && tIdx === 0) L.goals.push({ type: 'gems', n: 5 });
    else if (lv === 2 && tIdx === 0) L.goals.push({ type: 'lines', n: 3 });
    else if (lv === 3 && tIdx === 0) L.goals.push({ type: 'multi', k: 2, n: 1 });
    else {
      var type = types[Math.floor(rnd() * types.length)];
      L.goals.push(goalFor(type, d, rnd, colors));
      if (lv % 10 === 0) { // "boss" level: two missions at once
        var t2 = type === 'gems' ? 'lines' : 'gems';
        L.goals.push(goalFor(t2, Math.floor(d * 0.7), rnd, colors));
      }
    }
    // Move limits: every 4th level and every boss level is a "within N moves" challenge.
    var needs = estimateMoves(L.goals);
    L.par = Math.ceil(needs);
    if ((lv % 4 === 0 || lv % 10 === 0) && !(lv <= 3 && tIdx === 0)) L.moves = Math.ceil(needs * (1.9 - Math.min(0.5, d / 400))) + 4;
    // Obstacles and special blocks appear gradually.
    var O = CFG.obstacles;
    L.stones = d >= O.stoneFrom ? Math.min(14, 2 + Math.floor((d - O.stoneFrom) / 8)) : 0;
    L.ice = d >= O.iceFrom ? Math.min(8, 1 + Math.floor((d - O.iceFrom) / 12)) : 0;
    L.bombChance = d >= O.bombFrom ? 0.07 : 0;
    var wantsGems = L.goals.some(function (g) { return g.type === 'gems' || g.type === 'color'; });
    L.gemChance = wantsGems ? 0.45 : 0.15;
    var col = L.goals.filter(function (g) { return g.type === 'color'; })[0];
    L.gemColors = col ? col.colors.concat([colors[(colors.indexOf(col.colors[0]) + 2) % colors.length]]) : colors;
    L.maxTier = d < 12 ? 1 : 2;
    L.grid = makeGrid(L, rnd, wantsGems);
    return L;
  }
  function goalFor(type, d, rnd, colors) {
    switch (type) {
      case 'gems': return { type: 'gems', n: 6 + Math.floor(d * 0.14) + Math.floor(rnd() * 3) };
      case 'lines': return { type: 'lines', n: 4 + Math.floor(d * 0.08) + Math.floor(rnd() * 2) };
      case 'multi': return { type: 'multi', k: d > 70 ? 3 : 2, n: 1 + Math.min(3, Math.floor(d / 35)) };
      case 'color': {
        var a = Math.floor(rnd() * colors.length), b = (a + 1 + Math.floor(rnd() * (colors.length - 1))) % colors.length;
        var n = 2 + Math.floor(d * 0.04);
        var want = {}; want[colors[a]] = n; want[colors[b]] = n;
        return { type: 'color', colors: [colors[a], colors[b]], want: want };
      }
      default: return { type: 'score', n: (1500 + d * 70) - ((1500 + d * 70) % 100) };
    }
  }
  function estimateMoves(goals) {
    var m = 0;
    goals.forEach(function (g) {
      if (g.type === 'gems') m += g.n * 0.9 + 4;
      else if (g.type === 'lines') m += g.n * 2.2;
      else if (g.type === 'multi') m += g.n * 6;
      else if (g.type === 'color') m += (g.want[g.colors[0]] + g.want[g.colors[1]]) * 1.8 + 4;
      else m += g.n / 120;
    });
    return Math.max(6, m);
  }
  function makeGrid(L, rnd, gems) {
    var N = 10, g = BB.BlockEngine.emptyGrid(), rows = new Array(N).fill(0), cols = new Array(N).fill(0);
    function put(cell) {
      for (var tries = 0; tries < 60; tries++) {
        var r = Math.floor(rnd() * N), c = Math.floor(rnd() * N);
        if (g[r][c] || rows[r] >= 7 || cols[c] >= 7) continue;
        g[r][c] = cell; rows[r]++; cols[c]++; return;
      }
    }
    for (var i = 0; i < L.stones; i++) {
      var s = { color: '#8d99ae', type: 'stone', gem: 0, gemColor: null, bomb: false };
      if (gems && rnd() < 0.35) { s.gem = 1; s.gemColor = L.gemColors[Math.floor(rnd() * L.gemColors.length)]; }
      put(s);
    }
    for (var j = 0; j < L.ice; j++) put({ color: '#bde0fe', type: 'ice', hp: 2, gem: 0, gemColor: null, bomb: false });
    return g;
  }
  BB.adventureLevel = makeLevel; // exposed for testing

  function goalText(g) {
    var T = CFG.objectiveText;
    if (g.type === 'color') return 'Collect ' + g.colors.map(function (c) { return g.want[c] + ' <span class="mini-gem" style="--g:' + SH.gemColors[c] + '"></span>' + c; }).join(' and ');
    return T[g.type].replace('{n}', U.fmt(g.n)).replace('{k}', g.k);
  }

  /* ---------------- UI ---------------- */
  BB.registerMode('adventure', {
    music: 'adventure',
    init: function (root) {
      var screen = 'worlds', curT = 0, L = null, run = null, engine = null, pendingEnd = null;
      root.innerHTML = '<div class="js-adv-menu"></div><div class="js-adv-play play-layout hidden"></div>';
      var menu = root.querySelector('.js-adv-menu'), play = root.querySelector('.js-adv-play');

      function showWorlds() {
        screen = 'worlds';
        var p = loadProg();
        menu.classList.remove('hidden'); play.classList.add('hidden');
        var badgeHtml = p.badges.length ? p.badges.map(function (b) { return '<span class="trophy-pill">' + U.esc(b) + '</span>'; }).join('') : '<span class="help-text">Complete levels to earn badges.</span>';
        var h = '<div class="mode-header"><div class="mode-title"><span class="mode-icon">🗺️</span>Adventure</div><div class="mode-sub">Choose a trophy world. Each world has 100 levels with diamond missions.</div></div>' +
          '<div class="adv-summary"><div class="hud-box"><div class="hud-label">Stars</div><div class="hud-val">⭐ ' + totalStars(p) + '</div></div>' +
          '<div class="hud-box"><div class="hud-label">Diamonds</div><div class="hud-val">💎 ' + U.fmt(p.diamonds) + '</div></div>' +
          '<div class="hud-box"><div class="hud-label">Badges</div><div class="hud-val">🎖️ ' + p.badges.length + '</div></div></div>' +
          '<div class="adv-trophies">';
        CFG.trophies.forEach(function (t, i) {
          var done = countDone(p, t.id), un = trophyUnlocked(p, i);
          h += '<button class="adv-trophy' + (un ? '' : ' locked') + '" data-t="' + i + '" style="--t1:' + t.t1 + ';--t2:' + t.t2 + '">' +
            '<span class="tro-icon">' + (done >= LPT ? '🏆' : t.icon) + '</span><span class="tro-name">' + U.esc(t.name) + '</span>' +
            '<span class="tro-meta">' + (un ? done + ' / ' + LPT + ' levels' : '🔒 Complete ' + CFG.unlockAfter + ' levels of ' + CFG.trophies[i - 1].name) + '</span>' +
            '<div class="progress"><i style="width:' + done + '%"></i></div></button>';
        });
        h += '</div><div class="panel" style="margin-top:12px"><h3>🎖️ Badges</h3><div class="badge-list">' + badgeHtml + '</div></div>';
        menu.innerHTML = h;
        Array.prototype.forEach.call(menu.querySelectorAll('.adv-trophy'), function (b) {
          b.addEventListener('click', function () {
            var i = +b.dataset.t;
            if (!trophyUnlocked(loadProg(), i)) { BB.audio.sfx('invalid'); BB.ui.toast('Locked: finish ' + CFG.unlockAfter + ' levels of the previous world'); return; }
            BB.audio.sfx('select'); curT = i; showLevels();
          });
        });
        BB.store.set('adv:screen', { screen: 'worlds' });
      }

      function showLevels() {
        screen = 'levels';
        var p = loadProg(), t = CFG.trophies[curT], w = p.worlds[t.id] || {};
        menu.classList.remove('hidden'); play.classList.add('hidden');
        var cur = 1; while (w[cur] && cur < LPT) cur++;
        var h = '<div class="level-head"><button class="btn btn-small btn-ghost js-worlds">◀ Worlds</button><h2>' + t.icon + ' ' + U.esc(t.name) + '</h2>' +
          '<span class="hud-box"><span class="hud-label">Done</span><div class="hud-val">' + countDone(p, t.id) + '/' + LPT + '</div></span></div><div class="level-grid">';
        for (var lv = 1; lv <= LPT; lv++) {
          var stars = w[lv], unlocked = levelUnlocked(p, t.id, lv);
          var cls = stars ? 'done' : (unlocked ? 'current' : 'locked');
          h += '<button class="level-btn ' + cls + '" data-lv="' + lv + '" aria-label="Level ' + lv + (stars ? ', ' + stars + ' stars' : unlocked ? '' : ', locked') + '">' +
            (unlocked ? lv : '🔒') + (stars ? '<span class="lv-stars">' + '⭐'.repeat(stars) + '</span>' : (lv % 10 === 0 && unlocked ? '<span class="lv-badge">👑</span>' : '')) + '</button>';
        }
        h += '</div>';
        menu.innerHTML = h;
        menu.querySelector('.js-worlds').addEventListener('click', function () { BB.audio.sfx('click'); showWorlds(); });
        Array.prototype.forEach.call(menu.querySelectorAll('.level-btn'), function (b) {
          b.addEventListener('click', function () {
            var lv = +b.dataset.lv;
            if (!levelUnlocked(loadProg(), t.id, lv)) { BB.audio.sfx('invalid'); BB.ui.toast('Finish level ' + (lv - 1) + ' first'); return; }
            BB.audio.sfx('select'); startLevel(lv, true);
          });
        });
        var curBtn = menu.querySelector('.level-btn[data-lv="' + cur + '"]');
        if (curBtn) setTimeout(function () { try { curBtn.scrollIntoView({ block: 'center' }); } catch (e) {} }, 50);
        BB.store.set('adv:screen', { screen: 'levels', t: curT });
      }

      /* ---------- playing a level ---------- */
      function buildPlay() {
        play.innerHTML =
          '<div class="hud">' +
          '<button class="btn btn-small btn-ghost js-levels">◀ Levels</button>' +
          '<div class="hud-box"><div class="hud-label js-lvname">Level</div><div class="hud-val js-lvnum">1</div></div>' +
          '<div class="hud-box goal"><div class="hud-label">Mission</div><div class="js-goals"></div></div>' +
          '<div class="hud-box"><div class="hud-label js-moves-label">Moves</div><div class="hud-val js-moves">0</div></div>' +
          '<button class="btn btn-small btn-blue js-retry" aria-label="Restart level">↻</button>' +
          '<button class="btn btn-small btn-ghost js-ahelp" aria-label="How to play">❓</button>' +
          '</div><div class="js-engine" style="flex:1;min-height:0;display:flex"></div>';
        play.querySelector('.js-levels').addEventListener('click', function () { BB.audio.sfx('click'); saveRun(); showLevels(); });
        play.querySelector('.js-retry').addEventListener('click', function () { BB.audio.sfx('click'); startLevel(L.level, false); });
        play.querySelector('.js-ahelp').addEventListener('click', function () { BB.audio.sfx('click'); help(); });
        engine = BB.BlockEngine.create(play.querySelector('.js-engine'), {
          generatePiece: function () {
            return BB.BlockEngine.randomPiece({ maxTier: L.maxTier, gemChance: L.gemChance, gemColors: L.gemColors, bombChance: L.bombChance });
          },
          onPlaced: onPlaced,
          isFinished: function () { return run && run.finished; },
          onChange: function () { updateHud(); saveRun(); },
          onGameOver: function () { endLevel(false, 'No space left for these blocks.'); }
        });
      }
      function help() {
        BB.ui.modal({
          title: '🗺️ How Adventure works',
          html: '<p>Place blocks just like Classic. Each level has a <b>mission</b> shown at the top.</p>' +
            '<p>💎 Some blocks carry 1, 2 or 3 diamonds. Diamonds count once the line holding them is blasted. The HUD also shows how many diamonds are waiting on the board.</p>' +
            '<p>🔢 Some levels must be finished within a set number of moves (one move = one block placed).</p>' +
            '<p>🪨 Stones fill space until their line is blasted. ❄️ Ice needs two blasts. 💣 Bomb blocks blast everything around them when their line clears.</p>' +
            '<p>⭐ Earn up to 3 stars by finishing in fewer moves. Every 10th level is a 👑 boss level with two missions. Complete ' + CFG.unlockAfter + ' levels in a world to unlock the next world, and all 100 to win its trophy.</p>'
        });
      }
      function startLevel(lv, intro) {
        screen = 'play';
        L = makeLevel(curT, lv);
        if (!engine) buildPlay();
        menu.classList.add('hidden'); play.classList.remove('hidden');
        run = { trophy: curT, level: lv, moves: 0, score: 0, gems: 0, lines: 0, multi: 0, colors: {}, onBoard: 0, finished: false };
        engine.newGame(L.grid);
        engine.layout();
        updateHud(); saveRun();
        if (intro) {
          BB.ui.modal({
            title: CFG.trophies[curT].icon + ' Level ' + lv + (lv % 10 === 0 ? ' 👑' : ''),
            html: '<div class="overlay-card"><p><b>Mission</b></p>' + L.goals.map(function (g) { return '<p class="goal-line" style="justify-content:center">🎯 ' + goalText(g) + '</p>'; }).join('') +
              (L.moves ? '<p>⏱️ Within <b>' + L.moves + '</b> moves</p>' : '<p class="help-text">3 stars: finish in ' + L.par + ' moves or fewer.</p>') +
              (L.stones || L.ice ? '<p class="help-text">Watch out: ' + (L.stones ? '🪨 stones ' : '') + (L.ice ? '❄️ ice ' : '') + '</p>' : '') + '</div>',
            buttons: [{ label: '▶ Play', cls: 'btn-green' }]
          });
        }
      }
      function onPlaced(res) {
        run.moves++;
        var pts = res.cells * 10 + (res.lines ? 100 * res.lines * res.lines : 0);
        run.score += pts; run.lines += res.lines;
        var k = L.goals.filter(function (g) { return g.type === 'multi'; })[0];
        if (k && res.lines >= k.k) run.multi++;
        var got = 0;
        res.gems.forEach(function (g) { got += g.n; run.colors[g.color] = (run.colors[g.color] || 0) + g.n; });
        run.gems += got;
        run.onBoard = countBoardGems();
        var text = '+' + pts;
        if (got) text = '<div>💎 +' + got + '</div>' + text;
        if (goalsMet()) { run.finished = true; setTimeout(function () { endLevel(true); }, 650); }
        else if (L.moves && run.moves >= L.moves) { run.finished = true; setTimeout(function () { endLevel(false, 'Out of moves!'); }, 650); }
        return { text: text, big: res.lines >= 2 };
      }
      function countBoardGems() {
        var n = 0; engine.grid.forEach(function (row) { row.forEach(function (c) { if (c && c.gem) n += c.gem; }); });
        return n;
      }
      function goalProgress(g) {
        if (g.type === 'gems') return [Math.min(run.gems, g.n), g.n];
        if (g.type === 'lines') return [Math.min(run.lines, g.n), g.n];
        if (g.type === 'multi') return [Math.min(run.multi, g.n), g.n];
        if (g.type === 'score') return [Math.min(run.score, g.n), g.n];
        var have = 0, need = 0;
        g.colors.forEach(function (c) { have += Math.min(run.colors[c] || 0, g.want[c]); need += g.want[c]; });
        return [have, need];
      }
      function goalsMet() { return L.goals.every(function (g) { var p = goalProgress(g); return p[0] >= p[1]; }); }
      function updateHud() {
        if (!L || !run) return;
        var t = CFG.trophies[curT];
        play.querySelector('.js-lvname').textContent = t.icon + ' ' + t.name;
        play.querySelector('.js-lvnum').textContent = 'Lv ' + L.level;
        play.querySelector('.js-goals').innerHTML = L.goals.map(function (g) {
          var p = goalProgress(g), done = p[0] >= p[1];
          var label = g.type === 'gems' ? 'Diamonds: ' + p[0] + '/' + p[1] :
            g.type === 'lines' ? 'Lines: ' + p[0] + '/' + p[1] :
            g.type === 'multi' ? g.k + '+ line blasts: ' + p[0] + '/' + p[1] :
            g.type === 'score' ? 'Score: ' + U.fmt(run.score) + '/' + U.fmt(g.n) :
            g.colors.map(function (c) { return '<span class="mini-gem" style="--g:' + SH.gemColors[c] + '"></span>' + Math.min(run.colors[c] || 0, g.want[c]) + '/' + g.want[c]; }).join(' ');
          return '<div class="goal-line' + (done ? ' gl-done' : '') + '">' + (done ? '✅' : '🎯') + ' ' + label + '</div>';
        }).join('') + (L.goals.some(function (g) { return g.type === 'gems' || g.type === 'color'; }) ? '<div class="target-note">💎 on board, waiting to be blasted: ' + run.onBoard + '</div>' : '') +
          '<div class="progress"><i style="width:' + Math.round(L.goals.reduce(function (a, g) { var p = goalProgress(g); return a + p[0] / p[1]; }, 0) / L.goals.length * 100) + '%"></i></div>';
        play.querySelector('.js-moves-label').textContent = L.moves ? 'Moves left' : 'Moves';
        play.querySelector('.js-moves').textContent = L.moves ? (L.moves - run.moves) : run.moves;
      }
      function starsFor() {
        if (L.moves) { var left = (L.moves - run.moves) / L.moves; return left >= 0.35 ? 3 : left >= 0.15 ? 2 : 1; }
        return run.moves <= L.par ? 3 : run.moves <= L.par * 1.4 ? 2 : 1;
      }
      function endLevel(won, why) {
        if (BB.app.current !== 'adventure') { pendingEnd = [won, why]; return; }
        run.finished = true;
        var p = loadProg(), t = CFG.trophies[curT], w = worldDone(p, t.id);
        if (!won) {
          BB.audio.sfx('lose');
          BB.store.remove('adv:run');
          BB.ui.modal({
            title: 'Level ' + L.level + ' not finished', dismissable: false,
            html: '<div class="overlay-card"><div class="big-emoji">😮</div><p>' + why + '</p><p class="help-text">Tip: blast lines with diamonds in them, and keep space for big blocks.</p></div>',
            buttons: [{ label: 'Levels', cls: 'btn-ghost', onClick: showLevels }, { label: '↻ Try Again', cls: 'btn-primary', onClick: function () { startLevel(L.level, false); } }]
          });

        w[L.level] = Math.max(prev, stars);

        var newBadges = [], done = countDone(p, t.id);
        CFG.worldBadges.forEach(function (b) {
          var name = b.icon + ' ' + t.name + ' ' + b.name;
          if (done >= b.at && p.badges.indexOf(name) < 0) { p.badges.push(name); newBadges.push(name); }
        });
        var ts = totalStars(p);
        CFG.starBadges.forEach(function (b) { var name = b.icon + ' ' + b.name; if (ts >= b.at && p.badges.indexOf(name) < 0) { p.badges.push(name); newBadges.push(name); } });
        saveProg(p);
        BB.store.remove('adv:run');
        var unlockMsg = '';
        if (firstTime && curT + 1 < CFG.trophies.length && done === CFG.unlockAfter) unlockMsg = '<p>🔓 New world unlocked: <b>' + CFG.trophies[curT + 1].icon + ' ' + CFG.trophies[curT + 1].name + '</b>!</p>';

        BB.audio.sfx('win');
        BB.fx.confetti(trophyWon ? 200 : 90);
        if (trophyWon) BB.fx.fireworks(10);
        var sHtml = '<div class="stars">' + [1, 2, 3].map(function (i) { return '<span class="' + (i <= stars ? '' : 'off') + '">⭐</span>'; }).join('') + '</div>';
        BB.ui.modal({
          title: trophyWon ? '🏆 TROPHY WON!' : 'Level ' + L.level + ' complete!', dismissable: false,
          html: '<div class="overlay-card">' + (trophyWon ? '<div class="big-emoji">🏆</div><p>You finished all 100 levels of <b>' + t.name + '</b>!</p>' : '') + sHtml +
            '<p>Moves: <b>' + run.moves + '</b> · Diamonds: <b>💎 ' + run.gems + '</b> · Score: <b>' + U.fmt(run.score) + '</b></p>' +
            (newBadges.length ? '<p>New badge' + (newBadges.length > 1 ? 's' : '') + ': <b>' + newBadges.map(U.esc).join(', ') + '</b></p>' : '') + unlockMsg + '</div>',
          buttons: [
            { label: 'Levels', cls: 'btn-ghost', onClick: showLevels },
            { label: '↻ Replay', cls: 'btn-blue', onClick: function () { startLevel(L.level, false); } },
            L.level < LPT ? { label: 'Next ▶', cls: 'btn-green', onClick: function () { startLevel(L.level + 1, true); } } : null
          ].filter(Boolean)
        });
      }
      function saveRun() {
        if (screen === 'play' && run && !run.finished) BB.store.set('adv:run', { run: run, state: engine.getState() });
        BB.store.set('adv:screen', { screen: screen, t: curT });
      }

      // Restore where the player left off (including a level in progress).
      var where = BB.store.get('adv:screen', { screen: 'worlds' });
      var saved = BB.store.get('adv:run', null);
      if (where.screen === 'play' && saved && saved.run) {
        curT = saved.run.trophy; L = makeLevel(curT, saved.run.level);
        buildPlay(); screen = 'play';
        menu.classList.add('hidden'); play.classList.remove('hidden');
        run = saved.run; engine.setState(saved.state); updateHud();
      } else if (where.screen === 'levels') { curT = where.t || 0; showLevels(); }
      else showWorlds();

      return {
        show: function () {
          if (engine && screen === 'play') { engine.layout(); updateHud(); }
          if (pendingEnd) { var pe = pendingEnd; pendingEnd = null; endLevel(pe[0], pe[1]); }
          else if (screen === 'play' && engine && !run.finished && !engine.anyMove()) endLevel(false, 'No space left for these blocks.');
          if (!BB.store.get('adv:seenHelp', false)) { BB.store.set('adv:seenHelp', true); help(); }
        },
        hide: saveRun,
        _debug: function () { return { L: L, run: run, engine: engine, start: startLevel, setWorld: function (i) { curT = i; } }; }
      };
    }
  });
})();

  <script>
/* BLOCK BLASTER — game collections (used by Mini Games and Relaxing Games).
   A collection shows a grid of game cards and runs one game at a time inside a
   frame with Back / Help / Restart buttons. Games plug in with register(def):

   BB.minigames.register({
     id: 'tictactoe', name: 'Tic-Tac-Toe', icon: '❌', color: '#ff4d6d',
     desc: 'One-line description for the card',
     help: '<p>HTML instructions shown in the Help dialog</p>',
     create: function (host, ctx) {           // host: an empty <div> that fills the frame
       ...build DOM / canvas inside host...
       return {
         restart: function () {},             // required: start over
         destroy: function () {},             // required: remove listeners, stop loops
         pause:   function () {},             // optional: called when player leaves the mode
         resume:  function () {}              // optional: called when the player returns
       };
     }
   });

   ctx gives the game:
     ctx.sfx(name)            play a sound effect (see BB.audio.list)
     ctx.setScore(text)       text in the frame's score badge ('' hides it)
     ctx.store.get(k, def) / ctx.store.set(k, v)   per-game local save
     ctx.reducedMotion()      true when animations should be minimal
     ctx.celebrate(msg)       confetti + toast
     ctx.burst(x, y, color)   particle burst at page coordinates
     ctx.toast(msg)
*/
(function () {
  'use strict';
  var BB = window.BB, U = BB.util;

  function makeCollection(kind, opts) {
    var games = [];
    var api = {
      kind: kind,
      games: games,
      register: function (def) {
        if (!def || !def.id || typeof def.create !== 'function') throw new Error('Invalid game definition');
        games.push(def);
      },
      mount: mount
    };

    function mount(root) {
      var current = null, currentDef = null;
      root.innerHTML = '';
      var header = U.el('div', 'mode-header');
      header.innerHTML = '<div class="mode-title"><span class="mode-icon">' + opts.icon + '</span>' + opts.title +
        '</div><div class="mode-sub">' + opts.subtitle + '</div>';
      root.appendChild(header);
      if (opts.toggles) {
        var tg = U.el('div', 'relax-toggles');
        tg.innerHTML =
          '<label class="switch-row"><input type="checkbox" data-k="relaxSound"> <span>🔊 Sounds</span></label>' +
          '<label class="switch-row"><input type="checkbox" data-k="relaxAnim"> <span>✨ Animations</span></label>';
        Array.prototype.forEach.call(tg.querySelectorAll('input'), function (inp) {
          inp.checked = !!BB.settings.get(inp.dataset.k);
          inp.addEventListener('change', function () { BB.settings.set(inp.dataset.k, inp.checked); });
        });
        BB.settings.onChange(function (k, v) {
          var i = tg.querySelector('input[data-k="' + k + '"]'); if (i) i.checked = !!v;
        });
        header.appendChild(tg);
      }
      var grid = U.el('div', 'game-grid');
      root.appendChild(grid);
      var frame = U.el('div', 'game-frame hidden');
      frame.innerHTML =
        '<div class="frame-bar">' +
        '<button class="btn btn-small btn-ghost js-back" aria-label="Back to list">◀<span class="bt-label"> Back</span></button>' +
        '<div class="frame-title"></div>' +
        '<div class="frame-score hidden"></div>' +
        '<button class="btn btn-small btn-ghost js-help" aria-label="Instructions">❓<span class="bt-label"> Help</span></button>' +
        '<button class="btn btn-small btn-primary js-restart" aria-label="Restart">↻<span class="bt-label"> Restart</span></button>' +
        '</div><div class="frame-host"></div>';
      root.appendChild(frame);
      var host = frame.querySelector('.frame-host');
      var scoreEl = frame.querySelector('.frame-score');

      games.forEach(function (g) {
        var card = U.el('button', 'game-card');
        card.style.setProperty('--card', g.color || '#3a86ff');
        card.innerHTML = '<span class="game-card-icon">' + g.icon + '</span><span class="game-card-name">' +
          U.esc(g.name) + '</span><span class="game-card-desc">' + U.esc(g.desc || '') + '</span>';
        card.addEventListener('click', function () { BB.audio.sfx('select'); open(g); });
        grid.appendChild(card);
      });

      function makeCtx(def) {
        return {
          sfx: function (n) { BB.audio.sfx(n, { relax: !!opts.toggles }); },
          setScore: function (t) { scoreEl.textContent = t || ''; scoreEl.classList.toggle('hidden', !t); },
          store: BB.store.ns(kind + ':' + def.id),
          reducedMotion: function () { return BB.settings.get('reducedMotion') || (opts.toggles && !BB.settings.get('relaxAnim')); },
          celebrate: function (msg) {
            BB.fx.confetti(80); BB.audio.sfx('win', { relax: !!opts.toggles });
            if (msg) BB.ui.toast(msg, 2500);
          },
          burst: function (x, y, color, n) {
            if (opts.toggles && !BB.settings.get('relaxAnim')) return;
            BB.fx.burst(x, y, color, n);
          },
          toast: function (m) { BB.ui.toast(m); }
        };
      }
      function open(def) {
        close();
        currentDef = def;
        grid.classList.add('hidden'); header.classList.add('compact');
        frame.classList.remove('hidden');
        frame.querySelector('.frame-title').textContent = def.icon + ' ' + def.name;
        scoreEl.classList.add('hidden');
        host.innerHTML = '';
        try { current = def.create(host, makeCtx(def)); }
        catch (e) { console.error(e); host.innerHTML = '<p class="error">Sorry, this game failed to start.</p>'; }
        BB.store.set(kind + ':last', def.id);
        if (!BB.store.get(kind + ':seenHelp:' + def.id, false)) {
          BB.store.set(kind + ':seenHelp:' + def.id, true);
          showHelp();
        }
      }
      function close() {
        if (current && current.destroy) { try { current.destroy(); } catch (e) { console.error(e); } }
        current = null; currentDef = null;
        host.innerHTML = '';
        frame.classList.add('hidden'); grid.classList.remove('hidden'); header.classList.remove('compact');
      }
      function showHelp() {
        if (!currentDef) return;
        BB.ui.modal({ title: currentDef.icon + ' ' + currentDef.name, html: currentDef.help || '<p>Have fun!</p>', buttons: [{ label: 'Got it!' }] });
      }
      frame.querySelector('.js-back').addEventListener('click', function () { BB.audio.sfx('click'); close(); });
      frame.querySelector('.js-help').addEventListener('click', function () { BB.audio.sfx('click'); showHelp(); });
      frame.querySelector('.js-restart').addEventListener('click', function () {
        BB.audio.sfx('click');
        if (current && current.restart) current.restart();
      });

      // Reopen the game the player was last using (progress lives in each game's store).
      var last = BB.store.get(kind + ':open', null);
      if (last) { var d = games.filter(function (g) { return g.id === last; })[0]; if (d) open(d); }

      return {
        show: function () { if (current && current.resume) current.resume(); },
        hide: function () {
          BB.store.set(kind + ':open', currentDef ? currentDef.id : null);
          if (current && current.pause) current.pause();
        },
        openById: function (id) { var d = games.filter(function (g) { return g.id === id; })[0]; if (d) open(d); },
        closeGame: close
      };
    }
    return api;
  }

  BB.minigames = makeCollection('minigames', {
    icon: '🎮', title: 'Mini Games', subtitle: 'Quick games to play solo or with a friend on the same device.'
  });
  BB.relax = makeCollection('relax', {
    icon: '🌈', title: 'Relaxing Games', subtitle: 'No timers, no pressure. Just calm, satisfying play.', toggles: true
  });

  BB.registerMode('minigames', {
    music: 'minigames',
    init: function (el) { return BB.minigames.mount(el); }
  });
  BB.registerMode('relax', {
    music: 'relax',
    init: function (el) { return BB.relax.mount(el); }
  });
})();

  <script>
/* BLOCK BLASTER — Mini game: Tic-Tac-Toe.
   Play the computer (Easy / Medium / Hard) or a friend on the same device.
   Hard uses full minimax, so it never loses. Scores are saved per mode. */
(function () {
  'use strict';
  var BB = window.BB, U = BB.util;

  /* Shared mini-game helper (also defined by the other mini-game files; first one wins).
     Keeps `el` as large as possible inside `wrap` with aspect ratio w/h = ratio (number or function), capped at max px wide. */
  BB.mgFitSquare = BB.mgFitSquare || function (wrap, el, max, ratioArg, onSize) {
    function update() {
      var w = wrap.clientWidth, h = wrap.clientHeight;
      if (!w || !h) return;
      var ratio = (typeof ratioArg === 'function' ? ratioArg() : ratioArg) || 1;
      var width = Math.floor(Math.min(w, h * ratio, max || 9999));
      el.style.width = width + 'px';
      el.style.height = Math.floor(width / ratio) + 'px';
      if (onSize) onSize(width, Math.floor(width / ratio));
    }
    var ro = window.ResizeObserver ? new ResizeObserver(update) : null;
    if (ro) ro.observe(wrap); else window.addEventListener('resize', update);
    update();
    return { update: update, disconnect: function () { if (ro) ro.disconnect(); else window.removeEventListener('resize', update); } };
  };

  var LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
  // Big friendly marks drawn as SVG so the colors are the same on every device.
  var MARK_SVG = {
    X: '<svg viewBox="0 0 100 100" class="mg-mark mg-mark-x" aria-hidden="true"><path d="M24 24 L76 76 M76 24 L24 76"/></svg>',
    O: '<svg viewBox="0 0 100 100" class="mg-mark mg-mark-o" aria-hidden="true"><circle cx="50" cy="50" r="28"/></svg>'
  };
  var MODES = [
    { id: 'easy', label: '🤖 Easy' },
    { id: 'medium', label: '🤖 Medium' },
    { id: 'hard', label: '🤖 Hard' },
    { id: 'pvp', label: '👫 2 Players' }
  ];

  /** Returns { player: 'X'|'O', line: [a,b,c] } or null. */
  function winner(b) {
    for (var i = 0; i < LINES.length; i++) {
      var l = LINES[i];
      if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { player: b[l[0]], line: l };
    }
    return null;
  }
  function emptyCells(b) {
    var out = [];
    for (var i = 0; i < 9; i++) if (!b[i]) out.push(i);
    return out;
  }
  // Minimax with depth so the computer wins fast and loses slow.
  function minimax(b, turn, me, depth) {
    var w = winner(b);
    if (w) return w.player === me ? 10 - depth : depth - 10;
    var free = emptyCells(b);
    if (!free.length) return 0;
    var best = turn === me ? -Infinity : Infinity;
    for (var i = 0; i < free.length; i++) {
      b[free[i]] = turn;
      var s = minimax(b, turn === 'X' ? 'O' : 'X', me, depth + 1);
      b[free[i]] = null;
      best = turn === me ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function bestMove(b, me) {
    var free = emptyCells(b), bestScore = -Infinity, choices = [];
    for (var i = 0; i < free.length; i++) {
      b[free[i]] = me;
      var s = minimax(b, me === 'X' ? 'O' : 'X', me, 1);
      b[free[i]] = null;
      if (s > bestScore) { bestScore = s; choices = [free[i]]; }
      else if (s === bestScore) choices.push(free[i]);

  // A move that wins immediately for `who`, or -1.
  function finishingMove(b, who) {
    var free = emptyCells(b);
    for (var i = 0; i < free.length; i++) {
      b[free[i]] = who;
      var w = winner(b);
      b[free[i]] = null;

    var free = emptyCells(b);
    if (level === 'hard') return bestMove(b, me);
    if (level === 'medium') {
      if (Math.random() < 0.7) return bestMove(b, me);
      return U.pick(free);
    }
    // easy: mostly random, but grabs an obvious win now and then
    var win = finishingMove(b, me);
    if (win >= 0 && Math.random() < 0.5) return win;
    return U.pick(free);
  }

  BB.minigames.register({
    id: 'tictactoe', name: 'Tic-Tac-Toe', icon: '❌', color: '#ff4d6d',
    desc: 'Beat the robot or a friend: get three in a row!',
    help: '<p>Take turns placing your mark on the 3×3 board. Get <b>three in a row</b> (across, down or diagonal) to win!</p>' +
      '<ul><li><b>🤖 Easy / Medium / Hard</b>: you are ❌, the robot is ⭕. Hard never loses — can you get a draw?</li>' +
      '<li><b>👫 2 Players</b>: share the device and take turns.</li></ul>' +
      '<p>Press <b>Rematch</b> for another round. Starting turns swap each round. Your scores are saved.</p>',
    create: function (host, ctx) {

      var scores = ctx.store.get('scores', {});

      var root = U.el('div', 'mg-root mg-ttt');
      root.innerHTML =
        '<div class="mg-seg js-modes" role="group" aria-label="Choose opponent"></div>' +
        '<div class="mg-ttt-scores">' +
        '<div class="mg-ttt-score mg-x"><span class="js-xname"></span><b class="js-xs">0</b></div>' +
        '<div class="mg-ttt-score mg-d"><span>Draws</span><b class="js-ds">0</b></div>' +
        '<div class="mg-ttt-score mg-o"><span class="js-oname"></span><b class="js-os">0</b></div>' +
        '</div>' +
        '<div class="mg-status js-status" aria-live="polite"></div>' +
        '<div class="mg-fit js-fit"><div class="mg-ttt-board js-board" role="grid" aria-label="Tic-Tac-Toe board"></div></div>' +
        '<div class="mg-btn-row"><button class="btn btn-green js-rematch">🔁 Rematch</button>' +
        '<button class="btn btn-ghost btn-small js-reset">Reset scores</button></div>';
      host.appendChild(root);

      var seg = root.querySelector('.js-modes');
      MODES.forEach(function (m) {
        var b = U.el('button', 'mg-seg-btn', m.label);
        b.dataset.mode = m.id;
        b.addEventListener('click', function () {
          if (mode === m.id) return;
          ctx.sfx('select'); mode = m.id; ctx.store.set('mode', mode); starter = 'X'; newRound();
        });
        seg.appendChild(b);
      });
      var boardEl = root.querySelector('.js-board');
      var cells = [];
      for (var i = 0; i < 9; i++) {
        (function (idx) {
          var c = U.el('button', 'mg-ttt-cell');
          c.setAttribute('aria-label', 'Square ' + (idx + 1));
          c.addEventListener('click', function () { humanMove(idx); });
          boardEl.appendChild(c); cells.push(c);
        })(i);
      }
      var statusEl = root.querySelector('.js-status');
      root.querySelector('.js-rematch').addEventListener('click', function () { ctx.sfx('click'); newRound(); });
      root.querySelector('.js-reset').addEventListener('click', function () {
        ctx.sfx('click'); scores[mode] = { x: 0, o: 0, d: 0 }; ctx.store.set('scores', scores); renderScores();
      });
      var fit = BB.mgFitSquare(root.querySelector('.js-fit'), boardEl, 460);

      function vsComputer() { return mode !== 'pvp'; }
      function sc() { return (scores[mode] = scores[mode] || { x: 0, o: 0, d: 0 }); }
      function names() { return vsComputer() ? { X: '❌ You', O: '⭕ Robot' } : { X: '❌ Player 1', O: '⭕ Player 2' }; }

      function renderScores() {
        var s = sc(), n = names();
        root.querySelector('.js-xname').textContent = n.X;
        root.querySelector('.js-oname').textContent = n.O;
        root.querySelector('.js-xs').textContent = s.x;
        root.querySelector('.js-os').textContent = s.o;
        root.querySelector('.js-ds').textContent = s.d;
        ctx.setScore(n.X.split(' ')[0] + ' ' + s.x + ' : ' + s.o + ' ' + n.O.split(' ')[0]);

  <script>

(function () {

          b.classList.toggle('active', b.dataset.diff === diff);
          b.setAttribute('aria-pressed', b.dataset.diff === diff ? 'true' : 'false');

      }

      function newPuzzle() {
        clearTimers();
        var L = LEVELS[diff], n = L.grid * L.grid;
        var palette = U.shuffle([0, 1, 2, 3, 4, 5]);
        cubes = []; targets = []; els = []; moves = 0; par = 0; won = false;
        winEl.classList.add('hidden');
        for (var i = 0; i < n; i++) {
          var s = randomCube(palette, L.colors);
          // pick a target orientation that needs at least one move
          var opts = allOrientations(s).filter(function (o) { return !matches(s, o.state, L.top); });
          var t = U.pick(opts).state;
          cubes.push(s); targets.push(t);
          par += minMoves(s, t, L.top);
        }
        // target picture
        targetEl.innerHTML = '';
        targetEl.style.gridTemplateColumns = 'repeat(' + L.grid + ', 1fr)';
        targetEl.classList.toggle('with-top', L.top);
        targets.forEach(function (t) {
          var cell = U.el('div', 'mg-cube-tcell');
          if (L.top) cell.innerHTML = '<div class="mg-tc-top" style="--fc:' + COLORS[t.U].c + '"></div>';
          cell.innerHTML += '<div class="mg-tc-front" style="--fc:' + COLORS[t.F].c + '">' + COLORS[t.F].s + '</div>';
          targetEl.appendChild(cell);
        });
        // cube board
        boardEl.innerHTML = '';
        boardEl.style.gridTemplateColumns = 'repeat(' + L.grid + ', 1fr)';
        cubes.forEach(function (s, i) {
          var el = U.el('div', 'mg-cube-cell');
          el.setAttribute('role', 'button');
          el.setAttribute('tabindex', '0');
          el.innerHTML = '<div class="mg-cube-scene"><div class="mg-cube">' +
            FACES.map(function (f) { return faceHtml(f, s[f]); }).join('') + '</div></div><span class="mg-cube-ok">✓</span>';

      function attachInput(el, i) {
        var sx = 0, sy = 0, down = false;

        el.addEventListener('keydown', function (e) {

      }

      function doRoll(i, dir) {
        var el = els[i];

        var apply = function () {
          cubes[i] = roll(cubes[i], dir);
          paint(i);
          stats();
          check(i);
        };
        if (ctx.reducedMotion()) { apply(); return; }
        var cube = el.querySelector('.mg-cube');
        el.dataset.busy = '1';
        cube.classList.add('turning');
        cube.style.setProperty('--mx', dir === 'up' ? '90deg' : dir === 'down' ? '-90deg' : '0deg');
        cube.style.setProperty('--my', dir === 'right' ? '90deg' : dir === 'left' ? '-90deg' : '0deg');
        timers.push(setTimeout(function () {
          // snap back to the rest pose with the new colors, without animating
          cube.classList.remove('turning');
          cube.style.setProperty('--mx', '0deg'); cube.style.setProperty('--my', '0deg');
          void cube.offsetWidth;
          delete el.dataset.busy;
          apply();

        stats();
      }

      function check(i) {
        var L = LEVELS[diff];
        if (matches(cubes[i], targets[i], L.top)) {
          ctx.sfx('correct');
          var r = els[i].getBoundingClientRect();
          ctx.burst(r.left + r.width / 2, r.top + r.height / 2, COLORS[cubes[i].F].c, 10);
        }
        for (var k = 0; k < cubes.length; k++) if (!matches(cubes[k], targets[k], L.top)) return;
        won = true;
        var stars = moves <= par ? 3 : moves <= par + Math.ceil(cubes.length / 2) ? 2 : 1;
        best[diff] = Math.max(best[diff] || 0, stars);
        ctx.store.set('best', best);
        ctx.store.set('wins', ctx.store.get('wins', 0) + 1);
        stats();
        ctx.celebrate('Cubes matched!');
        timers.push(setTimeout(function () {
          q('.js-wstars').textContent = '★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars);
          q('.js-wmsg').textContent = moves + ' moves (best possible: ' + par + ')';
          winEl.classList.remove('hidden');
          ctx.sfx('star');
        }, ctx.reducedMotion() ? 50 : 650));
      }

      newPuzzle();

      var inst = {
        restart: newPuzzle,
        destroy: function () { clearTimers(); fit.disconnect(); },
        // test hook: solve by rolling every cube along its shortest route
        _solve: function () {
          var L = LEVELS[diff];
          cubes.forEach(function (s, i) {
            var all = allOrientations(s), goal = null;
            for (var a = 0; a < all.length; a++) if (matches(all[a].state, targets[i], L.top)) { goal = all[a]; break; }
            // re-walk with BFS parents
            var prev = {}, queue = [s]; prev[key(s)] = null;
            while (queue.length) {
              var cur = queue.shift();
              if (key(cur) === key(goal.state)) break;
              DIRS.forEach(function (d) { var n = roll(cur, d), k = key(n); if (!(k in prev)) { prev[k] = [key(cur), d, cur]; queue.push(n); } });
            }
            var seq = [], k = key(goal.state);
            while (prev[k]) { seq.unshift(prev[k][1]); k = prev[k][0]; }

          });
          check(0);
        },
        _state: function () { return { moves: moves, par: par, won: won }; }
      };
      BB.mgCube = inst;
      return inst;
    }
  });
})();

</script>
  <script>
/* BLOCK BLASTER — Mini game: Trampoline Park.
   A cartoon kid bounces on trampolines by themselves. Move left/right to land on a trampoline,
   grab stars and coins, dodge birds and spiky balls, and tap in the air to flip for bonus points.
   Land in the middle of a flip and the trick fails. Miss the trampolines and you fall in the foam pit. */
(function () {
  'use strict';
  var BB = window.BB, U = BB.util;

  var WORLD_W = 400;        // world units across; height follows the canvas shape
  var MIN_H = 520;
  var GRAVITY = 1500;
  var MOVE_SPEED = 270;
  var FLIP_TIME = 0.5;      // seconds per flip
  var CHAR_R = 20;

  BB.minigames.register({
    id: 'trampoline', name: 'Trampoline Park', icon: '🤸', color: '#ff9f1c',
    desc: 'Bounce, flip, grab stars and dodge birds!',
    help: '<p>Your jumper bounces all by themselves. Steer them so they always land on a <b>trampoline</b>!</p>' +
      '<ul><li><b>Move</b>: ◀ ▶ buttons, arrow keys / A-D, or drag on the screen.</li>' +
      '<li><b>Flip</b>: tap the screen, press 🤸, Space or ↑ while in the air. Finish the flip before you land for bonus points — more flips in one jump = way more points!</li>' +
      '<li>Collect ⭐ stars and 🪙 coins. Avoid 🐦 birds and spiky balls.</li>' +
      '<li>Falling into the foam pit or getting hit costs a ❤️.</li></ul>' +
      '<p>It gets faster the longer you bounce. Press P to pause.</p>',
    create: function (host, ctx) {
      var root = U.el('div', 'mg-root mg-tramp');
      root.innerHTML =
        '<div class="mg-tramp-stage js-stage"><canvas class="mg-tramp-canvas" aria-label="Trampoline Park game area"></canvas></div>' +
        '<div class="mg-tramp-controls">' +
        '<button class="mg-ctl js-left" aria-label="Move left">◀</button>' +
        '<button class="mg-ctl mg-ctl-flip js-flip" aria-label="Flip">🤸 Flip</button>' +
        '<button class="mg-ctl js-right" aria-label="Move right">▶</button>' +
        '</div>';
      host.appendChild(root);
      var stage = root.querySelector('.js-stage');
      var canvas = root.querySelector('canvas');
      var g = canvas.getContext('2d');

      var cssW = 0, cssH = 0, dpr = 1, scale = 1, H = MIN_H, offX = 0;
      var raf = 0, last = 0, destroyed = false;
      var best = ctx.store.get('best', 0);
      var state = 'ready'; // ready | playing | paused | over
      var keys = { left: false, right: false }, btnHeld = { left: false, right: false };
      var drag = null; // {id, x0, y0, t0, moved, wx}
      var S; // game state, see reset()

      /* ---------- layout ---------- */

      if (ro) ro.observe(stage); else window.addEventListener('resize', resize);

      function trampY() { return H - 70; }
      function layoutTramps() {

        S.tramps = [70, 200, 330].map(function (cx, i) {
          var old = S.tramps && S.tramps[i];

      }

      /* ---------- game state ---------- */
      function reset() {
        S = {
          score: 0, lives: 3, level: 1, time: 0,
          x: 200, y: 0, vx: 0, vy: 0, angle: 0, face: 1,
          flipping: false, flipT: 0, flips: 0, invuln: 0,
          items: [], foes: [], pops: [], sparks: [], clouds: [],

      }
      function saveBest() {

      }
      function pauseGame() {

      }
      function loop() {

      function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

      /* ---------- update ---------- */

      function addScore(n) {

      function loseLife(reason) {

        S.flipping = false; S.flips = 0; S.angle = 0;
        if (!ctx.reducedMotion()) S.shake = 0.3;
        ctx.sfx('hit');
        popText(S.x, S.y - 30, reason, '#ff4d6d');

      function gameOver() {
        state = 'over';
        S.overAt = performance.now(); // so the tap that ended the game doesn't instantly restart it
        stopLoop();
        var isBest = S.score > best;
        if (isBest) { best = S.score; ctx.store.set('best', best); }
        S.newBest = isBest;
        ctx.store.set('games', ctx.store.get('games', 0) + 1);
        ctx.setScore('⭐ ' + U.fmt(S.score) + '  ·  Best ' + U.fmt(best));
        if (isBest && S.score > 0) ctx.celebrate('New best score: ' + U.fmt(S.score) + '!');
        else ctx.sfx('lose');
      }
      function flip() {
        if (state !== 'playing') { if (state !== 'over' || overReady()) start(); return; }
        if (S.flipping || S.invuln > 1.2) return;
        S.flipping = true; S.flipT = 0;
        ctx.sfx('whoosh');
      }
      // brief delay before a tap on the game-over screen restarts (so a mid-game tap doesn't skip it)
      function overReady() { return !S.overAt || performance.now() - S.overAt > 700; }

      function update(dt) {
        S.time += dt;
        var newLevel = 1 + Math.floor(S.time / 25);

          S.level = newLevel; layoutTramps();
          popText(200, H * 0.35, 'Level ' + S.level + '!', '#ffd166');
          ctx.sfx('chime');
        }
        // horizontal movement: keys/buttons, or drag target
        var dir = (keys.right || btnHeld.right ? 1 : 0) - (keys.left || btnHeld.left ? 1 : 0);
        if (dir) S.vx = dir * MOVE_SPEED;

        } else S.vx *= Math.pow(0.0005, dt);
        if (Math.abs(S.vx) > 5) S.face = S.vx > 0 ? 1 : -1;
        S.x = U.clamp(S.x + S.vx * dt, CHAR_R, WORLD_W - CHAR_R);

        var prevY = S.y;

        S.y += S.vy * dt;

            S.flipping = false; S.flips++; S.angle = 0;
            ctx.sfx('sparkle');
            popText(S.x, S.y - 34, S.flips === 1 ? 'Flip!' : S.flips + 'x Flip!', '#ffd166');

              type: Math.random() < 0.35 ? 'star' : 'coin',

        if (S.foeTimer <= 0) {

          var spiky = S.level >= 2 && Math.random() < 0.4;
          if (spiky) {
            S.foes.push({ type: 'spiky', x: 30 + Math.random() * (WORLD_W - 60), y: -20, vx: 0, vy: 55 + S.level * 9, ph: Math.random() * 6, r: 15 });
          } else {

          if (f.x < -60 || f.x > WORLD_W + 60 || f.y > H + 40) { S.foes.splice(i, 1); continue; }
          if (S.invuln <= 0 && Math.hypot(f.x - S.x, f.y - S.y) < CHAR_R + f.r - 4) {
            S.foes.splice(i, 1);
