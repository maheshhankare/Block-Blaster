        for (i = S.sparks.length - 1; i >= 0; i--) {
          var p = S.sparks[i];
          p.life -= dt; p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.life <= 0) S.sparks.splice(i, 1);
        }
        if (!ctx.reducedMotion()) S.clouds.forEach(function (c) { c.x += 8 * c.s * dt; if (c.x > WORLD_W + offX + 80) c.x = -offX - 80; });
        if (S.shake > 0) S.shake -= dt;
      }

      /* ---------- drawing ---------- */
      function rr(x, y, w, h, r) {
        if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
        r = Math.max(0, Math.min(r, w / 2, h / 2));
        g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
      }
      function starPath(x, y, r1, r2) {
        g.beginPath();
        for (var i = 0; i < 10; i++) {
          var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? r2 : r1;
          g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        }
        g.closePath();
      }
      function drawBackground() {
        var L = -offX, R = WORLD_W + offX;
        var sky = g.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#6ec9ff'); sky.addColorStop(0.7, '#c9f0ff'); sky.addColorStop(1, '#fff3c4');
        g.fillStyle = sky; g.fillRect(L, 0, R - L, H);
        // sun
        g.fillStyle = '#ffe066'; g.beginPath(); g.arc(R - 50, 55, 26, 0, 6.283); g.fill();
        // clouds
        g.fillStyle = 'rgba(255,255,255,.9)';
        S.clouds.forEach(function (c) {
          g.beginPath();
          g.arc(c.x, c.y, 16 * c.s, 0, 6.283); g.arc(c.x + 18 * c.s, c.y - 8 * c.s, 20 * c.s, 0, 6.283);
          g.arc(c.x + 38 * c.s, c.y, 15 * c.s, 0, 6.283); g.fill();

      cv.addEventListener('pointercancel', onUp);

        ctx.sfx('whoosh');
        for (var i = 0; i < 8; i++) spawn(W / 2 + (Math.random() - 0.5) * 60, H - 10, 12 + Math.random() * 26, i === 3 ? randomKind() : 'plain', true);
      });

        film.addColorStop(0.7, 'hsla(' + ((h + 180) % 360) + ',90%,65%,.5)'); film.addColorStop(1, 'hsla(' + ((h + 270) % 360) + ',90%,65%,.55)');
        g.strokeStyle = film; g.lineWidth = Math.max(1.5, r * 0.09); g.beginPath(); g.arc(x, y, r * 0.96, 0, 6.283); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = Math.max(1.5, r * 0.08); g.lineCap = 'round';
        g.beginPath(); g.arc(x, y, r * 0.72, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(x + r * 0.35, y + r * 0.4, r * 0.07, 0, 6.283); g.fill();

          g.globalAlpha = 0.9; g.fillText(b.kind === 'star' ? '⭐' : b.kind === 'rainbow' ? '🌈' : '🎵', x, y + r * 0.05); g.globalAlpha = 1;
          if (b.kind === 'star') { g.strokeStyle = 'rgba(255,215,60,.6)'; g.lineWidth = 3; g.beginPath(); g.arc(x, y, r + 3, 0, 6.283); g.stroke(); }
        }
      }
      function render(dt) {
        var sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#8fd8ff'); sky.addColorStop(0.6, '#d8f3ff'); sky.addColorStop(1, '#fde2ff');

        clouds.forEach(function (c) {

          g.fillStyle = 'rgba(255,255,255,.8)';

        });

          var rg = rings[j]; rg.t += dt;

          g.strokeStyle = 'rgba(255,255,255,' + (1 - rg.t / 0.3) + ')'; g.lineWidth = 2;
          g.beginPath(); g.arc(rg.x, rg.y, rg.r * (rm ? 1 : 1 + rg.t * 1.5), 0, 6.283); g.stroke();
        }
        for (var d = drops.length - 1; d >= 0; d--) {
          var p = drops[d]; p.t += dt;
          if (p.t > p.life) { drops.splice(d, 1); continue; }

          g.fillStyle = 'rgba(255,255,255,' + (1 - p.t / p.life) * 0.9 + ')';
          g.beginPath(); g.arc(p.x, p.y, 2.2, 0, 6.283); g.fill();
        }
      }

      var alive = true;
      var loop = makeLoop(function (dt) {
        clock += dt; spawnT -= dt;
        var max = Math.round(U.clamp(W * H / 22000, 8, 22));
        if (spawnT <= 0 && bubbles.length < max) { spawnT = 0.5 + Math.random() * 0.6; spawn(null, null, null, randomKind()); }
        render(dt);
      });

      var unwatch = watchSize(stage, function () { layout(); });
      layout();
      for (var i = 0; i < 6; i++) spawn(null, H * (0.3 + Math.random() * 0.7), null, 'plain');
      totalEl.textContent = '🏆 ' + U.fmt(total) + ' all-time';
      ctx.setScore('🫧 0');
      loop.start();

      return {
        restart: function () { count = 0; countEl.textContent = '0 popped'; ctx.setScore('🫧 0'); bubbles = []; spawnT = 0; },
        pause: function () { loop.stop(); store.set('total', total); },
        resume: function () { totalEl.textContent = '🏆 ' + U.fmt(total) + ' all-time'; loop.start(); },
        destroy: function () {

          cv.removeEventListener('pointerup', onUp); cv.removeEventListener('pointercancel', onUp);
          if (root.parentNode) root.parentNode.removeChild(root);
        }
      };
    }
  });
})();

  <script>
/* BLOCK BLASTER — Colour Sort: a calm ball-sort puzzle.
   Tap a tube to pick up its top ball, tap another to drop it there (onto the same
   colour or into an empty tube). Every level is checked with a solver before it
   is shown, so it is always solvable. Unlimited undo, hints, no timer. */
(function () {
  'use strict';
  var BB = window.BB, U = BB.util;
  var CAP = 4;
  var COLORS = [
    ['#ff4d6d', '♥'], ['#ffb703', '★'], ['#06d6a0', '●'], ['#3a86ff', '◆'], ['#8338ec', '▲'],
    ['#ff7f11', '■'], ['#ff70a6', '✿'], ['#4cc9f0', '☾'], ['#7cb518', '✚']
  ];

  /* ---------- puzzle logic (pure; also used by tests) ---------- */
  function canMove(t, a, b, cap) {
    if (a === b || !t[a].length || t[b].length >= cap) return false;
    return !t[b].length || t[b][t[b].length - 1] === t[a][t[a].length - 1];
  }
  function isSolved(t, cap) {
    return t.every(function (x) { return !x.length || (x.length === cap && x.every(function (c) { return c === x[0]; })); });
  }
  function keyOf(t) { return t.map(function (x) { return x.join(','); }).sort().join('|'); }

  function solve(tubes, cap, budget) {
    cap = cap || CAP; budget = budget || 200000;
    var t = tubes.map(function (x) { return x.slice(); }), seen = {}, path = [], nodes = 0;
    function uniform(x) { for (var i = 1; i < x.length; i++) if (x[i] !== x[0]) return false; return true; }
    function dfs() {
      if (isSolved(t, cap)) return true;
      if (++nodes > budget) return false;
      var k = keyOf(t); if (seen[k]) return false; seen[k] = 1;
      var moves = [];
      for (var a = 0; a < t.length; a++) {
        if (!t[a].length) continue;
        if (t[a].length === cap && uniform(t[a])) continue;      // finished tube: leave it
        var emptyTried = false;
        for (var b = 0; b < t.length; b++) {
          if (!canMove(t, a, b, cap)) continue;
          if (!t[b].length) {
            if (uniform(t[a]) || emptyTried) continue;              // pointless or symmetric
            emptyTried = true; moves.push([a, b, 0]);

        }
      }
      moves.sort(function (m, n) { return n[2] - m[2]; });
      for (var i = 0; i < moves.length; i++) {
        var m = moves[i], ball = t[m[0]].pop(); t[m[1]].push(ball); path.push([m[0], m[1]]);
        if (dfs()) return true;
        path.pop(); t[m[0]].push(t[m[1]].pop());
        if (nodes > budget) return false;
      }
      return false;
    }
    return dfs() ? path : null;
  }
  function levelInfo(level) { return { colors: Math.min(COLORS.length, 3 + Math.floor((level - 1) / 2)), empty: 2 }; }
  function generate(level, rnd) {
    rnd = rnd || Math.random;
    var info = levelInfo(level);
    for (var attempt = 0; attempt < 60; attempt++) {
      var balls = [];
      for (var c = 0; c < info.colors; c++) for (var k = 0; k < CAP; k++) balls.push(c);
      for (var i = balls.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var tmp = balls[i]; balls[i] = balls[j]; balls[j] = tmp; }

    id: 'colorsort', name: 'Colour Sort', icon: '🧪', color: '#06d6a0',
    desc: 'Sort the balls so each tube has one colour.',
    help: '<p>Tap a tube to lift its top ball, then tap another tube to drop it in.</p>' +

      '<p>Fill every tube with a single colour to finish. Use ↶ <b>Undo</b> as much as you like, and 💡 for a hint. No timer!</p>',
    create: function (host, ctx) {
      var store = ctx.store;
      var root = U.el('div', 'rx-root rx-sort');
      var bar = U.el('div', 'rx-bar');
      bar.innerHTML = '<button class="rx-btn js-undo" aria-label="Undo">↶<span class="rx-lbl">Undo</span></button>' +
        '<button class="rx-btn js-hint" aria-label="Hint">💡<span class="rx-lbl">Hint</span></button>' +
        '<span class="rx-chip js-level"></span><span class="rx-chip rx-chip-soft js-moves"></span>';

      var board = U.el('div', 'rx-sort-board');
      var overlay = U.el('div', 'rx-overlay hidden');

      root.appendChild(bar); root.appendChild(stage); host.appendChild(root);

      var level = Math.max(1, store.get('level', 1));
      var start = null, tubes = [], history = [], sel = -1, moves = 0, won = false, timers = [];

        } else {
          start = generate(level); tubes = start.map(function (x) { return x.slice(); }); history = []; moves = 0;
        }

      }
      function save() { store.set('state', { level: level, start: start, tubes: tubes, history: history.slice(-300), moves: moves }); store.set('level', level); }
      function sizeBoard() {
        var r = stage.getBoundingClientRect(), n = tubes.length;

          if (done) el.classList.add('done');

            var ball = U.el('span', 'rx-ball', '<i>' + COLORS[c][1] + '</i>');

            el.appendChild(ball);
          });
          board.appendChild(el);
        });

        bar.querySelector('.js-moves').textContent = moves + ' moves';
        bar.querySelector('.js-undo').disabled = !history.length;
        ctx.setScore('🧪 Level ' + level);
      }
      function tubeEl(i) { return board.children[i]; }
      function topBall(i) { var el = tubeEl(i); return el && el.lastElementChild; }
      function tap(i) {
        if (won) return;
        if (sel < 0) {
          if (!tubes[i].length) { ctx.sfx('click'); return; }
          sel = i; ctx.sfx('select'); render(); return;
        }
        if (sel === i) { sel = -1; ctx.sfx('click'); render(); return; }

          ctx.sfx('boing');

        render();

          dst.style.transition = 'none';

          void dst.offsetWidth;
          dst.style.transition = ''; dst.style.transform = '';

          ctx.sfx('star');
          if (!ctx.reducedMotion()) { var rb = tubeEl(i).getBoundingClientRect(); ctx.burst(rb.left + rb.width / 2, rb.top + rb.height / 3, COLORS[t[0]][0], 12); }

        var rm = ctx.reducedMotion();
        later(function () {
          if (rm) { ctx.sfx('win'); ctx.toast('Level ' + level + ' sorted!'); } else ctx.celebrate('Level ' + level + ' sorted! 🎉');
          overlay.innerHTML = '<div class="rx-card"><div class="rx-card-title">🎉 All sorted!</div><p>Level ' + level + ' in ' + moves + ' moves.</p>' +
            '<button class="btn btn-green js-next">Next level ▶</button></div>';

        ctx.sfx('swipe'); render(); save();
      }

        if (won) return;

        Array.prototype.forEach.call(board.children, function (el) { el.classList.remove('hint'); });
        if (!path) { ctx.toast('Try Undo ↶ — this way gets stuck'); ctx.sfx('boing'); return; }
        if (!path.length) return;
        sel = -1; render();
        tubeEl(path[0][0]).classList.add('hint'); tubeEl(path[0][1]).classList.add('hint');
        ctx.sfx('sparkle');
        later(function () { Array.prototype.forEach.call(board.children, function (el) { el.classList.remove('hint'); }); }, 1800);
      }

      board.addEventListener('click', function (e) { var t = e.target.closest('.rx-tube'); if (t) tap(+t.dataset.i); });
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.classList.contains('js-undo')) undo(); else if (b.classList.contains('js-hint')) hint();
      });
      var ro = window.ResizeObserver ? new ResizeObserver(function () { sizeBoard(); }) : null;
      if (ro) ro.observe(stage);

      newLevel(true);

      return {
        restart: function () {
          tubes = start.map(function (x) { return x.slice(); }); history = []; moves = 0; sel = -1; won = false;
          overlay.classList.add('hidden'); ctx.sfx('whoosh'); render(); save();
        },
        destroy: function () {
          timers.forEach(clearTimeout); if (ro) ro.disconnect();
          if (root.parentNode) root.parentNode.removeChild(root);
        }
      };
    }
  });
})();

  <script>
/* BLOCK BLASTER — two more relaxing toys:

(function () {
  'use strict';

    { name: 'Gold', lobes: ['#ffd700', '#f5b700', '#ffcf40'], body: '#b8860b', cap: '#fff8dc' },

  ];
  BB.relax.register({
    id: 'spinner', name: 'Fidget Spinner', icon: '🌀', color: '#8338ec',
    desc: 'Flick it and watch it whirr.',
    help: '<p>Swipe around the spinner to flick it. The faster you swipe, the faster it spins!</p>' +
      '<p>Touch it to grab and stop it. 🎨 changes the style. Can you beat your best speed?</p>',
    create: function (host, ctx) {

      var root = U.el('div', 'rx-root rx-spinner');
      var bar = U.el('div', 'rx-bar');

      var W = 1, H = 1, dpr = 1, R = 100, cx = 0, cy = 0;
      var skin = U.clamp(store.get('skin', 0), 0, SKINS.length - 1);
      var theta = 0, omega = 0, grab = null, samples = [], lastLobe = 0, lastTick = 0, shownAt = 0, clock = 0;
      var best = store.get('bestRpm', 0), spins = store.get('spins', 0), spinAcc = 0;

      function layout() {

        dpr = Math.min(2.5, window.devicePixelRatio || 1);

      }
      function setSkin(i) { skin = i; store.set('skin', i); bar.querySelector('.js-skin-name').textContent = SKINS[i].name; }
      function showBest() { bestEl.textContent = '🏆 ' + best + ' rpm'; }

      function drawSpinner(a, alpha) {

        g.save(); g.globalAlpha = alpha; g.translate(cx, cy); g.rotate(a);

          g.quadraticCurveTo(R * 0.18, -R * 0.45, R * 0.22, 0); g.closePath(); g.fill();
          g.restore();

          var gr = g.createRadialGradient(lx - R * 0.1, ly - R * 0.1, R * 0.02, lx, ly, R * 0.34);
          gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, S.lobes[j]); gr.addColorStop(1, S.lobes[j]);

      cv.addEventListener('pointermove', onMove);
      cv.addEventListener('pointerup', onUp);
      cv.addEventListener('pointercancel', onUp);
      bar.querySelector('.js-skin').addEventListener('click', function () { ctx.sfx('select'); setSkin((skin + 1) % SKINS.length); });

      var loop = makeLoop(function (dt, now) {
        clock += dt;
        if (!grab) {
          var s = Math.abs(omega);

            s = Math.max(0, s - (0.35 + s * 0.09) * dt);   // bearing friction
            omega = omega < 0 ? -s : s;
            theta += omega * dt;

        }

          var rpm = Math.round(Math.abs(omega) / (Math.PI * 2) * 60);
          rpmEl.textContent = rpm + ' rpm';
          ctx.setScore('🌀 ' + rpm + ' rpm');
          if (rpm > best) { best = rpm; store.set('bestRpm', best); showBest(); }
          if (spinAcc > Math.PI * 2 * 10) { spins += Math.floor(spinAcc / (Math.PI * 2)); spinAcc = spinAcc % (Math.PI * 2); store.set('spins', spins); }

        restart: function () { omega = 0; theta = 0; ctx.sfx('click'); },
        pause: function () { loop.stop(); grab = null; },
        resume: function () { loop.start(); },

  /* =================== Sliding picture puzzle =================== */

    } else if (kind === 1) { // under the sea

      g.fillStyle = sea; g.fillRect(0, 0, S, S);
      g.fillStyle = '#ffe0a3'; g.beginPath(); g.moveTo(0, S); g.quadraticCurveTo(S * 0.5, S * 0.8, S, S * 0.9); g.lineTo(S, S); g.fill();

        g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = s * 0.1; g.beginPath(); g.moveTo(x, y - s * 0.55); g.lineTo(x, y + s * 0.55); g.stroke();
      });
      g.strokeStyle = '#2ec4b6'; g.lineWidth = S * 0.025; g.lineCap = 'round';
      for (i = 0; i < 4; i++) { var sx = S * (0.1 + i * 0.27); g.beginPath(); g.moveTo(sx, S); g.bezierCurveTo(sx - S * 0.05, S * 0.85, sx + S * 0.05, S * 0.78, sx, S * 0.68); g.stroke(); }
      for (i = 0; i < 8; i++) { g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 2; g.beginPath(); g.arc(S * (0.82 + Math.sin(i) * 0.04), S * (0.1 + i * 0.07), S * 0.015 + i, 0, 6.283); g.stroke(); }
    } else if (kind === 2) { // rocket in space
      var sp = g.createLinearGradient(0, 0, S, S); sp.addColorStop(0, '#240046'); sp.addColorStop(1, '#3c096c');
      g.fillStyle = sp; g.fillRect(0, 0, S, S);

      disc(g, S * 0.2, S * 0.78, S * 0.16, '#ff9f1c'); g.strokeStyle = '#ffd23f'; g.lineWidth = S * 0.02; g.beginPath(); g.ellipse(S * 0.2, S * 0.78, S * 0.26, S * 0.06, -0.3, 0, 6.283); g.stroke();
      disc(g, S * 0.82, S * 0.2, S * 0.08, '#4cc9f0');
      g.save(); g.translate(S * 0.55, S * 0.5); g.rotate(0.6);
      var s = S * 0.13;
      g.fillStyle = '#ff9f1c'; g.beginPath(); g.moveTo(-s * 0.4, s * 1.4); g.lineTo(0, s * 2.3); g.lineTo(s * 0.4, s * 1.4); g.fill();
      g.fillStyle = '#ffd23f'; g.beginPath(); g.moveTo(-s * 0.22, s * 1.4); g.lineTo(0, s * 1.9); g.lineTo(s * 0.22, s * 1.4); g.fill();
      g.fillStyle = '#ff4d6d'; g.beginPath(); g.moveTo(-s * 0.55, s * 0.6); g.lineTo(-s * 1.0, s * 1.4); g.lineTo(-s * 0.4, s * 1.2); g.fill();
      g.beginPath(); g.moveTo(s * 0.55, s * 0.6); g.lineTo(s * 1.0, s * 1.4); g.lineTo(s * 0.4, s * 1.2); g.fill();

  BB.relax.register({
    id: 'slide-puzzle', name: 'Picture Slide', icon: '🧩', color: '#ffb703',
    desc: 'Slide the tiles to rebuild the picture.',
    help: '<p>Tap a tile next to the empty space to slide it. You can tap a tile further along the same row or column to slide several at once.</p>' +

    create: function (host, ctx) {
      var store = ctx.store;
      var root = U.el('div', 'rx-root rx-slide');
      var bar = U.el('div', 'rx-bar');
      bar.innerHTML = '<button class="rx-btn js-new" aria-label="New picture">🖼️<span class="rx-lbl">New</span></button>' +
        '<button class="rx-btn js-size" aria-label="Change size"></button>' +
        '<button class="rx-btn js-peek" aria-pressed="false" aria-label="Peek at the picture">👀<span class="rx-lbl">Peek</span></button>' +
        '<button class="rx-btn rx-icon-btn js-nums" aria-pressed="false" aria-label="Show numbers">🔢</button>' +
        '<span class="rx-chip js-moves">0 moves</span>';
      var stage = U.el('div', 'rx-stage rx-slide-stage');
      var boardEl = U.el('div', 'rx-slide-board');

      var overlay = U.el('div', 'rx-overlay hidden');
      boardEl.appendChild(peekEl); stage.appendChild(boardEl); stage.appendChild(overlay);
      root.appendChild(bar); root.appendChild(stage); host.appendChild(root);

      var n = store.get('size', 3) === 4 ? 4 : 3, arr = [], tiles = [], pic = '', kind = 0, moves = 0, won = false, B = 300, timers = [];
      var nums = !!store.get('nums', false);

      function makePicture() {
        var c = document.createElement('canvas'), S = 600; c.width = c.height = S;
        kind = (kind + 1 + Math.floor(Math.random() * 3)) % 4;

      function build() {

        tiles = [];

          overlay.querySelector('.js-again').addEventListener('click', function () { ctx.sfx('select'); newGame(true); });

      }

      });
      bar.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        ctx.sfx('select');
        if (b.classList.contains('js-new')) newGame(true);

        else if (b.classList.contains('js-peek')) {
          var on = peekEl.classList.toggle('hidden') === false;

        }

      var unwatch = watchSize(stage, function () { size(); });
      newGame(true);
      return {

        destroy: function () { unwatch(); timers.forEach(clearTimeout); if (root.parentNode) root.parentNode.removeChild(root); }
      };
    }
  });
})();

  };

    var m = BB.ui.modal({
      title: '👤 Players', html: html,
      buttons: [{ label: '➕ New player', cls: 'btn-blue', onClick: function () { profileForm(null); } }, { label: 'Done' }]
    });
    function find(id) { return BB.profiles.list().filter(function (p) { return p.id === id; })[0]; }
    m.body.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.use) { BB.profiles.setCurrent(b.dataset.use); BB.audio.sfx('select'); m.close(); BB.ui.toast('Now playing: ' + find(b.dataset.use).name); }
      else if (b.dataset.edit) { m.close(); profileForm(find(b.dataset.edit)); }
      else if (b.dataset.del) {
        var p = find(b.dataset.del);
        BB.ui.confirm('Delete ' + U.esc(p.name) + '?', 'This removes the player and all of their quiz history and achievements from this device.', 'Delete').then(function (ok) {
          if (ok) { BB.profiles.remove(p.id); m.close(); profileManager(); }
        });
      }
    });
  }
  BB.quizUI = { profileManager: profileManager, profileForm: profileForm };

  /* ---------------- the Quizzes mode ---------------- */
  BB.registerMode('quiz', {
    music: 'quiz',
    init: function (root) {
      var run = null, timer = null, opts = BB.store.get('quiz:opts', { len: 10, timed: false });

      function render() {
        stopTimer();
        var p = BB.profiles.current();
        if (!p) return renderSetup();
        if (run && run.profileId === p.id) return run.done ? renderResults() : renderQuestion();
        renderMenu();
      }

      function renderSetup() {
        root.innerHTML = '<div class="mode-header"><div class="mode-title"><span class="mode-icon">🧠</span>Quizzes</div><div class="mode-sub">Fun questions in 8 subjects, picked for your age.</div></div>' +
          '<div class="panel qz-setup"><div class="big-emoji" style="font-size:56px;text-align:center">👋</div><h2 style="text-align:center;margin:4px 0">Who is playing?</h2>' +
          '<p style="text-align:center">Before the first quiz, create a player with a <b>name</b>, <b>age</b> and <b>profile picture</b>. Everything is saved only on this device.</p>' +
          '<p class="notice">' + AGE_RULE + '</p><div class="btn-row"><button class="btn btn-green js-create">🌟 Create player</button></div></div>';
        root.querySelector('.js-create').addEventListener('click', function () { profileForm(null); });
      }

      function renderMenu() {
        var p = BB.profiles.current(), bank = BB.profiles.bankAgeFor(p.age), s = p.quiz;
        var h = '<div class="qz-profile panel">' + BB.avatarHTML(p.avatar, 64) +
          '<div class="qz-pinfo"><div class="qz-pname">' + U.esc(p.name) + '</div><div class="help-text">Age ' + p.age + ' · playing <b>age-' + bank + '</b> questions</div>' +
          '<div class="qz-pstats">🎯 ' + (s.played || 0) + ' quizzes · ✅ ' + (s.correct || 0) + '/' + (s.answered || 0) + ' · ⭐ ' + (s.stars || 0) + ' · 🏅 ' + (s.achievements || []).length + '</div></div>' +
          '<div class="qz-pbtns"><button class="btn btn-small btn-ghost js-switch">👥 Switch</button><button class="btn btn-small btn-ghost js-edit">✏️ Edit</button></div></div>' +
          '<p class="qz-rule">ℹ️ ' + AGE_RULE + '</p>' +
          '<div class="panel qz-options"><div class="qz-opt"><span>Questions</span><div class="seg js-len">' +
          [5, 10, 20].map(function (n) { return '<button data-len="' + n + '" class="' + (opts.len === n ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div></div>' +
          '<div class="qz-opt"><span>Mode</span><div class="seg js-mode"><button data-timed="0" class="' + (!opts.timed ? 'on' : '') + '">🌱 Practice (no timer)</button><button data-timed="1" class="' + (opts.timed ? 'on' : '') + '">⚡ Timed challenge</button></div></div></div>' +
          '<div class="qz-cats">';
        Q.CATEGORIES.forEach(function (c) {
          var best = s.best && s.best[c.id];
          h += '<button class="qz-cat" data-cat="' + c.id + '" style="--qc:' + c.color + '"><span class="qz-cat-icon">' + c.icon + '</span><span class="qz-cat-name">' + c.name + '</span>' +
            '<span class="qz-cat-best">' + (best != null ? 'Best ' + best + '%' : 'Not played yet') + '</span></button>';
        });
        h += '</div><div class="qz-bottom"><button class="btn btn-purple js-ach">🏅 Achievements</button><button class="btn btn-blue js-hist">📊 History</button></div>';
        root.innerHTML = h;
        root.querySelector('.js-switch').addEventListener('click', profileManager);
        root.querySelector('.js-edit').addEventListener('click', function () { profileForm(BB.profiles.current()); });
        Array.prototype.forEach.call(root.querySelectorAll('.js-len button'), function (b) {
          b.addEventListener('click', function () { opts.len = +b.dataset.len; BB.store.set('quiz:opts', opts); BB.audio.sfx('click'); renderMenu(); });
        });
        Array.prototype.forEach.call(root.querySelectorAll('.js-mode button'), function (b) {
          b.addEventListener('click', function () { opts.timed = b.dataset.timed === '1'; BB.store.set('quiz:opts', opts); BB.audio.sfx('click'); renderMenu(); });
        });
        Array.prototype.forEach.call(root.querySelectorAll('.qz-cat'), function (b) {
          b.addEventListener('click', function () { BB.audio.sfx('select'); start(b.dataset.cat); });
        });
        root.querySelector('.js-ach').addEventListener('click', showAchievements);
        root.querySelector('.js-hist').addEventListener('click', showHistory);
      }

      function start(cat) {
        var p = BB.profiles.current();
        var qs = Q.select(p, cat, opts.len);
        run = { profileId: p.id, cat: cat, timed: opts.timed, bank: BB.profiles.bankAgeFor(p.age), qs: qs, idx: 0, answers: [], points: 0, done: false, answered: false };
        saveRun(); renderQuestion();
      }
      function saveRun() { BB.store.set('quiz:run', run); }

      function renderQuestion() {
        stopTimer();
        var q = run.qs[run.idx], c = Q.catById[run.cat], n = run.qs.length;
        var media = q.svg ? '<div class="qz-pic qz-svg">' + q.svg + '</div>' : q.pic ? '<div class="qz-pic">' + U.esc(q.pic) + '</div>' : '';
        var h = '<div class="qz-play"><div class="qz-top"><button class="btn btn-small btn-ghost js-quit">✖ Quit</button>' +
          '<div class="qz-count">' + c.icon + ' Question ' + (run.idx + 1) + ' of ' + n + '</div><div class="qz-pts">⭐ ' + run.points + '</div></div>' +
          '<div class="progress"><i style="width:' + (run.idx / n * 100) + '%"></i></div>' +
          (run.timed ? '<div class="qz-timer"><i class="js-tbar"></i><span class="js-tleft">' + TIME_PER_Q + 's</span></div>' : '') +
          '<div class="qz-card panel">' + media + '<div class="qz-q">' + U.esc(q.q) + '</div><div class="qz-choices">';
        q.choices.forEach(function (ch, i) { h += '<button class="qz-choice" data-i="' + i + '"><span class="qz-letter">' + 'ABCD'[i] + '</span><span>' + U.esc(ch) + '</span></button>'; });
        h += '</div><div class="qz-feedback hidden"></div></div></div>';
        root.innerHTML = h;
        root.querySelector('.js-quit').addEventListener('click', function () {
          BB.ui.confirm('Quit this quiz?', 'Your answers so far will not be saved.', 'Quit').then(function (ok) { if (ok) { run = null; BB.store.remove('quiz:run'); render(); } });
        });
        Array.prototype.forEach.call(root.querySelectorAll('.qz-choice'), function (b) {
          b.addEventListener('click', function () { answer(+b.dataset.i); });
        });
        if (run.answered) showFeedback(run.answers[run.idx]);
        else if (run.timed) startTimer();
      }
      function startTimer() {
        var left = TIME_PER_Q, bar = root.querySelector('.js-tbar'), lbl = root.querySelector('.js-tleft');
        run.tLeft = left;
        bar.style.width = '100%';
        timer = setInterval(function () {
          left -= 0.25; run.tLeft = left;
          bar.style.width = Math.max(0, left / TIME_PER_Q * 100) + '%';
          bar.classList.toggle('low', left <= 5);
          lbl.textContent = Math.ceil(Math.max(0, left)) + 's';
          if (left <= 5 && left % 1 === 0 && left > 0) BB.audio.sfx('tick');
          if (left <= 0) { stopTimer(); answer(-1); }
        }, 250);
      }
      function stopTimer() { if (timer) clearInterval(timer); timer = null; }
      function answer(i) {
        if (run.answered) return;
        stopTimer();
        var q = run.qs[run.idx], ok = i === q.answer;
        var pts = Q.pointsFor(q, ok, run.timed ? Math.max(0, run.tLeft || 0) : 0);
        run.points += pts;
        var rec = { i: i, ok: ok, pts: pts };
        run.answers[run.idx] = rec; run.answered = true;
        saveRun();
        BB.audio.sfx(ok ? 'correct' : 'wrong');
        if (ok) { var b = root.querySelector('.qz-choice[data-i="' + i + '"]'); if (b) BB.fx.burstAt(b, '#06d6a0', 12); }
        showFeedback(rec);
      }
      function showFeedback(rec) {
        var q = run.qs[run.idx];
        Array.prototype.forEach.call(root.querySelectorAll('.qz-choice'), function (b) {
          var i = +b.dataset.i; b.disabled = true;
          if (i === q.answer) b.classList.add('correct'); else if (i === rec.i) b.classList.add('wrong'); else b.classList.add('dim');
        });
        var fb = root.querySelector('.qz-feedback');
        fb.classList.remove('hidden'); fb.classList.add(rec.ok ? 'ok' : 'bad');
        var last = run.idx === run.qs.length - 1;
        fb.innerHTML = '<div class="qz-verdict">' + (rec.ok ? '✅ Correct! +' + rec.pts : rec.i === -1 ? '⏰ Time\'s up!' : '❌ Not quite.') + '</div>' +
          (rec.ok ? '' : '<div>The answer is <b>' + U.esc(q.choices[q.answer]) + '</b>.</div>') +
          '<div class="qz-explain">💡 ' + U.esc(q.explain) + '</div>' +
          '<div class="btn-row"><button class="btn ' + (last ? 'btn-green' : 'btn-blue') + ' js-next">' + (last ? 'See results 🏁' : 'Next ▶') + '</button></div>';
        var nx = fb.querySelector('.js-next');
        nx.addEventListener('click', next);
        setTimeout(function () { try { nx.focus({ preventScroll: true }); fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {} }, 50);
      }
      function next() {
        BB.audio.sfx('click');
        if (run.idx < run.qs.length - 1) { run.idx++; run.answered = false; saveRun(); renderQuestion(); }
        else finish();
      }
      function finish() {
        var correct = run.answers.filter(function (a) { return a && a.ok; }).length;
        run.result = Q.record(run.profileId, {
          cat: run.cat, total: run.qs.length, correct: correct, points: run.points, timed: run.timed, bank: run.bank,
          ids: run.qs.map(function (q) { return q.id; })
        });
        run.correct = correct; run.done = true; saveRun();
        renderResults();
        if (run.result.stars >= 2) { BB.fx.confetti(run.result.stars === 3 ? 140 : 70); BB.audio.sfx('win'); } else BB.audio.sfx('chime');
      }
      function renderResults() {
        var r = run.result || { pct: 0, stars: 0, newAchievements: [] }, c = Q.catById[run.cat], n = run.qs.length;
        var h = '<div class="panel qz-results overlay-card"><div class="big-emoji">' + (r.pct === 100 ? '🏆' : r.pct >= 70 ? '🎉' : r.pct >= 50 ? '👍' : '🌱') + '</div>' +
          '<h2>' + c.icon + ' ' + c.name + '</h2>' +
          '<div class="stars">' + [1, 2, 3].map(function (i) { return '<span class="' + (i <= r.stars ? '' : 'off') + '">⭐</span>'; }).join('') + '</div>' +
          '<div class="final-score">' + r.pct + '%</div>' +
          '<div class="qz-res-grid"><div><b>' + run.correct + '</b><span>Correct</span></div><div><b>' + (n - run.correct) + '</b><span>Incorrect</span></div><div><b>' + run.points + '</b><span>Points</span></div><div><b>' + r.best + '%</b><span>Best</span></div></div>' +
          '<p>' + (r.pct === 100 ? 'Perfect! Every answer right!' : r.pct >= 70 ? 'Great job!' : r.pct >= 50 ? 'Good try! Practice makes you stronger.' : 'Keep practising, you are learning a lot!') +
          (r.improved ? ' 📈 New personal best!' : '') + '</p>';
        if (r.newAchievements && r.newAchievements.length) {
          h += '<div class="qz-new-ach"><b>New achievements!</b><div class="badge-list" style="justify-content:center">' +
            r.newAchievements.map(function (a) { var d = BB.quizAchievements[a]; return '<span class="trophy-pill">' + d.icon + ' ' + d.name + '</span>'; }).join('') + '</div></div>';
        }
        h += '<div class="btn-row"><button class="btn btn-green js-again">↻ Play Again</button><button class="btn btn-blue js-other">📚 Choose Another Category</button><button class="btn btn-ghost js-home">🏠 Home</button></div>' +
          '<details class="qz-review"><summary>Review answers</summary><ol>';
        run.qs.forEach(function (q, i) {
          var a = run.answers[i] || {};
          h += '<li class="' + (a.ok ? 'ok' : 'bad') + '">' + U.esc(q.q) + (q.pic ? ' ' + U.esc(q.pic) : '') + '<br><span>' + (a.ok ? '✅ ' : '❌ ') + U.esc(q.choices[q.answer]) + '</span></li>';
        });
        h += '</ol></details></div>';
        root.innerHTML = h;
        var cat = run.cat;
        root.querySelector('.js-again').addEventListener('click', function () { start(cat); });
        root.querySelector('.js-other').addEventListener('click', function () { run = null; BB.store.remove('quiz:run'); render(); });
        root.querySelector('.js-home').addEventListener('click', function () { run = null; BB.store.remove('quiz:run'); render(); BB.app.go('home'); });
      }

      function showAchievements() {
        var p = BB.profiles.current(), got = p.quiz.achievements || [];
        var h = '<div class="ach-grid">';
        Object.keys(BB.quizAchievements).forEach(function (id) {
          var a = BB.quizAchievements[id], on = got.indexOf(id) >= 0;
          h += '<div class="ach' + (on ? '' : ' locked') + '"><span class="ach-icon">' + a.icon + '</span><b>' + a.name + '</b><span class="help-text">' + a.desc + '</span></div>';
        });
        BB.ui.modal({ title: '🏅 ' + U.esc(p.name) + '\'s achievements (' + got.length + '/' + Object.keys(BB.quizAchievements).length + ')', html: h + '</div>' });
      }
      function showHistory() {
        var p = BB.profiles.current(), hs = (p.quiz.history || []).slice().reverse();
        var best = p.quiz.best || {};
        var h = '<h3>Personal bests</h3><div class="stat-list">';
        Q.CATEGORIES.forEach(function (c) { h += '<span>' + c.icon + ' ' + c.name + '</span><b>' + (best[c.id] != null ? best[c.id] + '%' : '–') + '</b>'; });
        h += '</div><h3 style="margin-top:12px">Recent quizzes</h3>';
        if (!hs.length) h += '<p class="help-text">No quizzes yet.</p>';
        else {
          // Improvement over time: compare the average of the latest 5 with the 5 before.
          var pcts = hs.map(function (x) { return x.pct; });
          if (pcts.length >= 6) {
            var avg = function (a) { return Math.round(a.reduce(function (s, v) { return s + v; }, 0) / a.length); };
            var now = avg(pcts.slice(0, 5)), before = avg(pcts.slice(5, 10));
            h += '<p class="notice">Last 5 quizzes average <b>' + now + '%</b> (before: ' + before + '%) ' + (now > before ? '📈 improving!' : now === before ? '➡️ steady' : '💪 keep going!') + '</p>';
          }
          h += '<div class="stat-list">';
          hs.slice(0, 30).forEach(function (x) {
            h += '<span>' + U.esc(x.catName) + (x.timed ? ' ⚡' : '') + ' <span class="help-text">' + new Date(x.at).toLocaleString() + ' · age-' + x.bank + ' questions</span></span><b>' + x.correct + '/' + x.total + ' · ' + x.pct + '%</b>';
          });
          h += '</div>';
        }
        BB.ui.modal({ title: '📊 ' + U.esc(p.name) + '\'s history', html: h });
      }

      BB.events.on('profile', function () {
        if (run && run.profileId !== BB.profiles.currentId()) run = null;
        if (BB.app.current === 'quiz') render(); else dirty = true;
      });
      var dirty = false;
      var saved = BB.store.get('quiz:run', null);
      if (saved && saved.profileId === BB.profiles.currentId() && saved.qs) run = saved;
      render();
      return {
        show: function () {
          if (dirty) { dirty = false; render(); }
          else if (run && !run.done && !run.answered && run.timed) renderQuestion(); // restart this question's timer
        },
        hide: function () { stopTimer(); if (run) saveRun(); },
        _debug: function () { return run; }
      };
    }
  });
})();

</script>
  <!-- Shell: navigation, home, settings -->
  <script>
/* BLOCK BLASTER — app shell: five-mode navigation, home screen, settings, offline setup. */
(function () {
  'use strict';
  var BB = window.BB, U = BB.util;
  var instances = {};
  var app = BB.app = { current: null };
  var MODE_INFO = {
    classic: { name: 'Classic Blaster', icon: '🧱', c1: '#ff4d6d', c2: '#ff8fa3', desc: 'Endless 10×10 block puzzle. Blast lines, chase 1 crore!' },
    adventure: { name: 'Adventure', icon: '🗺️', c1: '#ff9f1c', c2: '#ffbf69', desc: 'Trophy worlds, 100 levels each, diamond missions.' },
    minigames: { name: 'Mini Games', icon: '🎮', c1: '#2ec4b6', c2: '#5fe0d0', desc: 'Tic-Tac-Toe, puzzles, cube, window cleaning, trampoline.' },
    relax: { name: 'Relaxing Games', icon: '🌈', c1: '#8338ec', c2: '#b388ff', desc: 'Pop it, squishy dumpling, neon, slime, sand and more.' },
    quiz: { name: 'Quizzes', icon: '🧠', c1: '#3a86ff', c2: '#72a8ff', desc: 'Age-based quizzes in 8 categories with rewards.' }
  };

  /* ---------------- navigation ---------------- */
  app.go = function (mode) {
    if (mode !== 'home' && !BB.modes[mode]) mode = 'home';
    if (app.current === mode) return;
    var prev = app.current;
    if (prev && instances[prev] && instances[prev].hide) { try { instances[prev].hide(); } catch (e) { console.error(e); } }
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) { v.hidden = v.dataset.view !== mode; });
    app.current = mode;
    if (mode === 'home') renderHome();
    else {
      var el = document.getElementById('view-' + mode);
      if (!instances[mode]) {
        try { instances[mode] = BB.modes[mode].init(el) || {}; }
        catch (e) { console.error(e); el.innerHTML = '<div class="panel">Sorry, this mode failed to load.</div>'; instances[mode] = {}; }
      }
      if (instances[mode].show) { try { instances[mode].show(); } catch (e) { console.error(e); } }
    }
    Array.prototype.forEach.call(document.querySelectorAll('.mode-tab'), function (t) {
      var on = t.dataset.mode === mode;
      t.classList.toggle('active', on); t.setAttribute('aria-selected', on ? 'true' : 'false');
      if (on && t.scrollIntoView) t.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    });
    BB.audio.setTheme(mode === 'home' ? 'home' : (BB.modes[mode].music || mode));
    BB.store.set('lastMode', mode);
  };
  app.instance = function (mode) { return instances[mode]; };

  Array.prototype.forEach.call(document.querySelectorAll('.mode-tab'), function (t) {
    t.addEventListener('click', function () { BB.audio.sfx('click'); app.go(t.dataset.mode); });
  });
  document.querySelector('.js-home').addEventListener('click', function () { BB.audio.sfx('click'); app.go('home'); });
  document.querySelector('.js-settings').addEventListener('click', function () { BB.audio.sfx('click'); app.openSettings(); });
  document.querySelector('.js-profile').addEventListener('click', function () {
    BB.audio.sfx('click');
    if (BB.quizUI && BB.quizUI.profileManager) BB.quizUI.profileManager(); else app.go('quiz');
  });
  // Save everything when the page is hidden or closed (mobile apps are often killed in the background).
  function saveAll() { if (app.current && instances[app.current] && instances[app.current].hide) { try { instances[app.current].hide(); } catch (e) {} } }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) saveAll();
    else if (app.current && instances[app.current] && instances[app.current].show) instances[app.current].show();
  });
  window.addEventListener('pagehide', saveAll);

  /* ---------------- profile chip ---------------- */
  function renderChip() {
    var p = BB.profiles.current();
    var chip = document.querySelector('.js-profile');
    chip.innerHTML = p ? BB.avatarHTML(p.avatar) + '<span class="chip-name">' + U.esc(p.name) + '</span>'
      : '<span class="avatar" style="width:36px;height:36px;background:#fff;font-size:20px">👤</span><span class="chip-name">Player</span>';
  }
  BB.events.on('profile', function () { renderChip(); if (app.current === 'home') renderHome(); });

  /* ---------------- home screen ---------------- */
  function advSummary() { return BB.adventureSummary ? BB.adventureSummary() : { levels: 0, stars: 0, diamonds: 0, trophies: [] }; }
  function renderHome() {
    var el = document.getElementById('view-home');
    var p = BB.profiles.current();
    var best = BB.store.get('classic:best', 0);
    var adv = advSummary();
    var qs = p ? p.quiz : null;
    var html = '<div class="home-hero"><p>Pick any mode. Everything is unlocked and works offline.</p></div><div class="home-grid">';
    var stats = {
      classic: 'Best: ' + U.fmt(best),
      adventure: adv.levels + ' levels · ⭐ ' + adv.stars + ' · 💎 ' + U.fmt(adv.diamonds),
      minigames: (BB.minigames ? BB.minigames.games.length : 0) + ' games',
      relax: (BB.relax ? BB.relax.games.length : 0) + ' activities',
      quiz: p ? U.esc(p.name) + ': ' + (qs.played || 0) + ' quizzes' : 'Create your player'
    };
    Object.keys(MODE_INFO).forEach(function (k) {
      var m = MODE_INFO[k];
      html += '<button class="home-card" data-go="' + k + '" style="--c1:' + m.c1 + ';--c2:' + m.c2 + '"><span class="hc-icon">' + m.icon +
        '</span><span class="hc-name">' + m.name + '</span><span class="hc-desc">' + m.desc + '</span><span class="hc-stat">' + stats[k] + '</span></button>';
    });
    html += '</div><div class="home-row">';
    // player panel
    html += '<div class="panel"><h3>👤 Player</h3>';
    if (p) {
      html += '<div style="display:flex;gap:12px;align-items:center">' + BB.avatarHTML(p.avatar, 64) + '<div><div style="font-size:20px;font-weight:900">' + U.esc(p.name) +
        '</div><div class="help-text">Age ' + p.age + ' · quiz questions for age ' + BB.profiles.bankAgeFor(p.age) + '</div></div></div>' +
        '<div class="stat-list" style="margin-top:8px"><span>Quizzes played</span><b>' + (qs.played || 0) + '</b><span>Correct answers</span><b>' + (qs.correct || 0) + ' / ' + (qs.answered || 0) +
        '</b><span>Quiz points</span><b>' + U.fmt(qs.score || 0) + '</b><span>Stars</span><b>⭐ ' + (qs.stars || 0) + '</b></div>';
    } else html += '<p class="help-text">No player yet. Create a profile to save quiz results and achievements.</p>';
    html += '<div class="btn-row" style="justify-content:flex-start;margin-top:10px"><button class="btn btn-small btn-blue js-profiles">' + (p ? 'Switch / edit players' : 'Create player') + '</button></div></div>';
    // trophies panel
    var tro = BB.store.get('trophies', {});
    html += '<div class="panel"><h3>🏆 Trophies</h3><div class="trophy-shelf">';
    html += '<span class="trophy-pill' + (tro.classicCrore ? '' : ' locked') + '">🏆 Crore Champion</span>';
    (adv.trophies || []).forEach(function (t) { html += '<span class="trophy-pill' + (t.won ? '' : ' locked') + '">' + t.icon + ' ' + U.esc(t.name) + (t.won ? '' : ' (' + t.done + '/100)') + '</span>'; });
    if (p && qs.achievements && qs.achievements.length && BB.quizAchievements) {
      qs.achievements.forEach(function (a) { var d = BB.quizAchievements[a]; if (d) html += '<span class="trophy-pill">' + d.icon + ' ' + d.name + '</span>'; });
    }
    html += '</div></div>';
    // quiz results
    html += '<div class="panel"><h3>📊 Recent quiz results</h3>';
    if (p && qs.history && qs.history.length) {
      html += '<div class="stat-list">';
      qs.history.slice(-5).reverse().forEach(function (h) {
        html += '<span>' + U.esc(h.catName || h.cat) + ' <span class="help-text">' + new Date(h.at).toLocaleDateString() + '</span></span><b>' + h.correct + '/' + h.total + ' (' + h.pct + '%)</b>';
      });
      html += '</div>';
    } else html += '<p class="help-text">Play a quiz to see results here.</p>';
    html += '</div>';
    // settings + offline
    html += '<div class="panel"><h3>⚙️ Settings & offline</h3><p class="js-offline help-text">' + offlineText() + '</p>' +
      '<div class="btn-row" style="justify-content:flex-start"><button class="btn btn-small btn-purple js-open-settings">Settings</button><button class="btn btn-small btn-ghost js-open-help">Help</button></div></div>';
    html += '</div>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('[data-go]'), function (b) {
      b.addEventListener('click', function () { BB.audio.sfx('select'); app.go(b.dataset.go); });
    });
    el.querySelector('.js-profiles').addEventListener('click', function () {
      if (BB.quizUI && BB.quizUI.profileManager) BB.quizUI.profileManager(); else app.go('quiz');
    });
    el.querySelector('.js-open-settings').addEventListener('click', function () { app.openSettings(); });
    el.querySelector('.js-open-help').addEventListener('click', function () { app.openHelp(); });
  }
  BB.events.on('stats', function () { if (app.current === 'home') renderHome(); });

  /* ---------------- offline status ---------------- */
  var offlineState = 'single';
  function offlineText() {
    return {
      ready: '✅ Offline ready: this game is saved on this device and works with Wi-Fi and mobile data off.',
      pending: '⏳ Preparing offline mode… keep this page open with internet until it says ready.',
      file: '📁 Opened as a local file: the game runs, but offline installation needs it to be served once (see the guide) or packaged as an app.',
      unsupported: '⚠️ This browser cannot install the game for offline use. Try Chrome, Edge, Firefox or Safari.',
      app: '✅ Installed app: everything is bundled on this device.',
      single: '✅ Single-file version: the whole game is inside this one HTML file. Save it on your device and open it any time, even with Wi-Fi and mobile data off.'
    }[offlineState];
  }
  function setOffline(s) { offlineState = s; var e = document.querySelector('.js-offline'); if (e) e.textContent = offlineText(); }
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) offlineState = 'app';
  else if (offlineState === 'pending') {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (navigator.serviceWorker.controller && reg.active) setOffline('ready');
      navigator.serviceWorker.addEventListener('message', function (e) { if (e.data && e.data.type === 'bb-cached') setOffline('ready'); });
      navigator.serviceWorker.ready.then(function () {
        if (window.caches) caches.keys().then(function (keys) { if (keys.some(function (k) { return k.indexOf('block-blaster') === 0; })) setOffline('ready'); });
      });
    }).catch(function () { setOffline('unsupported'); });
  }
  app.offlineState = function () { return offlineState; };

  /* ---------------- settings ---------------- */
  app.openSettings = function () {
    var s = BB.settings.all();
    var html =
      '<div class="settings-grid">' +
      '<label class="switch-row"><input type="checkbox" data-k="musicOn"' + (s.musicOn ? ' checked' : '') + '> 🎵 Background music</label>' +
      '<div class="range-row"><span>Music volume</span><input type="range" min="0" max="1" step="0.05" data-k="musicVol" value="' + s.musicVol + '"></div>' +
      '<label class="switch-row"><input type="checkbox" data-k="sfxOn"' + (s.sfxOn ? ' checked' : '') + '> 🔊 Sound effects</label>' +
      '<div class="range-row"><span>Sound volume</span><input type="range" min="0" max="1" step="0.05" data-k="sfxVol" value="' + s.sfxVol + '"></div>' +
      '<label class="switch-row"><input type="checkbox" data-k="reducedMotion"' + (s.reducedMotion ? ' checked' : '') + '> 🐢 Reduced animation</label>' +
      '<label class="switch-row"><input type="checkbox" data-k="relaxSound"' + (s.relaxSound ? ' checked' : '') + '> 🌈 Relaxing games: sounds</label>' +
      '<label class="switch-row"><input type="checkbox" data-k="relaxAnim"' + (s.relaxAnim ? ' checked' : '') + '> 🌈 Relaxing games: animations</label>' +
      '<div class="btn-row" style="justify-content:flex-start"><button class="btn btn-small btn-blue js-s-profiles">👤 Player profiles</button><button class="btn btn-small btn-ghost js-s-help">❓ Instructions & help</button></div>' +
      '<p class="help-text">' + offlineText() + '</p>' +
      '<div class="notice">Reset deletes all players, scores, quiz history, Adventure progress and settings saved on this device.</div>' +
      '<div class="btn-row" style="justify-content:flex-start"><button class="btn btn-small btn-danger js-s-reset">🗑️ Reset saved game data</button></div>' +
      '<p class="help-text">Block Blaster v' + BB.version + ' · all data stays on this device.</p></div>';
    var m = BB.ui.modal({ title: '⚙️ Settings', html: html, buttons: [{ label: 'Done' }] });
    Array.prototype.forEach.call(m.body.querySelectorAll('input[data-k]'), function (inp) {
      inp.addEventListener(inp.type === 'range' ? 'input' : 'change', function () {
        BB.settings.set(inp.dataset.k, inp.type === 'range' ? parseFloat(inp.value) : inp.checked);
        if (inp.dataset.k === 'sfxVol' || inp.dataset.k === 'sfxOn') BB.audio.sfx('pop');
      });
    });
    m.body.querySelector('.js-s-profiles').addEventListener('click', function () { m.close(); if (BB.quizUI) BB.quizUI.profileManager(); });
    m.body.querySelector('.js-s-help').addEventListener('click', function () { m.close(); app.openHelp(); });
    m.body.querySelector('.js-s-reset').addEventListener('click', function () {
      BB.ui.confirm('Reset all data?', 'This permanently deletes every player profile, score, quiz history and all progress on this device. This cannot be undone.', 'Yes, delete').then(function (ok) {
        if (!ok) return;
        BB.ui.confirm('Are you sure?', 'Last check: delete everything?', 'Delete everything').then(function (ok2) {
          if (!ok2) return;
          BB.store.resetAll();
          location.reload();
        });
      });
    });
  };
  app.openHelp = function () {
    BB.ui.modal({
      title: '❓ How to play',
      html: '<p><b>Five modes</b> are always available in the bar at the top. Switch any time: your game is saved and waits for you.</p>' +
        '<p>🧱 <b>Classic Blaster</b>: drag blocks onto the 10×10 board (or tap a block, then tap the board). Fill rows or columns to blast them. Reach 1 crore points to win.</p>' +
        '<p>🗺️ <b>Adventure</b>: pick a trophy world and a level. Each level has a mission, like collecting diamonds. Diamonds count when the line holding them is blasted.</p>' +
        '<p>🎮 <b>Mini Games</b> and 🌈 <b>Relaxing Games</b>: tap a card to play. Each has Help, Restart and Back buttons.</p>' +
        '<p>🧠 <b>Quizzes</b>: create a player with name, age and avatar. Questions come from the bank for one year below the player\'s age (minimum age 4), so they feel friendly and fair.</p>' +
        '<p>🏠 goes to this home screen, ⚙️ opens settings (music, sounds, reduced animation, profiles, reset).</p>' +
        '<p><b>Offline:</b> ' + offlineText() + '</p>'
    });
  };

  /* ---------------- start ---------------- */
  renderChip();
  var last = BB.store.get('lastMode', 'home');
  app.go(BB.modes[last] || last === 'home' ? last : 'home');
})();

</script>
</body>
</html>
