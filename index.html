  { id: "eng-11-006", cat: "english", age: 11, diff: 2, q: "Change to reported speech: She said, \"I am tired.\"", choices: ["She said that I am tired.","She said that she was tired.","She says she is tired.","She said that she is being tired."], answer: 1, explain: "In reported speech, \"I am\" usually becomes \"she was\"." },
  { id: "eng-11-007", cat: "english", age: 11, diff: 2, q: "What does \"benevolent\" mean?", choices: ["Angry and rude","Kind and generous","Lazy and slow","Clever and tricky"], answer: 1, explain: "A benevolent person is kind and wants to help others." },
  { id: "eng-11-008", cat: "english", age: 11, diff: 2, q: "Choose the correct word: Each of the students ___ a book.", choices: ["have","having","are","has"], answer: 3, explain: "\"Each\" means every single one, so we use the singular \"has\"." },
  { id: "eng-11-009", cat: "english", age: 11, diff: 2, q: "What does the prefix \"pre-\" mean in \"preview\"?", choices: ["After","Against","Again","Before"], answer: 3, explain: "\"Pre-\" means before. A preview is a look before." },
  { id: "eng-11-010", cat: "english", age: 11, diff: 3, q: "Identify the figure of speech: \"The classroom was a zoo.\"", choices: ["Simile","Personification","Metaphor","Hyperbole"], answer: 2, explain: "It says the classroom IS a zoo without using \"like\" or \"as\", so it is a metaphor." },
  { id: "eng-11-011", cat: "english", age: 11, diff: 3, q: "What does the idiom \"once in a blue moon\" mean?", choices: ["Every night","Very rarely","At midnight","Very often"], answer: 1, explain: "\"Once in a blue moon\" means something happens very rarely." },
  { id: "eng-11-012", cat: "english", age: 11, diff: 3, q: "What is the plural of \"phenomenon\"?", choices: ["Phenomena","Phenomenons","Phenomenas","Phenomenes"], answer: 0, explain: "The plural of phenomenon is phenomena." },
  { id: "eng-11-013", cat: "english", age: 11, diff: 3, q: "Which sentence uses an apostrophe correctly?", choices: ["The girls bag's is red.","The girl's bag is red.","The girl's bag's is red.","The girls' bag's is red."], answer: 1, explain: "\"Girl's\" shows the bag belongs to the girl." },
  { id: "eng-12-001", cat: "english", age: 12, diff: 1, q: "What is a synonym for \"meticulous\"?", choices: ["Careless","Hasty","Lazy","Careful"], answer: 3, explain: "Meticulous means paying great attention to detail, or very careful." },
  { id: "eng-12-002", cat: "english", age: 12, diff: 1, q: "What is the antonym of \"scarce\"?", choices: ["Rare","Little","Plentiful","Limited"], answer: 2, explain: "Scarce means there is not much. The opposite is plentiful." },
  { id: "eng-12-003", cat: "english", age: 12, diff: 1, q: "Which word is spelled correctly?", choices: ["Concience","Conscience","Consciense","Conshience"], answer: 1, explain: "\"Conscience\" is spelled C-O-N-S-C-I-E-N-C-E." },
  { id: "eng-12-004", cat: "english", age: 12, diff: 2, q: "Identify the figure of speech: \"The wind whispered through the trees.\"", choices: ["Simile","Hyperbole","Alliteration","Personification"], answer: 3, explain: "Giving human actions, like whispering, to the wind is personification." },
  { id: "eng-12-005", cat: "english", age: 12, diff: 2, q: "What is \"Peter Piper picked a peck of pickled peppers\" an example of?", choices: ["Metaphor","Simile","Alliteration","Irony"], answer: 2, explain: "Alliteration repeats the same starting sound in nearby words." },
  { id: "eng-12-006", cat: "english", age: 12, diff: 2, q: "Change to passive voice: \"The chef is cooking the meal.\"", choices: ["The meal was cooked by the chef.","The meal is cooked by the chef.","The chef is cooked by the meal.","The meal is being cooked by the chef."], answer: 3, explain: "Present continuous passive uses \"is being\" + past participle." },
  { id: "eng-12-007", cat: "english", age: 12, diff: 2, q: "Which word is a synonym for \"obsolete\"?", choices: ["Modern","Outdated","Popular","Necessary"], answer: 1, explain: "Obsolete means no longer used, or outdated." },
  { id: "eng-12-008", cat: "english", age: 12, diff: 2, q: "What does \"ambiguous\" mean?", choices: ["Very clear","Having more than one meaning","Very loud","Full of energy"], answer: 1, explain: "Something ambiguous can be understood in more than one way." },
  { id: "eng-12-009", cat: "english", age: 12, diff: 2, q: "Choose the correct word: The medicine had a good ___ on her health.", choices: ["effect","affect","effort","affair"], answer: 0, explain: "\"Effect\" is a noun meaning a result. \"Affect\" is usually a verb." },
  { id: "eng-12-010", cat: "english", age: 12, diff: 3, q: "Identify the clause type in: \"I will come if it stops raining.\" What is \"if it stops raining\"?", choices: ["Subordinate clause","Main clause","Noun phrase","Prepositional phrase"], answer: 0, explain: "\"If it stops raining\" cannot stand alone, so it is a subordinate clause." },
  { id: "eng-12-011", cat: "english", age: 12, diff: 3, q: "What does the idiom \"to burn the midnight oil\" mean?", choices: ["To waste fuel","To work or study late at night","To cook dinner late","To start a fire"], answer: 1, explain: "It means staying up late working or studying." },
  { id: "eng-12-012", cat: "english", age: 12, diff: 3, q: "Which is an example of an oxymoron?", choices: ["Bright sunshine","Cold ice","Tall tower","Deafening silence"], answer: 3, explain: "An oxymoron puts together two words with opposite meanings, like \"deafening\" and \"silence\"." },
  { id: "eng-12-013", cat: "english", age: 12, diff: 3, q: "What is the root word of \"unbelievable\"?", choices: ["Unbelief","Believe","Able","Lie"], answer: 1, explain: "Take away the prefix \"un-\" and the suffix \"-able\" to find the root: believe." },
  { id: "sci-04-001", cat: "science", age: 4, diff: 1, q: "What do we see with?", pic: "👀", choices: ["Eyes","Ears","Nose","Feet"], answer: 0, explain: "We see with our eyes." },
  { id: "sci-04-002", cat: "science", age: 4, diff: 1, q: "What do we hear with?", pic: "👂", choices: ["Ears","Eyes","Hands","Mouth"], answer: 0, explain: "We hear sounds with our ears." },
  { id: "sci-04-003", cat: "science", age: 4, diff: 1, q: "What do we smell with?", pic: "👃", choices: ["Knees","Elbows","Nose","Hair"], answer: 2, explain: "We smell with our nose." },
  { id: "sci-04-004", cat: "science", age: 4, diff: 1, q: "What falls from clouds?", pic: "🌧️", choices: ["Toys","Shoes","Books","Rain"], answer: 3, explain: "Rain falls from clouds." },
  { id: "sci-04-005", cat: "science", age: 4, diff: 2, q: "When do we see the Sun?", choices: ["Night","Never","Only in dreams","Day"], answer: 3, explain: "The Sun shines in the sky during the day." },
  { id: "sci-04-006", cat: "science", age: 4, diff: 2, q: "What does a plant grow from?", pic: "🌱", choices: ["Stone","Shoe","Spoon","Seed"], answer: 3, explain: "A plant grows from a seed." },
  { id: "sci-04-007", cat: "science", age: 4, diff: 2, q: "How does snow feel?", pic: "❄️", choices: ["Cold","Hot","Sticky","Spicy"], answer: 0, explain: "Snow is cold and white." },
  { id: "sci-04-008", cat: "science", age: 4, diff: 2, q: "Which one is alive?", choices: ["Rock","Chair","Ball","Puppy"], answer: 3, explain: "A puppy is alive. It eats, grows and breathes." },
  { id: "sci-04-009", cat: "science", age: 4, diff: 2, q: "What do we taste with?", choices: ["Tongue","Toes","Ears","Knees"], answer: 0, explain: "We taste food with our tongue." },
  { id: "sci-04-010", cat: "science", age: 4, diff: 3, q: "Which animal lives in water?", choices: ["Fish","Cat","Cow","Lion"], answer: 0, explain: "A fish lives in water." },
  { id: "sci-04-011", cat: "science", age: 4, diff: 3, q: "What melts in the hot sun?", pic: "🧊", choices: ["Rock","Ice","Wood","Sand"], answer: 1, explain: "Ice melts into water when it gets warm." },
  { id: "sci-04-012", cat: "science", age: 4, diff: 3, q: "What do we use our legs for?", choices: ["Walking","Eating","Seeing","Hearing"], answer: 0, explain: "We use our legs to walk, run and jump." },
  { id: "sci-04-013", cat: "science", age: 4, diff: 3, q: "Which one shines at night?", pic: "✨", choices: ["Sun","Rainbow","Clouds","Stars"], answer: 3, explain: "Stars shine in the night sky." },
  { id: "sci-05-001", cat: "science", age: 5, diff: 1, q: "What colour are most leaves?", pic: "🍃", choices: ["Blue","Purple","Green","Black"], answer: 2, explain: "Most leaves are green." },
  { id: "sci-05-002", cat: "science", age: 5, diff: 1, q: "What do we need to breathe?", choices: ["Sand","Air","Milk","Paper"], answer: 1, explain: "We breathe in air to live." },
  { id: "sci-05-003", cat: "science", age: 5, diff: 1, q: "Which body part pumps blood?", pic: "❤️", choices: ["Nose","Hair","Heart","Ear"], answer: 2, explain: "Your heart pumps blood all around your body." },
  { id: "sci-05-004", cat: "science", age: 5, diff: 2, q: "What does a seed need to grow?", choices: ["Juice","Milk","Oil","Water"], answer: 3, explain: "A seed needs water, air and warmth to sprout." },
  { id: "sci-05-005", cat: "science", age: 5, diff: 2, q: "Where does a chick come from?", pic: "🐣", choices: ["Egg","Seed","Flower","Cloud"], answer: 0, explain: "A chick hatches from an egg." },
  { id: "sci-05-006", cat: "science", age: 5, diff: 2, q: "What do we see in the sky after rain when the Sun shines?", choices: ["Rainbow","Snowman","Moon only","Volcano"], answer: 0, explain: "Sunlight shining through raindrops makes a rainbow." },
  { id: "sci-05-007", cat: "science", age: 5, diff: 2, q: "Which animal has feathers?", choices: ["Parrot","Dog","Fish","Cow"], answer: 0, explain: "Birds like parrots have feathers." },
  { id: "sci-05-008", cat: "science", age: 5, diff: 2, q: "What helps a fish swim?", choices: ["Legs","Fins","Wings","Hands"], answer: 1, explain: "Fish use their fins and tail to swim." },
  { id: "sci-05-009", cat: "science", age: 5, diff: 2, q: "Which one floats on water?", choices: ["Stone","Coin","Key","Leaf"], answer: 3, explain: "A leaf is light, so it floats." },
  { id: "sci-05-010", cat: "science", age: 5, diff: 3, q: "What do we call water that falls as tiny ice flakes?", choices: ["Hail","Fog","Dew","Snow"], answer: 3, explain: "Snow is made of tiny ice flakes." },
  { id: "sci-05-011", cat: "science", age: 5, diff: 3, q: "What gives us light in the day?", choices: ["Sun","Moon","Lamp","Candle"], answer: 0, explain: "The Sun gives us light and warmth in the day." },
  { id: "sci-05-012", cat: "science", age: 5, diff: 3, q: "Which part of your body helps you think?", choices: ["Stomach","Feet","Brain","Elbow"], answer: 2, explain: "Your brain helps you think, learn and remember." },
  { id: "sci-05-013", cat: "science", age: 5, diff: 3, q: "How does a snake move?", choices: ["Flies","Slithers","Hops on legs","Swims only"], answer: 1, explain: "A snake has no legs. It slithers on the ground." },
  { id: "sci-06-001", cat: "science", age: 6, diff: 1, q: "Which part of a plant is usually under the ground?", choices: ["Flowers","Leaves","Roots","Fruit"], answer: 2, explain: "Roots grow under the ground and hold the plant in place." },
  { id: "sci-06-002", cat: "science", age: 6, diff: 1, q: "How many legs does an insect have?", choices: ["4","6","8","10"], answer: 1, explain: "All insects have 6 legs." },
  { id: "sci-06-003", cat: "science", age: 6, diff: 1, q: "What do we call the hard covering of a turtle?", choices: ["Shell","Fur","Feathers","Scales"], answer: 0, explain: "A turtle has a hard shell to protect it." },
  { id: "sci-06-004", cat: "science", age: 6, diff: 2, q: "What is the young one of a butterfly called?", choices: ["Tadpole","Cub","Caterpillar","Kitten"], answer: 2, explain: "A butterfly starts life as a caterpillar." },
  { id: "sci-06-005", cat: "science", age: 6, diff: 2, q: "Which sense uses your skin?", choices: ["Taste","Touch","Sight","Smell"], answer: 1, explain: "Your skin helps you feel touch, heat and cold." },
  { id: "sci-06-006", cat: "science", age: 6, diff: 2, q: "What do bees collect from flowers?", choices: ["Leaves","Seeds","Bark","Nectar"], answer: 3, explain: "Bees collect sweet nectar from flowers to make honey." },
  { id: "sci-06-007", cat: "science", age: 6, diff: 2, q: "Water turns into ice when it is...?", choices: ["Very hot","Very cold","Windy","Sunny"], answer: 1, explain: "Water freezes into ice when it gets very cold." },
  { id: "sci-06-008", cat: "science", age: 6, diff: 2, q: "What makes our bones strong?", choices: ["Sweets","Chips","Milk","Soft drinks"], answer: 2, explain: "Milk has calcium, which helps make our bones strong." },
  { id: "sci-06-009", cat: "science", age: 6, diff: 2, q: "Which of these is a living thing?", choices: ["Car","Tree","Pencil","Cloud"], answer: 1, explain: "A tree is a living thing. It grows and needs water." },
  { id: "sci-06-010", cat: "science", age: 6, diff: 3, q: "Why do we wear warm clothes in winter?", choices: ["To get wet","To keep warm","To feel hot sun","To swim"], answer: 1, explain: "Warm clothes keep the heat in our bodies when it is cold." },
  { id: "sci-06-011", cat: "science", age: 6, diff: 3, q: "What do we call animals that have fur and feed milk to their babies?", choices: ["Mammals","Birds","Insects","Fish"], answer: 0, explain: "Mammals have fur or hair and feed their babies milk." },
  { id: "sci-06-012", cat: "science", age: 6, diff: 3, q: "What does a magnet pull?", choices: ["Paper","Wood","Plastic toys","Iron nails"], answer: 3, explain: "Magnets pull things made of iron, like nails." },
  { id: "sci-06-013", cat: "science", age: 6, diff: 3, q: "Which star is closest to Earth?", choices: ["The North Star","The Moon","The Sun","Mars"], answer: 2, explain: "The Sun is a star, and it is the closest one to Earth." },
  { id: "sci-07-001", cat: "science", age: 7, diff: 1, q: "What do plants make their food with?", choices: ["Moonlight","Music","Sunlight","Soil only"], answer: 2, explain: "Plants use sunlight, water and air to make their own food." },
  { id: "sci-07-002", cat: "science", age: 7, diff: 1, q: "Which planet do we live on?", pic: "🌍", choices: ["Mars","Jupiter","Venus","Earth"], answer: 3, explain: "We live on planet Earth." },
  { id: "sci-07-003", cat: "science", age: 7, diff: 1, q: "What do lungs help us do?", choices: ["See","Breathe","Hear","Walk"], answer: 1, explain: "Our lungs help us breathe in air." },
  { id: "sci-07-004", cat: "science", age: 7, diff: 2, q: "What are the three states of water?", choices: ["Rain, snow, wind","Hot, cold, warm","Sea, river, lake","Ice, water, steam"], answer: 3, explain: "Water can be solid (ice), liquid (water) or gas (steam)." },
  { id: "sci-07-005", cat: "science", age: 7, diff: 2, q: "What do we call an animal that hunts other animals for food?", choices: ["Prey","Herbivore","Predator","Pet"], answer: 2, explain: "A predator hunts other animals for food, like a lion or an eagle." },
  { id: "sci-07-006", cat: "science", age: 7, diff: 2, q: "Which part of the plant makes seeds?", choices: ["Root","Stem","Flower","Leaf"], answer: 2, explain: "Flowers make seeds, often inside fruits." },
  { id: "sci-07-007", cat: "science", age: 7, diff: 2, q: "Where does a frog lay its eggs?", choices: ["In water","In a nest in a tree","Under the sand in a desert","Inside a hive"], answer: 0, explain: "Frogs lay their eggs in water, such as ponds." },
  { id: "sci-07-008", cat: "science", age: 7, diff: 2, q: "What does the Moon do around the Earth?", choices: ["Stays still","Melts","Goes around it","Shines its own light"], answer: 2, explain: "The Moon travels around the Earth about once a month." },
  { id: "sci-07-009", cat: "science", age: 7, diff: 3, q: "What is the largest organ of the human body?", choices: ["Skin","Heart","Brain","Liver"], answer: 0, explain: "Your skin covers your whole body, making it the largest organ." },
  { id: "sci-07-010", cat: "science", age: 7, diff: 3, q: "Which material lets light pass through it?", choices: ["Wood","Brick","Clear glass","Metal"], answer: 2, explain: "Clear glass is transparent, so light passes through it." },
  { id: "sci-07-011", cat: "science", age: 7, diff: 3, q: "What causes day and night?", choices: ["The Moon moving","Clouds","The Sun switching off","Earth spinning"], answer: 3, explain: "Earth spins around. The side facing the Sun has day, the other side has night." },
  { id: "sci-07-012", cat: "science", age: 7, diff: 3, q: "Which animal is a reptile?", choices: ["Crocodile","Frog","Whale","Penguin"], answer: 0, explain: "Crocodiles are reptiles. They have scaly skin and lay eggs." },
  { id: "sci-07-013", cat: "science", age: 7, diff: 3, q: "What are baby teeth also called?", choices: ["Wisdom teeth","Fangs","Milk teeth","Tusks"], answer: 2, explain: "Our first teeth are called milk teeth. They fall out and grown-up teeth replace them." },
  { id: "sci-08-001", cat: "science", age: 8, diff: 1, q: "Which planet is called the Red Planet?", choices: ["Mars","Venus","Saturn","Mercury"], answer: 0, explain: "Mars looks red because of rusty dust on its surface." },
  { id: "sci-08-002", cat: "science", age: 8, diff: 1, q: "What gas do plants take in from the air to make food?", choices: ["Oxygen","Carbon dioxide","Helium","Nitrogen"], answer: 1, explain: "Plants take in carbon dioxide and give out oxygen." },
  { id: "sci-08-003", cat: "science", age: 8, diff: 1, q: "Which organ do we use to digest food?", choices: ["Lungs","Stomach","Brain","Heart"], answer: 1, explain: "The stomach breaks down food we eat." },
  { id: "sci-08-004", cat: "science", age: 8, diff: 2, q: "What do we call the process in which water turns into vapour?", choices: ["Evaporation","Freezing","Melting","Condensation"], answer: 0, explain: "When water is heated, it evaporates and becomes water vapour." },
  { id: "sci-08-005", cat: "science", age: 8, diff: 2, q: "Which planet has beautiful rings around it?", choices: ["Mars","Saturn","Mercury","Earth"], answer: 1, explain: "Saturn has bright rings made of ice and rock." },
  { id: "sci-08-006", cat: "science", age: 8, diff: 2, q: "Which of these is a source of light?", choices: ["Mirror","Candle flame","Moon rock","Window"], answer: 1, explain: "A burning candle makes its own light." },
  { id: "sci-08-007", cat: "science", age: 8, diff: 2, q: "How many planets are in our solar system?", choices: ["9","8","7","10"], answer: 1, explain: "There are 8 planets in our solar system." },
  { id: "sci-08-008", cat: "science", age: 8, diff: 2, q: "Which part of the plant makes food?", choices: ["Roots","Stem","Seeds","Leaves"], answer: 3, explain: "Leaves use sunlight to make food for the plant." },
  { id: "sci-08-009", cat: "science", age: 8, diff: 2, q: "What do we call animals that are active at night?", choices: ["Nocturnal","Herbivores","Amphibians","Migrants"], answer: 0, explain: "Nocturnal animals, like owls and bats, are active at night." },
  { id: "sci-08-010", cat: "science", age: 8, diff: 3, q: "Which animal is an amphibian?", choices: ["Lizard","Snake","Turtle","Frog"], answer: 3, explain: "Frogs are amphibians. They live part of their lives in water and part on land." },
  { id: "sci-08-011", cat: "science", age: 8, diff: 3, q: "What is the force that pulls things down to the ground?", choices: ["Gravity","Magnetism","Friction","Wind"], answer: 0, explain: "Gravity pulls everything towards the Earth." },
  { id: "sci-08-012", cat: "science", age: 8, diff: 3, q: "What protects the brain?", choices: ["Ribs","Skull","Spine","Knee cap"], answer: 1, explain: "The skull is a hard bone that protects the brain." },
  { id: "sci-08-013", cat: "science", age: 8, diff: 3, q: "What do we call the path a planet takes around the Sun?", choices: ["Axis","Comet","Galaxy","Orbit"], answer: 3, explain: "A planet moves around the Sun in a path called an orbit." },
  { id: "sci-09-001", cat: "science", age: 9, diff: 1, q: "Which vitamin do we get from sunlight?", choices: ["Vitamin C","Vitamin A","Vitamin K","Vitamin D"], answer: 3, explain: "Our skin makes vitamin D when sunlight falls on it." },
  { id: "sci-09-002", cat: "science", age: 9, diff: 1, q: "What is the boiling point of water at sea level?", choices: ["50 °C","100 °C","0 °C","212 °C"], answer: 1, explain: "At sea level, water boils at 100 degrees Celsius." },
  { id: "sci-09-003", cat: "science", age: 9, diff: 1, q: "How many chambers does the human heart have?", choices: ["2","3","4","6"], answer: 2, explain: "The human heart has 4 chambers." },
  { id: "sci-09-004", cat: "science", age: 9, diff: 2, q: "What is the green pigment in leaves called?", choices: ["Chlorophyll","Chloride","Carotene","Melanin"], answer: 0, explain: "Chlorophyll is the green pigment that helps plants trap sunlight." },
  { id: "sci-09-005", cat: "science", age: 9, diff: 2, q: "Which blood cells help fight germs?", choices: ["White blood cells","Red blood cells","Platelets","Plasma"], answer: 0, explain: "White blood cells fight germs that cause illness." },
  { id: "sci-09-006", cat: "science", age: 9, diff: 2, q: "Which planet is the hottest?", choices: ["Mercury","Venus","Mars","Jupiter"], answer: 1, explain: "Venus is the hottest planet because its thick clouds trap heat." },
  { id: "sci-09-007", cat: "science", age: 9, diff: 2, q: "What type of energy does a moving car have?", choices: ["Sound energy only","Nuclear energy","Kinetic energy","Chemical energy only"], answer: 2, explain: "Anything that moves has kinetic energy." },
  { id: "sci-09-008", cat: "science", age: 9, diff: 2, q: "What do we call animals without a backbone?", choices: ["Vertebrates","Mammals","Invertebrates","Reptiles"], answer: 2, explain: "Invertebrates, such as insects and worms, have no backbone." },
  { id: "sci-09-009", cat: "science", age: 9, diff: 2, q: "Water vapour cooling to form droplets is called...?", choices: ["Evaporation","Condensation","Melting","Boiling"], answer: 1, explain: "Condensation is when vapour cools and turns back into liquid." },
  { id: "sci-09-010", cat: "science", age: 9, diff: 3, q: "What carries blood from the heart to the body?", choices: ["Veins","Arteries","Nerves","Muscles"], answer: 1, explain: "Arteries carry blood away from the heart." },
  { id: "sci-09-011", cat: "science", age: 9, diff: 3, q: "Which simple machine is a seesaw an example of?", choices: ["Pulley","Wheel and axle","Screw","Lever"], answer: 3, explain: "A seesaw is a lever that turns on a pivot in the middle." },
  { id: "sci-09-012", cat: "science", age: 9, diff: 3, q: "What are the tiny holes on a leaf that let air in and out called?", choices: ["Roots","Petals","Stomata","Veins"], answer: 2, explain: "Stomata are tiny pores on leaves for gases to pass through." },
  { id: "sci-09-013", cat: "science", age: 9, diff: 3, q: "What do we call a scientist who studies plants?", choices: ["Zoologist","Botanist","Geologist","Astronomer"], answer: 1, explain: "A botanist studies plants." },
  { id: "sci-10-001", cat: "science", age: 10, diff: 1, q: "What is the centre of an atom called?", choices: ["Electron","Nucleus","Shell","Cell wall"], answer: 1, explain: "The nucleus is the centre of an atom." },
  { id: "sci-10-002", cat: "science", age: 10, diff: 1, q: "Which part of the eye controls how much light enters?", choices: ["Lens","Iris","Retina","Eyelash"], answer: 1, explain: "The iris (coloured part) controls the size of the pupil." },
  { id: "sci-10-003", cat: "science", age: 10, diff: 1, q: "Which gas makes up most of Earth's air?", choices: ["Oxygen","Carbon dioxide","Hydrogen","Nitrogen"], answer: 3, explain: "About 78% of the air is nitrogen." },
  { id: "sci-10-004", cat: "science", age: 10, diff: 2, q: "What is the chemical formula for water?", choices: ["CO2","H2O","O2","NaCl"], answer: 1, explain: "Water is made of two hydrogen atoms and one oxygen atom: H2O." },
  { id: "sci-10-005", cat: "science", age: 10, diff: 2, q: "What is the natural satellite of the Earth?", choices: ["The Moon","The Sun","Mars","The ISS"], answer: 0, explain: "The Moon is Earth's natural satellite." },
  { id: "sci-10-006", cat: "science", age: 10, diff: 2, q: "What do we call a mixture of sand and water that can be separated by filtering?", choices: ["Solution","Suspension","Compound","Element"], answer: 1, explain: "Sand does not dissolve, so it forms a suspension that can be filtered." },
  { id: "sci-10-007", cat: "science", age: 10, diff: 2, q: "Which part of the plant carries water from roots to leaves?", choices: ["Flower","Seed","Stem","Petal"], answer: 2, explain: "The stem carries water up from the roots to the leaves." },
  { id: "sci-10-008", cat: "science", age: 10, diff: 2, q: "What is the main job of red blood cells?", choices: ["Carry oxygen","Fight germs","Digest food","Make bones"], answer: 0, explain: "Red blood cells carry oxygen around the body." },
  { id: "sci-10-009", cat: "science", age: 10, diff: 2, q: "What is the speed of sound compared to light?", choices: ["Much faster","Much slower","The same","Twice as fast"], answer: 1, explain: "Light travels far faster than sound. That is why we see lightning before hearing thunder." },
  { id: "sci-10-010", cat: "science", age: 10, diff: 3, q: "What kind of rock is formed from cooled lava?", choices: ["Sedimentary","Metamorphic","Igneous","Fossil"], answer: 2, explain: "Igneous rock forms when hot melted rock cools down." },
  { id: "sci-10-011", cat: "science", age: 10, diff: 3, q: "Which organ cleans the blood and makes urine?", choices: ["Kidneys","Lungs","Heart","Stomach"], answer: 0, explain: "The kidneys filter waste out of the blood." },
  { id: "sci-10-012", cat: "science", age: 10, diff: 3, q: "What is a food chain?", choices: ["A list of restaurants","The order in which living things eat each other","A chain made of food","Plants growing in a row"], answer: 1, explain: "A food chain shows who eats whom, starting with plants." },
  { id: "sci-10-013", cat: "science", age: 10, diff: 3, q: "What is the smallest unit of life?", choices: ["Atom","Organ","Tissue","Cell"], answer: 3, explain: "All living things are made of cells, the smallest unit of life." },
  { id: "sci-11-001", cat: "science", age: 11, diff: 1, q: "What is the chemical symbol for gold?", choices: ["Ag","Go","Au","Gd"], answer: 2, explain: "Gold's symbol is Au, from the Latin word \"aurum\"." },
  { id: "sci-11-002", cat: "science", age: 11, diff: 1, q: "Which force slows down a ball rolling on grass?", choices: ["Gravity only","Friction","Magnetism","Buoyancy"], answer: 1, explain: "Friction between the ball and the grass slows it down." },
  { id: "sci-11-003", cat: "science", age: 11, diff: 1, q: "Which planet has the most known moons?", choices: ["Earth","Mercury","Saturn","Mars"], answer: 2, explain: "Saturn has more than 100 known moons, more than any other planet." },
  { id: "sci-11-004", cat: "science", age: 11, diff: 2, q: "What is the pH of pure water?", choices: ["7","0","14","1"], answer: 0, explain: "Pure water is neutral, with a pH of 7." },
  { id: "sci-11-005", cat: "science", age: 11, diff: 2, q: "What part of the cell controls its activities?", choices: ["Nucleus","Cell membrane","Cytoplasm","Vacuole"], answer: 0, explain: "The nucleus is the control centre of the cell." },
  { id: "sci-11-006", cat: "science", age: 11, diff: 2, q: "Which type of lens is used to correct short-sightedness?", choices: ["Convex","Concave","Flat","Bifocal mirror"], answer: 1, explain: "A concave lens spreads light out, helping short-sighted people see far." },
  { id: "sci-11-007", cat: "science", age: 11, diff: 2, q: "What is the unit of electric current?", choices: ["Ampere","Volt","Watt","Ohm"], answer: 0, explain: "Electric current is measured in amperes (amps)." },
  { id: "sci-11-008", cat: "science", age: 11, diff: 2, q: "What do we call animals that eat dead plants and animals and break them down?", choices: ["Decomposers","Producers","Predators","Herbivores"], answer: 0, explain: "Decomposers, like fungi and bacteria, break down dead things." },
  { id: "sci-11-009", cat: "science", age: 11, diff: 2, q: "Which part of the brain controls balance?", choices: ["Cerebellum","Cerebrum","Spinal cord","Skull"], answer: 0, explain: "The cerebellum helps keep your balance and coordination." },
  { id: "sci-11-010", cat: "science", age: 11, diff: 3, q: "What is the process by which plants lose water through their leaves?", choices: ["Respiration","Germination","Pollination","Transpiration"], answer: 3, explain: "Plants lose water vapour through their leaves by transpiration." },
  { id: "sci-11-011", cat: "science", age: 11, diff: 3, q: "Which metal is liquid at room temperature?", choices: ["Iron","Mercury","Copper","Aluminium"], answer: 1, explain: "Mercury is a metal that is liquid at room temperature." },
  { id: "sci-11-012", cat: "science", age: 11, diff: 3, q: "What causes the phases of the Moon?", choices: ["Earth's shadow every night","Clouds covering the Moon","How much of its sunlit side we see","The Moon changing size"], answer: 2, explain: "As the Moon orbits Earth, we see different amounts of its sunlit half." },
  { id: "sci-11-013", cat: "science", age: 11, diff: 3, q: "Which vitamin deficiency causes scurvy?", choices: ["Vitamin D","Vitamin B12","Vitamin A","Vitamin C"], answer: 3, explain: "Scurvy is caused by a lack of vitamin C, found in citrus fruits." },
  { id: "sci-12-001", cat: "science", age: 12, diff: 1, q: "What is the SI unit of force?", choices: ["Newton","Joule","Pascal","Watt"], answer: 0, explain: "Force is measured in newtons, named after Isaac Newton." },
  { id: "sci-12-002", cat: "science", age: 12, diff: 1, q: "Which organelle is called the powerhouse of the cell?", choices: ["Ribosome","Mitochondria","Nucleus","Chloroplast"], answer: 1, explain: "Mitochondria release energy from food for the cell." },
  { id: "sci-12-003", cat: "science", age: 12, diff: 1, q: "What is the chemical symbol for sodium?", choices: ["Na","So","Sd","S"], answer: 0, explain: "Sodium's symbol is Na, from its Latin name \"natrium\"." },
  { id: "sci-12-004", cat: "science", age: 12, diff: 2, q: "What is the formula for speed?", choices: ["Time ÷ distance","Distance x time","Mass x time","Distance ÷ time"], answer: 3, explain: "Speed = distance divided by time." },
  { id: "sci-12-005", cat: "science", age: 12, diff: 2, q: "What type of bond holds the atoms in a water molecule together?", choices: ["Ionic bond","Covalent bond","Metallic bond","Magnetic bond"], answer: 1, explain: "In water, hydrogen and oxygen share electrons, forming covalent bonds." },
  { id: "sci-12-006", cat: "science", age: 12, diff: 2, q: "Which gas is produced when an acid reacts with a metal like zinc?", choices: ["Oxygen","Nitrogen","Chlorine","Hydrogen"], answer: 3, explain: "Acids react with metals such as zinc to give a salt and hydrogen gas." },
  { id: "sci-12-007", cat: "science", age: 12, diff: 2, q: "Which law says every action has an equal and opposite reaction?", choices: ["Newton's first law","Ohm's law","Law of gravity","Newton's third law"], answer: 3, explain: "Newton's third law: for every action there is an equal and opposite reaction." },
  { id: "sci-12-008", cat: "science", age: 12, diff: 2, q: "What is the main function of the xylem in plants?", choices: ["Carry water and minerals","Carry food","Make seeds","Absorb sunlight"], answer: 0, explain: "Xylem tubes carry water and minerals up from the roots." },
  { id: "sci-12-009", cat: "science", age: 12, diff: 2, q: "What is the approximate speed of light?", choices: ["300 km per second","3,000 km per hour","300,000 km per second","30 km per second"], answer: 2, explain: "Light travels about 300,000 km every second." },
  { id: "sci-12-010", cat: "science", age: 12, diff: 3, q: "In genetics, which molecule carries hereditary information?", choices: ["ATP","DNA","Glucose","Haemoglobin"], answer: 1, explain: "DNA carries the genetic instructions passed from parents to children." },
  { id: "sci-12-011", cat: "science", age: 12, diff: 3, q: "Which phenomenon makes a straw look bent in a glass of water?", choices: ["Reflection","Refraction","Diffraction","Evaporation"], answer: 1, explain: "Light bends as it passes from water to air. This is called refraction." },
  { id: "sci-12-012", cat: "science", age: 12, diff: 3, q: "What is the atomic number of carbon?", choices: ["12","8","6","14"], answer: 2, explain: "Carbon has 6 protons, so its atomic number is 6." },
  { id: "sci-12-013", cat: "science", age: 12, diff: 3, q: "Which layer of the atmosphere contains the ozone layer?", choices: ["Troposphere","Mesosphere","Stratosphere","Exosphere"], answer: 2, explain: "The ozone layer lies in the stratosphere and protects us from harmful UV rays." },
  { id: "geo-04-001", cat: "geography", age: 4, diff: 1, q: "Where do fish swim?", pic: "🌊", choices: ["Sky","Desert","Sea","Road"], answer: 2, explain: "Fish swim in the sea." },
  { id: "geo-04-002", cat: "geography", age: 4, diff: 1, q: "What is very tall and made of rock and land?", pic: "⛰️", choices: ["Pond","Puddle","Mountain","Garden"], answer: 2, explain: "A mountain is very tall land with rock." },
  { id: "geo-04-003", cat: "geography", age: 4, diff: 1, q: "Which place is hot and full of sand?", pic: "🏜️", choices: ["Desert","Jungle","Snowy hill","River"], answer: 0, explain: "A desert is a hot, dry place full of sand." },
  { id: "geo-04-004", cat: "geography", age: 4, diff: 1, q: "Where do many trees grow close together?", pic: "🌳🌳🌳", choices: ["Beach","Desert","Forest","Road"], answer: 2, explain: "A forest has lots of trees growing together." },
  { id: "geo-04-005", cat: "geography", age: 4, diff: 2, q: "What is a big body of salty water?", choices: ["Sea","Pond","Tap","Bucket"], answer: 0, explain: "The sea is a very big body of salty water." },
  { id: "geo-04-006", cat: "geography", age: 4, diff: 2, q: "What is a small piece of land with water all around it?", pic: "🏝️", choices: ["Mountain","Desert","Road","Island"], answer: 3, explain: "An island has water all around it." },
  { id: "geo-04-007", cat: "geography", age: 4, diff: 2, q: "Where do we play in the sand by the sea?", pic: "🏖️", choices: ["Forest","Cave","Mountain top","Beach"], answer: 3, explain: "The beach is the sandy land next to the sea." },
  { id: "geo-04-008", cat: "geography", age: 4, diff: 2, q: "What flows from hills to the sea?", choices: ["Road","Train","Cloud","River"], answer: 3, explain: "A river is water that flows from hills down to the sea." },
  { id: "geo-04-009", cat: "geography", age: 4, diff: 2, q: "What is our planet called?", pic: "🌍", choices: ["Moon","Sun","Star","Earth"], answer: 3, explain: "We live on planet Earth." },
  { id: "geo-04-010", cat: "geography", age: 4, diff: 3, q: "Where is it very cold with lots of snow and ice?", choices: ["Desert","Beach","North Pole","Jungle"], answer: 2, explain: "The North Pole is very cold and icy." },
  { id: "geo-04-011", cat: "geography", age: 4, diff: 3, q: "What do we call a hole in a hill or rock that you can go inside?", choices: ["Lake","Tower","Cave","Bridge"], answer: 2, explain: "A cave is a hollow space inside rock." },
  { id: "geo-04-012", cat: "geography", age: 4, diff: 3, q: "Which one is a place with lots of tall buildings and people?", pic: "🏙️", choices: ["City","Forest","Desert","Ocean"], answer: 0, explain: "A city has many buildings, roads and people." },
  { id: "geo-04-013", cat: "geography", age: 4, diff: 3, q: "What do we call a hill that can throw out hot lava?", pic: "🌋", choices: ["Island","Valley","Volcano","Pond"], answer: 2, explain: "A volcano can erupt with hot melted rock called lava." },
  { id: "geo-05-001", cat: "geography", age: 5, diff: 1, q: "In which country is the Taj Mahal?", choices: ["India","China","Japan","Egypt"], answer: 0, explain: "The Taj Mahal is in Agra, India." },
  { id: "geo-05-002", cat: "geography", age: 5, diff: 1, q: "What do we call a big area of water with land all around it?", choices: ["River","Lake","Ocean","Rain"], answer: 1, explain: "A lake has land all around it." },
  { id: "geo-05-003", cat: "geography", age: 5, diff: 1, q: "What is the land with lots of trees and wild animals called?", choices: ["Jungle","Desert","Beach","City"], answer: 0, explain: "A jungle is a thick forest with many wild animals." },
  { id: "geo-05-004", cat: "geography", age: 5, diff: 2, q: "Which direction does the Sun rise from?", choices: ["West","East","North","South"], answer: 1, explain: "The Sun rises in the east every morning." },
  { id: "geo-05-005", cat: "geography", age: 5, diff: 2, q: "What do we call a picture of a place drawn from above?", choices: ["Photo","Map","Painting of a face","Letter"], answer: 1, explain: "A map shows a place as if you are looking down from above." },
  { id: "geo-05-006", cat: "geography", age: 5, diff: 2, q: "Which of these is the biggest?", choices: ["Village","Town","House","Country"], answer: 3, explain: "A country has many towns and villages in it." },
  { id: "geo-05-007", cat: "geography", age: 5, diff: 2, q: "Where do penguins mostly live?", pic: "🐧", choices: ["Sahara Desert","India","Antarctica","Amazon jungle"], answer: 2, explain: "Most penguins live in the cold south, around Antarctica." },
  { id: "geo-05-008", cat: "geography", age: 5, diff: 2, q: "What is the colour of water on most maps?", choices: ["Red","Black","Blue","Pink"], answer: 2, explain: "Maps usually show water in blue." },
  { id: "geo-05-009", cat: "geography", age: 5, diff: 2, q: "What do we call low land between hills or mountains?", choices: ["Valley","Peak","Cliff","Island"], answer: 0, explain: "A valley is low land between hills or mountains." },
  { id: "geo-05-010", cat: "geography", age: 5, diff: 3, q: "Which country's flag has a white background and a red circle?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"100\" fill=\"#ffffff\"/><circle cx=\"75\" cy=\"50\" r=\"30\" fill=\"#bc002d\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["India","France","Italy","Japan"], answer: 3, explain: "Japan's flag is white with a red circle in the middle." },
  { id: "geo-05-011", cat: "geography", age: 5, diff: 3, q: "What is a very big body of salty water like the Pacific called?", choices: ["Pond","Lake","Ocean","Stream"], answer: 2, explain: "Oceans are the biggest bodies of salty water on Earth." },
  { id: "geo-05-012", cat: "geography", age: 5, diff: 3, q: "What is the name of our country if we live in Mumbai?", choices: ["Nepal","India","Japan","Brazil"], answer: 1, explain: "Mumbai is a big city in India." },
  { id: "geo-05-013", cat: "geography", age: 5, diff: 3, q: "Where do camels usually live?", choices: ["Desert","Ice land","Ocean","Rainforest canopy"], answer: 0, explain: "Camels live in deserts. They can go a long time without water." },
  { id: "geo-06-001", cat: "geography", age: 6, diff: 1, q: "What is the capital of India?", choices: ["Mumbai","New Delhi","Kolkata","Chennai"], answer: 1, explain: "New Delhi is the capital of India." },
  { id: "geo-06-002", cat: "geography", age: 6, diff: 1, q: "How many continents are there?", choices: ["5","6","9","7"], answer: 3, explain: "There are 7 continents on Earth." },
  { id: "geo-06-003", cat: "geography", age: 6, diff: 1, q: "In which country are the pyramids of Giza?", choices: ["India","Australia","Egypt","Canada"], answer: 2, explain: "The famous pyramids of Giza are in Egypt." },
  { id: "geo-06-004", cat: "geography", age: 6, diff: 2, q: "Which is the coldest continent?", choices: ["Africa","Antarctica","Asia","Australia"], answer: 1, explain: "Antarctica is the coldest place on Earth and is covered in ice." },
  { id: "geo-06-005", cat: "geography", age: 6, diff: 2, q: "What is the opposite direction of north?", choices: ["East","South","West","Up"], answer: 1, explain: "North and south are opposite directions." },
  { id: "geo-06-006", cat: "geography", age: 6, diff: 2, q: "Which country is famous for kangaroos?", choices: ["India","Japan","Kenya","Australia"], answer: 3, explain: "Kangaroos live in the wild only in Australia." },
  { id: "geo-06-007", cat: "geography", age: 6, diff: 2, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"34\" fill=\"#ff9933\"/><rect x=\"0\" y=\"33\" width=\"150\" height=\"34\" fill=\"#ffffff\"/><rect x=\"0\" y=\"66\" width=\"150\" height=\"34\" fill=\"#138808\"/><circle cx=\"75\" cy=\"50\" r=\"13\" fill=\"none\" stroke=\"#000080\" stroke-width=\"2\"/><line x1=\"75\" y1=\"50\" x2=\"88.0\" y2=\"50.0\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"87.6\" y2=\"53.4\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"86.3\" y2=\"56.5\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"84.2\" y2=\"59.2\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"81.5\" y2=\"61.3\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"78.4\" y2=\"62.6\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"75.0\" y2=\"63.0\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"71.6\" y2=\"62.6\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"68.5\" y2=\"61.3\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"65.8\" y2=\"59.2\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"63.7\" y2=\"56.5\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"62.4\" y2=\"53.4\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"62.0\" y2=\"50.0\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"62.4\" y2=\"46.6\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"63.7\" y2=\"43.5\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"65.8\" y2=\"40.8\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"68.5\" y2=\"38.7\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"71.6\" y2=\"37.4\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"75.0\" y2=\"37.0\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"78.4\" y2=\"37.4\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"81.5\" y2=\"38.7\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"84.2\" y2=\"40.8\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"86.3\" y2=\"43.5\" stroke=\"#000080\" stroke-width=\"0.8\"/><line x1=\"75\" y1=\"50\" x2=\"87.6\" y2=\"46.6\" stroke=\"#000080\" stroke-width=\"0.8\"/><circle cx=\"75\" cy=\"50\" r=\"2.5\" fill=\"#000080\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["Japan","France","Italy","India"], answer: 3, explain: "India's flag has saffron, white and green stripes, with a blue wheel in the centre." },
  { id: "geo-06-008", cat: "geography", age: 6, diff: 2, q: "In which continent is India?", choices: ["Asia","Africa","Europe","South America"], answer: 0, explain: "India is in the continent of Asia." },
  { id: "geo-06-009", cat: "geography", age: 6, diff: 2, q: "Which big river flows through Varanasi?", choices: ["Ganga","Thames","Nile","Amazon"], answer: 0, explain: "The Ganga flows past the city of Varanasi." },
  { id: "geo-06-010", cat: "geography", age: 6, diff: 3, q: "Which is the largest ocean?", choices: ["Indian Ocean","Atlantic Ocean","Pacific Ocean","Arctic Ocean"], answer: 2, explain: "The Pacific is the largest ocean on Earth." },
  { id: "geo-06-011", cat: "geography", age: 6, diff: 3, q: "What do we call a model of the Earth shaped like a ball?", choices: ["Map","Atlas","Globe","Compass"], answer: 2, explain: "A globe is a round model of the Earth." },
  { id: "geo-06-012", cat: "geography", age: 6, diff: 3, q: "What is the highest mountain in the world?", choices: ["Mount Everest","Mount Fuji","Kilimanjaro","Mont Blanc"], answer: 0, explain: "Mount Everest, in the Himalayas, is the highest mountain on Earth." },
  { id: "geo-06-013", cat: "geography", age: 6, diff: 3, q: "In which country is the city of Paris?", choices: ["Spain","England","Egypt","France"], answer: 3, explain: "Paris is the capital of France." },
  { id: "geo-07-001", cat: "geography", age: 7, diff: 1, q: "What is the capital of Japan?", choices: ["Beijing","Tokyo","Seoul","Bangkok"], answer: 1, explain: "Tokyo is the capital of Japan." },
  { id: "geo-07-002", cat: "geography", age: 7, diff: 1, q: "Which ocean is named after a country?", choices: ["Pacific Ocean","Indian Ocean","Atlantic Ocean","Arctic Ocean"], answer: 1, explain: "The Indian Ocean is named after India." },
  { id: "geo-07-003", cat: "geography", age: 7, diff: 1, q: "Which is the biggest continent?", choices: ["Africa","Europe","Asia","Australia"], answer: 2, explain: "Asia is the largest continent by area and by number of people." },
  { id: "geo-07-004", cat: "geography", age: 7, diff: 2, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"50\" height=\"100\" fill=\"#0055a4\"/><rect x=\"50\" y=\"0\" width=\"50\" height=\"100\" fill=\"#ffffff\"/><rect x=\"100\" y=\"0\" width=\"50\" height=\"100\" fill=\"#ef4135\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["Italy","France","Ireland","Germany"], answer: 1, explain: "France's flag has blue, white and red vertical stripes." },
  { id: "geo-07-005", cat: "geography", age: 7, diff: 2, q: "Which mountain range lies in the north of India?", choices: ["Andes","Alps","Himalayas","Rockies"], answer: 2, explain: "The Himalayas run along the north of India." },
  { id: "geo-07-006", cat: "geography", age: 7, diff: 2, q: "What tool shows directions like north and south?", choices: ["Thermometer","Clock","Compass","Ruler"], answer: 2, explain: "A compass needle points north." },
  { id: "geo-07-007", cat: "geography", age: 7, diff: 2, q: "In which country is the Eiffel Tower?", choices: ["France","Italy","USA","India"], answer: 0, explain: "The Eiffel Tower is in Paris, France." },
  { id: "geo-07-008", cat: "geography", age: 7, diff: 2, q: "Which is the largest desert in India?", choices: ["Sahara Desert","Gobi Desert","Kalahari Desert","Thar Desert"], answer: 3, explain: "The Thar Desert is in Rajasthan, India." },
  { id: "geo-07-009", cat: "geography", age: 7, diff: 2, q: "What is the capital of the United Kingdom?", choices: ["London","Paris","Dublin","Rome"], answer: 0, explain: "London is the capital of the United Kingdom." },
  { id: "geo-07-010", cat: "geography", age: 7, diff: 3, q: "Which is the longest river in the world?", choices: ["Ganga","Nile","Thames","Yamuna"], answer: 1, explain: "The Nile in Africa is usually counted as the world's longest river." },
  { id: "geo-07-011", cat: "geography", age: 7, diff: 3, q: "In which city is the Gateway of India?", choices: ["Delhi","Jaipur","Mumbai","Kolkata"], answer: 2, explain: "The Gateway of India stands by the sea in Mumbai." },
  { id: "geo-07-012", cat: "geography", age: 7, diff: 3, q: "Which country is shaped like a boot?", choices: ["India","Japan","Brazil","Italy"], answer: 3, explain: "Italy is long and shaped like a boot on the map." },
  { id: "geo-07-013", cat: "geography", age: 7, diff: 3, q: "Which imaginary line runs around the middle of the Earth?", choices: ["Prime Meridian","North Pole","Tropic of Capricorn","Equator"], answer: 3, explain: "The Equator divides the Earth into northern and southern halves." },
  { id: "geo-08-001", cat: "geography", age: 8, diff: 1, q: "What is the capital of Australia?", choices: ["Canberra","Sydney","Melbourne","Perth"], answer: 0, explain: "Canberra is the capital of Australia, even though Sydney is bigger." },
  { id: "geo-08-002", cat: "geography", age: 8, diff: 1, q: "How many oceans are there on Earth?", choices: ["5","3","4","7"], answer: 0, explain: "The 5 oceans are Pacific, Atlantic, Indian, Southern and Arctic." },
  { id: "geo-08-003", cat: "geography", age: 8, diff: 1, q: "Which continent is home to the Sahara Desert?", choices: ["Asia","Europe","Australia","Africa"], answer: 3, explain: "The huge Sahara Desert covers much of northern Africa." },
  { id: "geo-08-004", cat: "geography", age: 8, diff: 2, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"50\" height=\"100\" fill=\"#009246\"/><rect x=\"50\" y=\"0\" width=\"50\" height=\"100\" fill=\"#ffffff\"/><rect x=\"100\" y=\"0\" width=\"50\" height=\"100\" fill=\"#ce2b37\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["France","Ireland","Italy","India"], answer: 2, explain: "Italy's flag has green, white and red vertical stripes." },
  { id: "geo-08-005", cat: "geography", age: 8, diff: 2, q: "Which state of India is known as \"God's Own Country\"?", choices: ["Punjab","Goa","Gujarat","Kerala"], answer: 3, explain: "Kerala is often called \"God's Own Country\"." },
  { id: "geo-08-006", cat: "geography", age: 8, diff: 2, q: "Which is the largest country in the world by area?", choices: ["India","China","Brazil","Russia"], answer: 3, explain: "Russia is the largest country by land area." },
  { id: "geo-08-007", cat: "geography", age: 8, diff: 2, q: "Which is the largest hot desert in the world?", choices: ["Thar","Gobi","Sahara","Atacama"], answer: 2, explain: "The Sahara in Africa is the largest hot desert." },
  { id: "geo-08-008", cat: "geography", age: 8, diff: 2, q: "What is the capital of the USA?", choices: ["New York","Los Angeles","Chicago","Washington, D.C."], answer: 3, explain: "Washington, D.C. is the capital of the United States." },
  { id: "geo-08-009", cat: "geography", age: 8, diff: 2, q: "Which Indian city is known as the \"Pink City\"?", choices: ["Udaipur","Chandigarh","Jaipur","Pune"], answer: 2, explain: "Jaipur is called the Pink City because of its pink buildings." },
  { id: "geo-08-010", cat: "geography", age: 8, diff: 3, q: "Through which country does the Amazon River mostly flow?", choices: ["Egypt","India","Brazil","Canada"], answer: 2, explain: "Most of the Amazon River flows through Brazil." },
  { id: "geo-08-011", cat: "geography", age: 8, diff: 3, q: "Which Indian river is called the \"Dakshin Ganga\" (Ganga of the South)?", choices: ["Kaveri","Godavari","Krishna","Tapi"], answer: 1, explain: "The Godavari is the longest river of peninsular India, so it is called the Dakshin Ganga." },
  { id: "geo-08-012", cat: "geography", age: 8, diff: 3, q: "What do we call a large mass of slowly moving ice?", choices: ["Volcano","Glacier","Delta","Plateau"], answer: 1, explain: "A glacier is a huge river of ice that moves very slowly." },
  { id: "geo-08-013", cat: "geography", age: 8, diff: 3, q: "Which sea lies to the west of India?", choices: ["Red Sea","Black Sea","Dead Sea","Arabian Sea"], answer: 3, explain: "The Arabian Sea lies to the west of India." },
  { id: "geo-09-001", cat: "geography", age: 9, diff: 1, q: "What is the capital of China?", choices: ["Shanghai","Hong Kong","Beijing","Tokyo"], answer: 2, explain: "Beijing is the capital of China." },
  { id: "geo-09-002", cat: "geography", age: 9, diff: 1, q: "Which bay lies to the east of India?", choices: ["Bay of Biscay","Bay of Bengal","Hudson Bay","Bay of Fundy"], answer: 1, explain: "The Bay of Bengal lies to the east of India." },
  { id: "geo-09-003", cat: "geography", age: 9, diff: 1, q: "Which line divides the Earth into Eastern and Western Hemispheres?", choices: ["Equator","Tropic of Cancer","Arctic Circle","Prime Meridian"], answer: 3, explain: "The Prime Meridian (0 degrees longitude) passes through Greenwich, London." },
  { id: "geo-09-004", cat: "geography", age: 9, diff: 2, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"34\" fill=\"#000000\"/><rect x=\"0\" y=\"33\" width=\"150\" height=\"34\" fill=\"#dd0000\"/><rect x=\"0\" y=\"66\" width=\"150\" height=\"34\" fill=\"#ffce00\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["Belgium","Netherlands","Austria","Germany"], answer: 3, explain: "Germany's flag has black, red and gold horizontal stripes." },
  { id: "geo-09-005", cat: "geography", age: 9, diff: 2, q: "Which river is called the \"Sorrow of Bihar\" because of its floods?", choices: ["Ganga","Brahmaputra","Godavari","Kosi"], answer: 3, explain: "The Kosi river often floods, so it is called the Sorrow of Bihar." },
  { id: "geo-09-006", cat: "geography", age: 9, diff: 2, q: "Which continent has the most countries?", choices: ["Asia","Europe","South America","Africa"], answer: 3, explain: "Africa has 54 countries, the most of any continent." },
  { id: "geo-09-007", cat: "geography", age: 9, diff: 2, q: "What is a piece of land almost surrounded by water called?", choices: ["Island","Plateau","Peninsula","Valley"], answer: 2, explain: "A peninsula has water on three sides. India is a peninsula." },
  { id: "geo-09-008", cat: "geography", age: 9, diff: 2, q: "Which is the southernmost tip of mainland India?", choices: ["Kanyakumari","Chennai","Goa","Kochi"], answer: 0, explain: "Kanyakumari is at the southern tip of mainland India." },
  { id: "geo-09-009", cat: "geography", age: 9, diff: 2, q: "Which mountain range separates Europe from Asia?", choices: ["Himalayas","Andes","Ural Mountains","Rockies"], answer: 2, explain: "The Ural Mountains are seen as part of the border between Europe and Asia." },
  { id: "geo-09-010", cat: "geography", age: 9, diff: 3, q: "The Tropic of Cancer passes through how many Indian states?", choices: ["8","3","12","1"], answer: 0, explain: "The Tropic of Cancer passes through 8 Indian states, from Gujarat to Mizoram." },
  { id: "geo-09-011", cat: "geography", age: 9, diff: 3, q: "Which is the largest island in the world?", choices: ["Australia","Sri Lanka","Madagascar","Greenland"], answer: 3, explain: "Greenland is the largest island. Australia is counted as a continent." },
  { id: "geo-09-012", cat: "geography", age: 9, diff: 3, q: "Which country is known as the Land of the Rising Sun?", choices: ["China","Japan","India","Thailand"], answer: 1, explain: "Japan is called the Land of the Rising Sun." },
  { id: "geo-09-013", cat: "geography", age: 9, diff: 3, q: "What is the capital of Egypt?", choices: ["Alexandria","Giza","Luxor","Cairo"], answer: 3, explain: "Cairo, on the River Nile, is the capital of Egypt." },
  { id: "geo-10-001", cat: "geography", age: 10, diff: 1, q: "What is the capital of Canada?", choices: ["Toronto","Vancouver","Montreal","Ottawa"], answer: 3, explain: "Ottawa is the capital of Canada." },
  { id: "geo-10-002", cat: "geography", age: 10, diff: 1, q: "Which river is the longest in South America?", choices: ["Amazon","Nile","Mississippi","Danube"], answer: 0, explain: "The Amazon is the longest river in South America." },
  { id: "geo-10-003", cat: "geography", age: 10, diff: 1, q: "Which country is both a continent and a country?", choices: ["Australia","India","Africa","Greenland"], answer: 0, explain: "Australia is the only country that is also a whole continent." },
  { id: "geo-10-004", cat: "geography", age: 10, diff: 2, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 90\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"90\" fill=\"#006a4e\"/><circle cx=\"67.5\" cy=\"45\" r=\"30\" fill=\"#f42a41\"/></svg>", choices: ["Japan","Bangladesh","Indonesia","Pakistan"], answer: 1, explain: "Bangladesh's flag is green with a red circle." },
  { id: "geo-10-005", cat: "geography", age: 10, diff: 2, q: "What is the capital of Nepal?", choices: ["Pokhara","Thimphu","Dhaka","Kathmandu"], answer: 3, explain: "Kathmandu is the capital of Nepal." },
  { id: "geo-10-006", cat: "geography", age: 10, diff: 2, q: "Which Indian state has the longest coastline?", choices: ["Gujarat","Kerala","Goa","Odisha"], answer: 0, explain: "Gujarat has the longest coastline of any Indian state." },
  { id: "geo-10-007", cat: "geography", age: 10, diff: 2, q: "What do we call the lines on a map that run from the North Pole to the South Pole?", choices: ["Lines of latitude","Contour lines","Equators","Lines of longitude"], answer: 3, explain: "Lines of longitude (meridians) run from pole to pole." },
  { id: "geo-10-008", cat: "geography", age: 10, diff: 2, q: "Which is the deepest ocean trench in the world?", choices: ["Mariana Trench","Java Trench","Puerto Rico Trench","Tonga Rift"], answer: 0, explain: "The Mariana Trench in the Pacific is the deepest known part of the ocean." },
  { id: "geo-10-009", cat: "geography", age: 10, diff: 2, q: "Which strait separates India and Sri Lanka?", choices: ["Strait of Gibraltar","Bering Strait","Palk Strait","Strait of Malacca"], answer: 2, explain: "The Palk Strait lies between India and Sri Lanka." },
  { id: "geo-10-010", cat: "geography", age: 10, diff: 3, q: "What is the capital of Brazil?", choices: ["Rio de Janeiro","Brasilia","Sao Paulo","Buenos Aires"], answer: 1, explain: "Brasilia became Brazil's capital in 1960." },
  { id: "geo-10-011", cat: "geography", age: 10, diff: 3, q: "Which Indian plateau lies south of the Narmada river?", choices: ["Deccan Plateau","Malwa Plateau","Chota Nagpur Plateau","Tibetan Plateau"], answer: 0, explain: "The Deccan Plateau covers much of southern India." },
  { id: "geo-10-012", cat: "geography", age: 10, diff: 3, q: "Which African mountain is the tallest in Africa?", choices: ["Mount Kilimanjaro","Mount Kenya","Atlas Mountains","Table Mountain"], answer: 0, explain: "Mount Kilimanjaro in Tanzania is Africa's highest mountain." },
  { id: "geo-10-013", cat: "geography", age: 10, diff: 3, q: "Which two continents does Egypt connect through the Sinai Peninsula?", choices: ["Africa and Europe","Asia and Europe","Asia and Australia","Africa and Asia"], answer: 3, explain: "The Sinai Peninsula links Africa with Asia." },
  { id: "geo-11-001", cat: "geography", age: 11, diff: 1, q: "What is the capital of Germany?", choices: ["Munich","Frankfurt","Vienna","Berlin"], answer: 3, explain: "Berlin is the capital of Germany." },
  { id: "geo-11-002", cat: "geography", age: 11, diff: 1, q: "Which is the smallest country in the world?", choices: ["Monaco","Maldives","Vatican City","Nepal"], answer: 2, explain: "Vatican City, inside Rome, is the smallest country in the world." },
  { id: "geo-11-003", cat: "geography", age: 11, diff: 1, q: "Which ocean lies between Africa and Australia?", choices: ["Atlantic Ocean","Pacific Ocean","Arctic Ocean","Indian Ocean"], answer: 3, explain: "The Indian Ocean lies between Africa, Asia and Australia." },
  { id: "geo-11-004", cat: "geography", age: 11, diff: 2, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"50\" fill=\"#ce1126\"/><rect x=\"0\" y=\"50\" width=\"150\" height=\"50\" fill=\"#ffffff\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["Indonesia","Japan","Austria","Ukraine"], answer: 0, explain: "Indonesia's flag has a red stripe on top and a white stripe below." },
  { id: "geo-11-005", cat: "geography", age: 11, diff: 2, q: "Which river forms the largest delta in the world with the Ganga?", choices: ["Brahmaputra","Indus","Narmada","Kaveri"], answer: 0, explain: "The Ganga and Brahmaputra together form the Sundarbans delta, the largest in the world." },
  { id: "geo-11-006", cat: "geography", age: 11, diff: 2, q: "Which canal connects the Mediterranean Sea and the Red Sea?", choices: ["Panama Canal","Suez Canal","Kiel Canal","Grand Canal"], answer: 1, explain: "The Suez Canal in Egypt links the Mediterranean and Red Seas." },
  { id: "geo-11-007", cat: "geography", age: 11, diff: 2, q: "In which Indian state is the hill station Darjeeling?", choices: ["Himachal Pradesh","West Bengal","Uttarakhand","Sikkim"], answer: 1, explain: "Darjeeling, famous for tea, is in West Bengal." },
  { id: "geo-11-008", cat: "geography", age: 11, diff: 2, q: "Which country has the city of Istanbul, which lies in two continents?", choices: ["Greece","Egypt","Russia","Turkey"], answer: 3, explain: "Istanbul in Turkey lies partly in Europe and partly in Asia." },
  { id: "geo-11-009", cat: "geography", age: 11, diff: 2, q: "What is the name of the large grasslands of Africa with lions and zebras?", choices: ["Tundra","Savanna","Taiga","Steppe of Asia"], answer: 1, explain: "Savannas are wide grasslands with scattered trees." },
  { id: "geo-11-010", cat: "geography", age: 11, diff: 3, q: "Which Himalayan peak on the Sikkim-Nepal border is the third-highest mountain in the world?", choices: ["Nanda Devi","Kangchenjunga","Kamet","Trisul"], answer: 1, explain: "Kangchenjunga, on the border of Sikkim and Nepal, is the third-highest mountain on Earth." },
  { id: "geo-11-011", cat: "geography", age: 11, diff: 3, q: "Which is the largest freshwater lake in India?", choices: ["Chilika Lake","Dal Lake","Sambhar Lake","Wular Lake"], answer: 3, explain: "Wular Lake in Jammu and Kashmir is India's largest freshwater lake." },
  { id: "geo-11-012", cat: "geography", age: 11, diff: 3, q: "What is the term for the line of 180 degrees longitude where the date changes?", choices: ["Equator","Prime Meridian","International Date Line","Tropic of Cancer"], answer: 2, explain: "Crossing the International Date Line changes the calendar date by one day." },
  { id: "geo-11-013", cat: "geography", age: 11, diff: 3, q: "Which South American mountain range is the longest in the world?", choices: ["Himalayas","Rockies","Andes","Alps"], answer: 2, explain: "The Andes run about 7,000 km along western South America." },
  { id: "geo-12-001", cat: "geography", age: 12, diff: 1, q: "What is the capital of South Africa's government (executive capital)?", choices: ["Cape Town","Johannesburg","Pretoria","Durban"], answer: 2, explain: "Pretoria is the executive capital. South Africa has three capital cities." },
  { id: "geo-12-002", cat: "geography", age: 12, diff: 1, q: "Which flag is this?", svg: "<svg viewBox=\"0 0 150 100\"><rect x=\"0\" y=\"0\" width=\"150\" height=\"50\" fill=\"#0057b7\"/><rect x=\"0\" y=\"50\" width=\"150\" height=\"50\" fill=\"#ffd700\"/><rect x=\"0.5\" y=\"0.5\" width=\"149\" height=\"99\" fill=\"none\" stroke=\"#999\"/></svg>", choices: ["Sweden","Ukraine","Indonesia","Germany"], answer: 1, explain: "Ukraine's flag has a blue stripe over a yellow stripe." },
  { id: "geo-12-003", cat: "geography", age: 12, diff: 1, q: "Majuli in Assam, one of the largest river islands in the world, lies in which river?", choices: ["Ganga","Godavari","Brahmaputra","Narmada"], answer: 2, explain: "Majuli is a huge island in the middle of the Brahmaputra river in Assam." },
  { id: "geo-12-004", cat: "geography", age: 12, diff: 2, q: "Which latitude line is called the Tropic of Capricorn?", choices: ["23.5 degrees North","0 degrees","23.5 degrees South","66.5 degrees North"], answer: 2, explain: "The Tropic of Capricorn lies at about 23.5 degrees south of the Equator." },
  { id: "geo-12-005", cat: "geography", age: 12, diff: 2, q: "Which country has the most time zones, including overseas territories?", choices: ["India","China","Brazil","France"], answer: 3, explain: "With its overseas territories, France spans 12 time zones." },
  { id: "geo-12-006", cat: "geography", age: 12, diff: 2, q: "Which Indian river flows westward into the Arabian Sea?", choices: ["Narmada","Godavari","Krishna","Mahanadi"], answer: 0, explain: "The Narmada flows west into the Arabian Sea. Most big peninsular rivers flow east." },
  { id: "geo-12-007", cat: "geography", age: 12, diff: 2, q: "What do we call a wind system that brings heavy rain to India in summer?", choices: ["Tornado","Monsoon","Blizzard","Sandstorm"], answer: 1, explain: "The south-west monsoon brings most of India's rainfall from June to September." },
  { id: "geo-12-008", cat: "geography", age: 12, diff: 2, q: "Which landlocked country lies between India and China?", choices: ["Sri Lanka","Myanmar","Nepal","Bangladesh"], answer: 2, explain: "Nepal is landlocked and lies between India and China." },
  { id: "geo-12-009", cat: "geography", age: 12, diff: 2, q: "Which sea is so salty that people float easily in it?", choices: ["Red Sea","Arabian Sea","Black Sea","Dead Sea"], answer: 3, explain: "The Dead Sea is extremely salty, so people float in it easily." },
  { id: "geo-12-010", cat: "geography", age: 12, diff: 3, q: "What type of map shows heights of land using lines joining equal heights?", choices: ["Political map","Contour map","Road map","Weather map"], answer: 1, explain: "Contour lines connect points at the same height above sea level." },
  { id: "geo-12-011", cat: "geography", age: 12, diff: 3, q: "Which ocean current keeps western Europe warmer than other places at the same latitude?", choices: ["Humboldt Current","Kuroshio Current","Benguela Current","Gulf Stream"], answer: 3, explain: "The Gulf Stream carries warm water from the Caribbean towards Europe." },
  { id: "geo-12-012", cat: "geography", age: 12, diff: 3, q: "The Strait of Gibraltar separates which two continents?", choices: ["Europe and Africa","Asia and Africa","Europe and Asia","North and South America"], answer: 0, explain: "The narrow Strait of Gibraltar lies between Spain (Europe) and Morocco (Africa)." },
  { id: "geo-12-013", cat: "geography", age: 12, diff: 3, q: "Which Indian state is surrounded by Bangladesh on three sides?", choices: ["Assam","Tripura","Manipur","Nagaland"], answer: 1, explain: "Tripura is bordered by Bangladesh on the north, west and south." },
  { id: "logic-04-001", cat: "logic", age: 4, diff: 1, q: "What comes next? 🔴🔵🔴🔵🔴 ...", choices: ["Red circle","Green circle","Blue circle","Yellow circle"], answer: 2, explain: "The pattern goes red, blue, red, blue. After red comes blue." },
  { id: "logic-04-002", cat: "logic", age: 4, diff: 1, q: "Which one is different?", pic: "🍎🍌🥭🚗", choices: ["Apple","Banana","Car","Mango"], answer: 2, explain: "Apple, banana and mango are fruits. A car is not." },
  { id: "logic-04-003", cat: "logic", age: 4, diff: 1, q: "What comes next? 🐱🐶🐱🐶🐱 ...", choices: ["Dog","Cat","Cow","Fish"], answer: 0, explain: "The pattern is cat, dog, cat, dog. Next is dog." },
  { id: "logic-04-004", cat: "logic", age: 4, diff: 2, q: "Which is the biggest?", choices: ["Mouse","Elephant","Cat","Ant"], answer: 1, explain: "An elephant is much bigger than a mouse, a cat or an ant." },
  { id: "logic-04-005", cat: "logic", age: 4, diff: 2, q: "Which one is different?", pic: "🐶🐱🐮🐟", choices: ["Dog","Fish","Cat","Cow"], answer: 1, explain: "Dog, cat and cow live on land. A fish lives in water." },
  { id: "logic-04-006", cat: "logic", age: 4, diff: 2, q: "What goes with a sock?", choices: ["Plate","Shoe","Spoon","Pillow"], answer: 1, explain: "We wear a sock and a shoe on our foot." },
  { id: "logic-04-007", cat: "logic", age: 4, diff: 2, q: "What comes next? ⭐🌙⭐🌙⭐ ...", choices: ["Star","Sun","Cloud","Moon"], answer: 3, explain: "The pattern is star, moon, star, moon. Next is moon." },
  { id: "logic-04-008", cat: "logic", age: 4, diff: 2, q: "Which is the smallest?", choices: ["Dog","Horse","Bear","Ant"], answer: 3, explain: "An ant is very tiny." },
  { id: "logic-04-009", cat: "logic", age: 4, diff: 3, q: "What goes with a toothbrush?", choices: ["Pencil","Ball","Toothpaste","Hat"], answer: 2, explain: "We put toothpaste on a toothbrush." },
  { id: "logic-04-010", cat: "logic", age: 4, diff: 3, q: "What comes next? 1, 2, 3, 4, ...", choices: ["6","1","3","5"], answer: 3, explain: "We count up by 1: 1, 2, 3, 4, 5." },
  { id: "logic-04-011", cat: "logic", age: 4, diff: 3, q: "Which one does not belong?", choices: ["Hat","Red","Blue","Green"], answer: 0, explain: "Red, blue and green are colours. A hat is not a colour." },
  { id: "logic-04-012", cat: "logic", age: 4, diff: 3, q: "Which one has the most?", choices: ["🍓🍓🍓🍓","🍓","🍓🍓","🍓🍓🍓"], answer: 0, explain: "The group with 4 strawberries has the most." },
  { id: "logic-04-013", cat: "logic", age: 4, diff: 3, q: "What do you do first?", choices: ["Put on shoes","Tie shoelaces","Go outside","Put on socks"], answer: 3, explain: "We put on socks first, then shoes." },
  { id: "logic-05-001", cat: "logic", age: 5, diff: 1, q: "What comes next? 🟥🟥🟦🟥🟥🟦🟥🟥 ...", choices: ["Red square","Green square","Blue square","Yellow square"], answer: 2, explain: "The pattern is red, red, blue. After two reds comes blue." },
  { id: "logic-05-002", cat: "logic", age: 5, diff: 1, q: "Which one is different?", choices: ["Rose","Lily","Sunflower","Spoon"], answer: 3, explain: "Rose, lily and sunflower are flowers. A spoon is not." },
  { id: "logic-05-003", cat: "logic", age: 5, diff: 1, q: "What comes next: 2, 4, 6, 8, ...?", choices: ["10","9","12","7"], answer: 0, explain: "We add 2 each time. 8 + 2 = 10." },
  { id: "logic-05-004", cat: "logic", age: 5, diff: 2, q: "Which number is missing? 1, 2, __, 4, 5", choices: ["6","3","0","7"], answer: 1, explain: "Counting in order: 1, 2, 3, 4, 5. The missing number is 3." },
  { id: "logic-05-005", cat: "logic", age: 5, diff: 2, q: "What goes with a lock?", choices: ["Cup","Book","Key","Shoe"], answer: 2, explain: "A key opens a lock." },
  { id: "logic-05-006", cat: "logic", age: 5, diff: 2, q: "Which one does not belong?", choices: ["Lion","Tiger","Bear","Bus"], answer: 3, explain: "Lion, tiger and bear are animals. A bus is a vehicle." },
  { id: "logic-05-007", cat: "logic", age: 5, diff: 2, q: "What comes next? 🍎🍌🍎🍌🍎 ...", choices: ["Banana","Apple","Grapes","Mango"], answer: 0, explain: "The pattern is apple, banana. After apple comes banana." },
  { id: "logic-05-008", cat: "logic", age: 5, diff: 2, q: "A puppy grows up to be a...?", choices: ["Cat","Cow","Dog","Horse"], answer: 2, explain: "A puppy is a baby dog, so it grows up to be a dog." },
  { id: "logic-05-009", cat: "logic", age: 5, diff: 2, q: "What comes after Tuesday?", choices: ["Wednesday","Monday","Friday","Sunday"], answer: 0, explain: "The days go Monday, Tuesday, Wednesday." },
  { id: "logic-05-010", cat: "logic", age: 5, diff: 3, q: "Which is the heaviest?", choices: ["Feather","Truck","Leaf","Balloon"], answer: 1, explain: "A truck is very heavy. The others are light." },
  { id: "logic-05-011", cat: "logic", age: 5, diff: 3, q: "Hand is to glove as foot is to...?", choices: ["Hat","Ring","Scarf","Sock"], answer: 3, explain: "A glove goes on a hand, and a sock goes on a foot." },
  { id: "logic-05-012", cat: "logic", age: 5, diff: 3, q: "What comes next: 10, 9, 8, 7, ...?", choices: ["5","6","8","11"], answer: 1, explain: "We are counting backwards by 1. After 7 comes 6." },
  { id: "logic-05-013", cat: "logic", age: 5, diff: 3, q: "Which one is the odd one out?", choices: ["Square","Apple","Banana","Orange"], answer: 0, explain: "Apple, banana and orange are fruits. A square is a shape." },
  { id: "logic-06-001", cat: "logic", age: 6, diff: 1, q: "What comes next: 5, 10, 15, 20, ...?", choices: ["30","21","22","25"], answer: 3, explain: "We add 5 each time. 20 + 5 = 25." },
  { id: "logic-06-002", cat: "logic", age: 6, diff: 1, q: "What comes next? 🔺🔺🟢🔺🔺🟢🔺🔺 ...", choices: ["Red triangle","Blue square","Green circle","Yellow star"], answer: 2, explain: "The pattern is triangle, triangle, circle. Next is a green circle." },
  { id: "logic-06-003", cat: "logic", age: 6, diff: 1, q: "Bird is to sky as fish is to...?", choices: ["Tree","Water","Road","Nest"], answer: 1, explain: "Birds fly in the sky, and fish swim in water." },
  { id: "logic-06-004", cat: "logic", age: 6, diff: 2, q: "Which number is missing? 10, 20, __, 40", choices: ["25","30","35","50"], answer: 1, explain: "We count by tens: 10, 20, 30, 40." },
  { id: "logic-06-005", cat: "logic", age: 6, diff: 2, q: "Which word does not belong?", choices: ["Mango","Chair","Grapes","Papaya"], answer: 1, explain: "Mango, grapes and papaya are fruits. A chair is furniture." },
  { id: "logic-06-006", cat: "logic", age: 6, diff: 2, q: "How many corners does a square have?", choices: ["4","3","5","0"], answer: 0, explain: "A square has 4 corners." },
  { id: "logic-06-007", cat: "logic", age: 6, diff: 2, q: "If today is Sunday, what day will tomorrow be?", choices: ["Saturday","Monday","Tuesday","Friday"], answer: 1, explain: "The day after Sunday is Monday." },
  { id: "logic-06-008", cat: "logic", age: 6, diff: 2, q: "Day is to night as hot is to...?", choices: ["Sun","Cold","Fire","Warm"], answer: 1, explain: "Day and night are opposites, and hot and cold are opposites." },
  { id: "logic-06-009", cat: "logic", age: 6, diff: 2, q: "Ria is taller than Sam. Sam is taller than Tom. Who is the shortest?", choices: ["Ria","Sam","Tom","They are all the same height"], answer: 2, explain: "Ria is tallest, then Sam, then Tom. So Tom is the shortest." },
  { id: "logic-06-010", cat: "logic", age: 6, diff: 3, q: "What comes next: 1, 3, 5, 7, ...?", choices: ["8","10","11","9"], answer: 3, explain: "These are odd numbers. We add 2 each time." },
  { id: "logic-06-011", cat: "logic", age: 6, diff: 3, q: "What comes next: A, C, E, G, ...?", choices: ["H","J","I","K"], answer: 2, explain: "We skip one letter each time: A, (B), C, (D), E, (F), G, (H), I." },
  { id: "logic-06-012", cat: "logic", age: 6, diff: 3, q: "Which shape has no corners?", choices: ["Square","Triangle","Circle","Rectangle"], answer: 2, explain: "A circle is round, so it has no corners." },
  { id: "logic-06-013", cat: "logic", age: 6, diff: 3, q: "I have 4 legs and say \"meow\". What am I?", choices: ["Dog","Hen","Cow","Cat"], answer: 3, explain: "A cat has 4 legs and says \"meow\"." },
  { id: "logic-07-001", cat: "logic", age: 7, diff: 1, q: "What comes next: 4, 8, 12, 16, ...?", choices: ["20","18","24","22"], answer: 0, explain: "We add 4 each time. 16 + 4 = 20." },
  { id: "logic-07-002", cat: "logic", age: 7, diff: 1, q: "Which month comes after June?", choices: ["May","August","September","July"], answer: 3, explain: "The months go May, June, July." },
  { id: "logic-07-003", cat: "logic", age: 7, diff: 1, q: "Doctor is to hospital as teacher is to...?", choices: ["Shop","School","Farm","Bank"], answer: 1, explain: "A doctor works in a hospital, and a teacher works in a school." },
  { id: "logic-07-004", cat: "logic", age: 7, diff: 2, q: "What comes next: 20, 18, 16, 14, ...?", choices: ["12","13","10","11"], answer: 0, explain: "We subtract 2 each time. 14 - 2 = 12." },
  { id: "logic-07-005", cat: "logic", age: 7, diff: 2, q: "Which number is the odd one out: 2, 4, 7, 8?", choices: ["2","4","8","7"], answer: 3, explain: "2, 4 and 8 are even numbers. 7 is odd." },
  { id: "logic-07-006", cat: "logic", age: 7, diff: 2, q: "What comes next: Z, Y, X, W, ...?", choices: ["U","A","T","V"], answer: 3, explain: "The letters are going backwards through the alphabet. After W comes V." },
  { id: "logic-07-007", cat: "logic", age: 7, diff: 2, q: "A clock shows 3 o'clock. What time will it show 2 hours later?", svg: "<svg viewBox=\"0 0 100 100\"><circle cx=\"50\" cy=\"50\" r=\"45\" fill=\"#fff\" stroke=\"#333\" stroke-width=\"3\"/><text x=\"50.0\" y=\"19.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">12</text><text x=\"67.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">1</text><text x=\"80.3\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">2</text><text x=\"85.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">3</text><text x=\"80.3\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">4</text><text x=\"67.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">5</text><text x=\"50.0\" y=\"89.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">6</text><text x=\"32.5\" y=\"84.3\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">7</text><text x=\"19.7\" y=\"71.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">8</text><text x=\"15.0\" y=\"54.0\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">9</text><text x=\"19.7\" y=\"36.5\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">10</text><text x=\"32.5\" y=\"23.7\" font-size=\"11\" text-anchor=\"middle\" fill=\"#333\" font-family=\"sans-serif\">11</text><line x1=\"50\" y1=\"50\" x2=\"70.0\" y2=\"50.0\" stroke=\"#222\" stroke-width=\"5\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"50\" x2=\"50.0\" y2=\"19.0\" stroke=\"#e63946\" stroke-width=\"3\" stroke-linecap=\"round\"/><circle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#222\"/></svg>", choices: ["5 o'clock","4 o'clock","1 o'clock","6 o'clock"], answer: 0, explain: "3 + 2 = 5, so it will be 5 o'clock." },
  { id: "logic-07-008", cat: "logic", age: 7, diff: 2, q: "How many triangles can you see?", svg: "<svg viewBox=\"0 0 150 60\"><polygon points=\"5,55 25,5 45,55\" fill=\"#ffb703\"/><polygon points=\"55,55 75,5 95,55\" fill=\"#fb8500\"/><polygon points=\"105,55 125,5 145,55\" fill=\"#219ebc\"/></svg>", choices: ["2","4","1","3"], answer: 3, explain: "There are 3 separate triangles in the picture." },
  { id: "logic-07-009", cat: "logic", age: 7, diff: 2, q: "What comes next: 1, 2, 4, 7, 11, ...?", choices: ["16","15","14","12"], answer: 0, explain: "We add 1, then 2, then 3, then 4. Next we add 5: 11 + 5 = 16." },
  { id: "logic-07-010", cat: "logic", age: 7, diff: 3, q: "If you face north and turn right, which way are you facing?", choices: ["West","South","North","East"], answer: 3, explain: "Turning right from north takes you to east." },
  { id: "logic-07-011", cat: "logic", age: 7, diff: 3, q: "Anu has 3 brothers. Each brother has 1 sister. How many sisters are there in the family?", choices: ["3","1","4","2"], answer: 1, explain: "All the brothers share the same sister, Anu. So there is only 1 sister." },
  { id: "logic-07-012", cat: "logic", age: 7, diff: 3, q: "What comes next: 2, 4, 8, 16, ...?", choices: ["24","20","18","32"], answer: 3, explain: "Each number is doubled. 16 x 2 = 32." },
  { id: "logic-07-013", cat: "logic", age: 7, diff: 3, q: "Which word can be made from the letters T, A, C?", choices: ["Cat","Bat","Hat","Can"], answer: 0, explain: "The letters C, A and T make the word \"cat\"." },
  { id: "logic-08-001", cat: "logic", age: 8, diff: 1, q: "What comes next: 1, 4, 9, 16, ...?", choices: ["25","20","24","32"], answer: 0, explain: "These are square numbers: 1x1, 2x2, 3x3, 4x4, then 5x5 = 25." },
  { id: "logic-08-002", cat: "logic", age: 8, diff: 1, q: "Pen is to write as knife is to...?", choices: ["Eat","Cook","Draw","Cut"], answer: 3, explain: "We write with a pen and cut with a knife." },
  { id: "logic-08-003", cat: "logic", age: 8, diff: 1, q: "Which is the odd one out: triangle, square, circle, pentagon?", choices: ["Triangle","Circle","Square","Pentagon"], answer: 1, explain: "Triangle, square and pentagon have straight sides. A circle does not." },
  { id: "logic-08-004", cat: "logic", age: 8, diff: 2, q: "What comes next: 100, 90, 80, 70, ...?", choices: ["50","60","65","75"], answer: 1, explain: "We subtract 10 each time. 70 - 10 = 60." },
  { id: "logic-08-005", cat: "logic", age: 8, diff: 2, q: "If 2 cats catch 2 mice in 2 minutes, how many mice will 1 cat catch in 2 minutes?", choices: ["2","1","4","0"], answer: 1, explain: "Each cat catches 1 mouse in 2 minutes." },
